# CI for the CSS ERP on GitHub Actions (stages from docs/testing/TEST_STRATEGY.md, "CI gate").
# Every pull request and every push to main or develop: install, lint, typecheck, document checks,
# unit and API tests against PostgreSQL 17, build, dependency audit and secret scan. Pushes to main
# and develop also run E2E: develop gets every merged change, main every release. A push to any
# other branch runs nothing, so a branch with a pull request runs once per push
# and the free monthly minutes of a private repository last.
# Nightly runs (full E2E on WebKit, visual regression) are added when those suites exist.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    # the unit, component and database tests alone take about 17 minutes on the hosted runner
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_USER: css
          POSTGRES_PASSWORD: css_ci_only
          POSTGRES_DB: css_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U css -d css_erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Email integration tests; same pinned image as infra/docker-compose.dev.yml.
      mailpit:
        image: axllent/mailpit@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
        ports:
          - 1025:1025
          - 8025:8025
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://css:css_ci_only@127.0.0.1:5432/css_erp_test
      # Integration tests clone per-file databases from a migrated template.
      TEST_DATABASE_URL: postgresql://css:css_ci_only@127.0.0.1:5432/css_erp_test
      # Storage integration tests against MinIO; CI-only placeholder credentials.
      MINIO_TEST_ACCESS_KEY: css_ci_only
      MINIO_TEST_SECRET_KEY: css_ci_only_secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Prisma client lives in apps/api/src/generated (not committed); typecheck, tests and the
      # API build need it. Generation needs no database.
      - run: pnpm --filter @css/api db:generate
      # MinIO needs a server command, which service containers cannot pass; same pinned image as
      # infra/docker-compose.dev.yml (the decision on these images covers dev and test, not production).
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000             -e MINIO_ROOT_USER=css_ci_only -e MINIO_ROOT_PASSWORD=css_ci_only_secret             chainguard/minio@sha256:7df55d002b698e4494a131b848dd553361bbe58b7e19f62d9623c29af1ba9ccf             server /data --address :9000
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9000/minio/health/live && exit 0; sleep 2; done
          docker logs minio; exit 1
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm docs:check
      # the export PDFs print through Chromium inside its sandbox: the browser with its system
      # libraries, and the user namespaces the runner's AppArmor keeps closed by default
      - run: pnpm --filter @css/api exec playwright-core install --with-deps chromium
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm test
      # every registered API operation answered its success status in a test (the responses were
      # validated against docs/api/openapi.yaml by the contract recorder during `pnpm test`)
      - run: pnpm --filter @css/api contract:coverage --no-run
      - run: pnpm build
      # the first route of the PWA stays within the budget of apps/web/scripts/bundle-report.mjs
      # (compressed JavaScript; 400 KB while the web app moves to the asf UI system, then 250 KB)
      - run: pnpm --filter @css/web bundle:report

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # High and critical advisories fail the build.
      - run: pnpm audit --audit-level high
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --verbose

  e2e:
    name: E2E (Playwright)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    # A secret or an unaccepted advisory stops the pipeline before E2E.
    needs: [checks, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The E2E API recreates css_erp_test_e2e here, migrates and seeds it.
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_USER: css
          POSTGRES_PASSWORD: css_ci_only
          POSTGRES_DB: css_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U css -d css_erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://css:css_ci_only@127.0.0.1:5432/css_erp_test_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Prisma client lives in apps/api/src/generated (not committed); typecheck, tests and the
      # API build need it. Generation needs no database.
      - run: pnpm --filter @css/api db:generate
      # Chromium runs every spec as a phone and a desktop; WebKit runs the sign-in, registration and
      # home specs as an iPhone (the `iphone` project of apps/web/playwright.config.ts)
      - run: pnpm --filter @css/web exec playwright install --with-deps chromium webkit
      # the export journey prints a PDF through Chromium inside its sandbox (see the checks job)
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # the web app's contract test: real responses of the seeded E2E API, read with the app's own
      # schemas; the server stops before Playwright starts its own on the same port
      - name: Web contract test
        run: |
          pnpm --filter "./packages/*" build
          pnpm --filter @css/api build
          pnpm --filter @css/api e2e:server > e2e-contract-server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4100/api/v1/readyz > /dev/null && break; sleep 5; done
          CONTRACT_API_URL=http://127.0.0.1:4100 pnpm --filter @css/web test:contract
          pkill -f e2e-server || true
          fuser -k 4100/tcp || true
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14
