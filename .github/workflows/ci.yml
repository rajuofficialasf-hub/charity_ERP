# CI for the CSS ERP on GitHub Actions (stages from docs/testing/TEST_STRATEGY.md, "CI gate").
# Every pull request and every push to main or develop: install, lint, typecheck, document checks,
# unit and API tests against PostgreSQL 17, build, dependency audit and secret scan. E2E runs on
# every pull request into develop, so a change is merged only after the whole suite, and on pushes
# to main and develop: develop gets every merged change, main every release. A push to any other
# branch runs nothing, so a branch with a pull request runs once per push. E2E starts beside the
# unit and API job, after the short audit and secret scan, so a pull request's run ends when the
# longer of the two does (about 19 minutes); the four shards spend about 52 runner minutes of a
# private repository's free monthly minutes on each run.
# E2E runs as four shards side by side (`--shard=i/4`). The hosted runner of a private repository
# has two cores, so Playwright runs one worker, and the whole suite on one runner takes about
# 29 minutes, more than the job's limit; each shard has its own PostgreSQL service and its own
# E2E API, so the shards never share a database, and each finishes in about 13 minutes.
# Nightly runs (full E2E on WebKit, visual regression) are added when those suites exist.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    # the unit, component and database tests take about 19 minutes on the hosted runner and up to
    # half as long again on a slow one (2026-11-14: 26 minutes, cut at the earlier limit of 30)
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_USER: css
          POSTGRES_PASSWORD: css_ci_only
          POSTGRES_DB: css_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U css -d css_erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Email integration tests; same pinned image as infra/docker-compose.dev.yml.
      mailpit:
        image: axllent/mailpit@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
        ports:
          - 1025:1025
          - 8025:8025
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://css:css_ci_only@127.0.0.1:5432/css_erp_test
      # Integration tests clone per-file databases from a migrated template.
      TEST_DATABASE_URL: postgresql://css:css_ci_only@127.0.0.1:5432/css_erp_test
      # Storage integration tests against the SeaweedFS started below, with the one local identity
      # of infra/seaweedfs/s3.json (a css_dev_only pair, which a production start refuses).
      S3_TEST_ENDPOINT: http://127.0.0.1:8333
      S3_TEST_ACCESS_KEY_ID: css_dev_only
      S3_TEST_SECRET_ACCESS_KEY: css_dev_only_secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Prisma client lives in apps/api/src/generated (not committed); typecheck, tests and the
      # API build need it. Generation needs no database.
      - run: pnpm --filter @css/api db:generate
      # SeaweedFS needs a server command, which service containers cannot pass; same pinned images,
      # identity file, bucket bootstrap and volume settings as infra/docker-compose.dev.yml
      # (development and CI only; the runner's small disk would otherwise allow too few volumes).
      - name: Start SeaweedFS and create the buckets
        run: |
          docker run -d --name seaweedfs -p 127.0.0.1:8333:8333 \
            -v "$PWD/infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0 \
            server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json \
            -master.volumeSizeLimitMB=256 -volume.max=100
          ready=0
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8333/healthz >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then docker logs seaweedfs; exit 1; fi
          docker run --rm --network container:seaweedfs \
            -e S3_ENDPOINT=http://127.0.0.1:8333 \
            -e AWS_ACCESS_KEY_ID="$S3_TEST_ACCESS_KEY_ID" \
            -e AWS_SECRET_ACCESS_KEY="$S3_TEST_SECRET_ACCESS_KEY" \
            -v "$PWD/infra/seaweedfs/bootstrap.sh:/bootstrap.sh:ro" --entrypoint sh \
            amazon/aws-cli@sha256:bba262340b0bc7cbf3a8a48612531263b56f4b280c4f036a07816af1b271bda0 \
            /bootstrap.sh
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm docs:check
      # the export PDFs print through Chromium inside its sandbox: the browser with its system
      # libraries, and the user namespaces the runner's AppArmor keeps closed by default. The browser
      # is cached per playwright-core version, and each try of the install has 6 minutes, since the
      # runner's package mirror has held this kind of step for up to 25 minutes.
      - name: playwright-core version
        id: playwright
        run: echo "version=$(pnpm --filter @css/api exec playwright-core --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the Chromium of the PDFs
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-core-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and its system packages
        env:
          CACHED: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          if [ "$CACHED" = "true" ]; then what="install-deps"; else what="install --with-deps"; fi
          for try in 1 2 3; do
            timeout 360 pnpm --filter @css/api exec playwright-core $what chromium && exit 0
            echo "Try $try did not finish within 6 minutes; trying again."
          done
          exit 1
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm test
      # every registered API operation answered its success status in a test (the responses were
      # validated against docs/api/openapi.yaml by the contract recorder during `pnpm test`)
      - run: pnpm --filter @css/api contract:coverage --no-run
      - run: pnpm build
      # the first route of the PWA stays within the budget of apps/web/scripts/bundle-report.mjs
      # (compressed JavaScript; 400 KB while the web app moves to the asf UI system, then 250 KB)
      - run: pnpm --filter @css/web bundle:report

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # High and critical advisories fail the build.
      - run: pnpm audit --audit-level high
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --verbose

  e2e:
    name: E2E (Playwright ${{ matrix.shard }}/4)
    # the trigger is `pull_request`, never `pull_request_target`: the job runs a pull request's
    # code with a read-only token and no secret, only the throwaway values below (the demo
    # accounts, the service database, local storage), also for a pull request from a fork
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
      || (github.event_name == 'pull_request' && github.base_ref == 'develop')
    # A secret or an unaccepted advisory stops the pipeline before E2E. The unit and API job runs
    # beside it; a merge waits for both.
    needs: [security]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # one shard: about 3 minutes of setup and builds, then up to about 10 minutes of tests, and up
    # to half as long again on a slow runner
    timeout-minutes: 30
    # every shard runs to its end, so one run reports the failures of all four
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # The E2E API of each shard recreates css_erp_test_e2e in the shard's own service, migrates and
    # seeds it.
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_USER: css
          POSTGRES_PASSWORD: css_ci_only
          POSTGRES_DB: css_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U css -d css_erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://css:css_ci_only@127.0.0.1:5432/css_erp_test_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Prisma client lives in apps/api/src/generated (not committed); typecheck, tests and the
      # API build need it. Generation needs no database.
      - run: pnpm --filter @css/api db:generate
      # Chromium runs every spec as a phone and a desktop; WebKit runs the sign-in, registration and
      # home specs as an iPhone (the `iphone` project of apps/web/playwright.config.ts). The browsers
      # are kept in the cache per Playwright version, so a run downloads them only after an upgrade.
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @css/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The system packages the browsers need come from the runner's package mirror, which has held
      # this step for up to 25 minutes and let the job's limit run out before the tests: each try
      # has 6 minutes, and a try that hangs is stopped and made again.
      - name: Install the browsers and their system packages
        env:
          CACHED: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          if [ "$CACHED" = "true" ]; then what="install-deps"; else what="install --with-deps"; fi
          for try in 1 2 3; do
            timeout 360 pnpm --filter @css/web exec playwright $what chromium webkit && exit 0
            echo "Try $try did not finish within 6 minutes; trying again."
          done
          exit 1
      # the export journey prints a PDF through Chromium inside its sandbox (see the checks job)
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # the web app's contract test: real responses of the seeded E2E API, read with the app's own
      # schemas; the server stops before Playwright starts its own on the same port. It runs once,
      # in the first shard.
      - name: Web contract test
        if: matrix.shard == 1
        run: |
          pnpm --filter "./packages/*" build
          pnpm --filter @css/api build
          pnpm --filter @css/api e2e:server > e2e-contract-server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4100/api/v1/readyz > /dev/null && break; sleep 5; done
          CONTRACT_API_URL=http://127.0.0.1:4100 pnpm --filter @css/web test:contract
          pkill -f e2e-server || true
          fuser -k 4100/tcp || true
      # the root script builds, then hands the shard to `playwright test`
      - run: pnpm e2e --shard="$SHARD/4"
        env:
          SHARD: ${{ matrix.shard }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/web/playwright-report
          retention-days: 14
