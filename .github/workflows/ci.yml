# CI for the CSS ERP on GitHub Actions (O-51; stages from TEST_STRATEGY section 6).
# Every push and pull request: install, lint, typecheck, document checks, unit and API tests
# against PostgreSQL 16, build, dependency audit and secret scan. Pushes to main also run E2E.
# Nightly runs (full E2E on WebKit, visual regression) are added when those suites exist.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: css
          POSTGRES_PASSWORD: css_ci_only
          POSTGRES_DB: css_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U css -d css_erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Email integration tests (O-58); same pinned image as infra/docker-compose.dev.yml.
      mailpit:
        image: axllent/mailpit@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
        ports:
          - 1025:1025
          - 8025:8025
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://css:css_ci_only@127.0.0.1:5432/css_erp_test
      # Integration tests clone per-file databases from a migrated template (O-46 item 1).
      TEST_DATABASE_URL: postgresql://css:css_ci_only@127.0.0.1:5432/css_erp_test
      # Storage integration tests against MinIO (O-58); CI-only placeholder credentials.
      MINIO_TEST_ACCESS_KEY: css_ci_only
      MINIO_TEST_SECRET_KEY: css_ci_only_secret
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # MinIO needs a server command, which service containers cannot pass; same pinned image as
      # infra/docker-compose.dev.yml (D-059 covers dev and test, not production).
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000             -e MINIO_ROOT_USER=css_ci_only -e MINIO_ROOT_PASSWORD=css_ci_only_secret             chainguard/minio@sha256:7df55d002b698e4494a131b848dd553361bbe58b7e19f62d9623c29af1ba9ccf             server /data --address :9000
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9000/minio/health/live && exit 0; sleep 2; done
          docker logs minio; exit 1
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm docs:check
      - run: pnpm test
      - run: pnpm build

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # High and critical advisories fail the build (O-46 item 6).
      - run: pnpm audit --audit-level high
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --verbose

  e2e:
    name: E2E (Playwright)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # A secret or an unaccepted advisory stops the pipeline before E2E (O-52).
    needs: [checks, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The E2E API recreates css_erp_test_e2e here, migrates and seeds it (T1.7).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: css
          POSTGRES_PASSWORD: css_ci_only
          POSTGRES_DB: css_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U css -d css_erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://css:css_ci_only@127.0.0.1:5432/css_erp_test_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @css/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14
