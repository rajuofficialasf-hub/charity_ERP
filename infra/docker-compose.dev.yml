# Development services for the CSS ERP (docs/architecture/SYSTEM_ARCHITECTURE.md, "Environments
# and deployment").
# Start from the repository root with `docker compose up -d` (compose.yaml includes this file).
# Every port is bound to 127.0.0.1 only. The credentials below are dev-only defaults
# that can be overridden from a root .env file (see infra/.env.example); staging and production
# use their own compose project and secrets.
#
# Images are pinned by digest. The local S3 stand-in is SeaweedFS (development and CI only);
# production storage is the NAS, or the store chosen before the first deployment
# (docs/ops/DEPLOYMENT.md).

name: css-erp-dev

services:
  postgres:
    # postgres:17.11-alpine, the standard's PostgreSQL 17. A 16 data directory cannot be opened by
    # 17, so the
    # volume is pg-data-17; the old `pg-data` volume of 16 stays until the owner removes it
    # (`docker volume rm css-erp-dev_pg-data`); dev data is seed data (`pnpm db:migrate && pnpm db:seed`).
    image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-css}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-css_dev_only}
      POSTGRES_DB: css_erp_dev
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pg-data-17:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d css_erp_dev']
      interval: 5s
      timeout: 5s
      retries: 20

  seaweedfs:
    # chrislusf/seaweedfs:4.53 (Apache-2.0): master, volume, filer and the S3 gateway in one
    # process. s3.json holds the one local identity, whose key pair carries the css_dev_only mark,
    # so a production start refuses it; with an identity configured an unsigned request is refused.
    # The S3 port is 8333 inside and 8334 on this machine, beside another local SeaweedFS on its
    # default port. The volume count is fixed and the volumes small: left to itself SeaweedFS takes
    # its count from the free disk divided by the volume size, gives each new bucket several
    # volumes, and refuses a write to the next bucket once the count is spent ("no free volumes").
    image: chrislusf/seaweedfs@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -master.volumeSizeLimitMB=256
      - -volume.max=100
    ports:
      - '127.0.0.1:${S3_PORT:-8334}:8333'
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://127.0.0.1:8333/healthz']
      interval: 2s
      timeout: 3s
      retries: 30

  seaweedfs-init:
    # amazon/aws-cli:2.39.7, used once to create the buckets (seaweedfs/bootstrap.sh)
    image: amazon/aws-cli@sha256:bba262340b0bc7cbf3a8a48612531263b56f4b280c4f036a07816af1b271bda0
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
      AWS_ACCESS_KEY_ID: css_dev_only
      AWS_SECRET_ACCESS_KEY: css_dev_only_secret
    volumes:
      - ./seaweedfs/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ['sh', '/bootstrap.sh']
    restart: 'no'

  mailpit:
    # axllent/mailpit:v1.31.5; SMTP on 1025, web inbox on 8025
    image: axllent/mailpit@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'

volumes:
  pg-data-17:
  seaweedfs-data:
