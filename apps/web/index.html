<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <!--
      The order of the CSS cascade layers, before any style of the page: MUI's styles (the mui
      layer, inserted at the emotion insertion point below) sit above the base element defaults and
      under the design system's components and the pages' own rules.
    -->
    <style>
      @layer base, mui, components;
    </style>
    <meta name="emotion-insertion-point" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#008E48" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>CSS ERP</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
