packages:
  - apps/*
  - packages/*
minimumReleaseAgeExclude:
  - prettier@3.9.10

# Dependencies allowed to run install scripts (pnpm blocks all others).
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  core-js: false
  msw: false
  # next-intl's message extractor watcher (not used; T1.5): no install script.
  '@parcel/watcher': false

overrides:
  # Security fixes for transitive dependencies of the Prisma CLI (pnpm audit, 2026-10-11);
  # remove when Prisma ships the patched versions.
  mysql2: 3.24.5
  deepmerge-ts: 8.0.2
