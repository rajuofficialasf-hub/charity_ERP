packages:
  - apps/*
  - packages/*
minimumReleaseAgeExclude:
  - prettier@3.9.10

# Dependencies allowed to run install scripts (pnpm blocks all others).
allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  core-js: false
  msw: false
  # next-intl's message extractor watcher (not used; T1.5): no install script.
  '@parcel/watcher': false
  # usage telemetry pulled in by swagger-ui-dist (@nestjs/swagger, T1.6): never runs.
  '@scarf/scarf': false

overrides:
  # @swc/core 1.16 refuses to load its native binding when the Windows user cache folder grants
  # rights to other app sandboxes (seen on the owner's machine, 2026-10-11). 1.15.47 is the last
  # release without that check; revisit when a fixed 1.16.x exists.
  '@swc/core': 1.15.47
  # Security fixes for transitive dependencies of the Prisma CLI (pnpm audit, 2026-10-11);
  # remove when Prisma ships the patched versions.
  mysql2: 3.24.5
  deepmerge-ts: 8.0.2
