      operationId: media.work.members
      summary: Set the whole team of a work, each member with one or more production roles; the directors only
      description: >-
        D-101 (2, 5), BR-286. Only a holder of media.work.manage at GLOBAL (the Media Director and the
        Assistant Director) sets the team; a member gets 403. Every member holds a media role and is
        active (422 media.member_not_media), every role is an active production role (422
