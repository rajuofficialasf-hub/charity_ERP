        status: { type: string }
        divisionId: { $ref: '#/components/schemas/Uuid' }
        districtId: { $ref: '#/components/schemas/Uuid' }
        upazilaId: { $ref: '#/components/schemas/Uuid' }
        unionId: { type: string, format: uuid, x-sensitive-class: beneficiary.address_detail }
        village: { type: string, x-sensitive-class: beneficiary.address_detail }
        mobile: { type: string, x-sensitive-class: beneficiary.contact }
        isBlocked: { type: boolean, x-sensitive-class: beneficiary.care }
    BeneficiaryStatistics:
