        schema: { $ref: '#/components/schemas/Uuid' }
    patch:
      tags: [media]
      operationId: media.work.update
      summary: Move a work to another stage, or change its title, content type or script; the stage rules decide who may move it where
      description: >-
        D-101 (5, 6), D-136, BR-267. The team moves a work among the active ordinary stages and to
        ready_to_publish (never straight from in_review); the directors also hold it (on_hold, back
        to the stage it left), cancel it and mark a published work done; accepted is set only by the
        acceptance and published only by the first publication after the final review. Any other
        move gets 409 media.stage_not_allowed; a done or cancelled work 409 media.work_closed. The
        title is the directors' (403 for a member); the script needs story.manage. Moving back from
