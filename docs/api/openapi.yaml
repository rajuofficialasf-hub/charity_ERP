      type: object
      required: [data]
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/MyProject'
            - type: object
              required: [rules]
              properties:
                rules:
                  type: object
                  required: [version, parts]
                  properties:
                    version: { type: integer }
                    parts:
                      type: array
                      items:
                        type: object
                        required: [part, text]
                        properties:
                          part: { $ref: '#/components/schemas/RulesPart' }
                          text: { $ref: '#/components/schemas/Bilingual' }
    TeamMember:
      type: object
      required: [volunteerId, displayName, type, consentStatus, addedAt]
      properties:
        volunteerId: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string }
        type: { type: string }
        consentStatus: { type: string, enum: [pending, accepted] }
        addedAt: { type: string, format: date-time }
    TeamCandidate:
      type: object
      required: [volunteerId, displayName, type]
      properties:
        volunteerId: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string }
        type: { type: string }
    TeamResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [members, candidates]
          properties:
            members: { type: array, items: { $ref: '#/components/schemas/TeamMember' } }
            candidates: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/TeamCandidate' } }
    TeamAddRequest:
      type: object
      additionalProperties: false
      required: [memberVolunteerIds]
      properties:
        memberVolunteerIds:
          type: array
          minItems: 1
          maxItems: 50
          description: Each volunteer once.
          items: { type: string, format: uuid }
    CategoryRequest:
      type: object
      required: [comment]
      properties:
        category: { type: [string, 'null'], enum: [A, B, C, D, null] }
        inactiveFlag: { type: boolean }
        comment: { type: string, minLength: 3, description: Mandatory (BR-045) }
    BlocklistRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 1000 }
    BlocklistEntry:
      type: object
      required: [id, subjectType, subjectId, active, blockedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        subjectType: { type: string, enum: [volunteer, beneficiary] }
        subjectId: { $ref: '#/components/schemas/Uuid' }
        reason: { type: string, x-sensitive-class: blocklist.reason }
        active: { type: boolean }
        blockedAt: { type: string, format: date-time }
        releasedAt: { type: [string, 'null'], format: date-time }
    BlocklistResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/BlocklistEntry' }
        meta: { $ref: '#/components/schemas/Meta' }
    TransferRequest:
