        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          schema: { type: string, description: Comma-separated common states }
        - name: stage
          in: query
          schema: { type: string }
        - name: districtId
          in: query
          schema: { type: string, format: uuid }
        - name: unionId
          in: query
          schema: { type: string, format: uuid }
        - name: ownerVolunteerId
          in: query
          schema: { type: string, format: uuid }
        - name: flag
          in: query
          schema: { type: string }
        - name: submittedFrom
          in: query
          schema: { type: string, format: date }
        - name: submittedTo
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Applications
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [applications]
      operationId: applications.application.create
      summary: Create a draft application (same endpoint online and offline; clientUuid is the idempotency key)
      x-permission: application.create
      x-scope: project
      x-audit: application.create
      x-idempotency: clientUuid
      x-rate-limit: default
      x-sensitive-fields: [beneficiary.nid]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationCreate' }
      responses:
        '201':
          description: Draft created (or needs_verification on an identity collision)
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationResponse' }
        '200':
          description: Replay of the same clientUuid
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
