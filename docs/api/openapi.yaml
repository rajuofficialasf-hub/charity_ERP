        decision: { type: string, enum: [approve, reject] }
        reason: { type: string, minLength: 3, maxLength: 1000 }
    ProjectVolunteerCreate:
      type: object
      additionalProperties: false
      required: [volunteers]
      properties:
        volunteers:
          type: array
          minItems: 1
          maxItems: 100
