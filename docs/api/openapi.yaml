    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      tags: [applications]
      operationId: applications.score.get
      summary: Priority score breakdown (officials; BD-17, O-21)
      x-permission: application.view_official_section
      x-scope: application
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      x-sensitive-fields: [application.official_section]
      responses:
        '200':
          description: Score
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScoreResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /applications/{applicationId}/unlocks:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    post:
      tags: [applications]
      operationId: applications.unlock.open
      summary: Open one answer of an approved application for correction, with a reason; the identity, photos, files and calculated answers never open, and one unlock per answer waits at a time
      description: >-
        BD-18, R17, R20, R21, R33. Only text, number, choice, date and address answers open; the
        identity number, the name and the father's or husband's name change only through a profile
        correction request (422 with application.unlock_identity), photos, files and calculations
        never (422 with application.unlock_type). The application must be approved or later and its
        project not closed (409). A second unlock of an answer while one waits is refused (409
        application.unlock_open). The owner volunteer is told which question opened, never why.
      x-permission: application.unlock_field
      x-scope: application
      x-audit: application.unlock_opened
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fieldKey, reason]
              properties:
                fieldKey: { type: string, minLength: 1, maxLength: 100 }
                repeatIndex: { type: integer, minimum: 0, maximum: 199, default: 0 }
                reason: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        '201':
          description: Opened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationUnlockResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /application-unlocks/{unlockId}/value:
    parameters:
      - name: unlockId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    put:
      tags: [applications]
      operationId: applications.unlock.fill
      summary: Enter the new value of an open answer, by the owner volunteer or, when the application has no volunteer or the answer is the official section's, by an official
      description: >-
        R17, R33. The owner volunteer holds application.update_unlocked_field; an official fills with
        application.unlock_field only when the application has no volunteer or the answer belongs to
        the official section (403 otherwise). Anyone else, a blocked volunteer included, gets 404.
        The value is checked like any answer of its question (422), must differ from the old one,
        and waits for an official's decision; the official who opened it is told.
      x-permission: workflow
      x-scope: application
      x-audit: application.unlock_entered
      x-idempotency: none
      x-rate-limit: default
      x-workflow: { scope: field_unlock, action: fill }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [value]
              properties:
                value:
                  type: object
                  propertyNames: { type: string }
                  additionalProperties: {}
                  description: The new answer value in the shape of the application-answer-value schema ({ t, v }); the engine checks it like any answer of its question and names what it refuses
      responses:
        '200':
          description: Entered; waiting for the decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationUnlockResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /application-unlocks/{unlockId}/decision:
    parameters:
      - name: unlockId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    post:
      tags: [applications]
      operationId: applications.unlock.decide
      summary: Accept the entered value (the answer changes and locks again) or refuse it with a reason (the old value stays); never by the person who entered it
      description: >-
        R18, R19, R20. The person who entered the value gets 403 application.unlock_own_entry. An
        accepted value replaces the answer if it is still the one the unlock opened (409
        application.unlock_stale otherwise); a mobile or an address reaches the person's profile
        through the contact service with its own change log, and the application's district and
        union follow an address. Every step stays on the change log and in the audit log.
      x-permission: application.unlock_field
      x-scope: application
      x-audit: application.unlock_decided
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [accept, refuse] }
                reason: { type: string, minLength: 3, maxLength: 1000, description: Required for a refusal }
      responses:
        '200':
          description: Decided; the answer is locked again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationUnlockResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /application-unlocks/{unlockId}/cancel:
    parameters:
      - name: unlockId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    post:
      tags: [applications]
      operationId: applications.unlock.cancel
      summary: Cancel an unlock that waits for a step, with a reason; the old value stays
      description: R33. An open unlock never expires; the office cancels it instead. A closed project refuses it like every other step (409).
      x-permission: application.unlock_field
      x-scope: application
      x-audit: application.unlock_cancelled
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        '200':
          description: Cancelled; the answer is locked again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationUnlockResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
