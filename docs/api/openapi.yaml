openapi: 3.1.0
info:
  title: Charity & Social Service ERP API
  version: 1.0.0-phase2
  license:
    name: Proprietary, As-Sunnah Foundation
    identifier: LicenseRef-ASF-Proprietary
  description: >-
    REST contract of the Charity & Social Service ERP (As-Sunnah Foundation), Phase 1 and Phase 2 modules,
    written in task T0.18 (2026-10-10). Conventions are defined in docs/api/API_STANDARDS.md: envelope,
    keyset cursor pagination, ETag and If-Match, the error-code catalogue, idempotency through clientUuid or
    the Idempotency-Key header, rate-limit classes and the required x- annotations. Every operation declares
    x-permission (a name from docs/security/permissions.yaml, or one of the markers public, authenticated,
    workflow, entity), x-scope, x-audit, x-idempotency and x-rate-limit. Later phases extend this file;
    an existing contract is never broken silently (API_STANDARDS section 17). The generated document from
    the code must match this file (drift test, NFR-54).
servers:
  - url: /api/v1
    description: Versioned base path
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Registration with OTP, login, token refresh, password (AUTH.md)
  - name: sessions
    description: Device sessions and remote revocation (AUTH.md section 8)
  - name: users
    description: Users, account states, handover, system owner (AUTH.md sections 7, 10, 11)
  - name: access
    description: Roles, permissions, permission panel and project grants (RBAC.md)
  - name: registration
    description: Registration review, correction and edit requests (A5)
  - name: volunteers
    description: Volunteer tab, profile, assignment, teams, categories, blocklist, transfer (A5)
  - name: beneficiaries
    description: Beneficiary tab, identity lookup, 360 profile, corrections, merge, blocklist, consent (A7, B3)
  - name: programs
    description: Programs (A2, A6)
  - name: projects
    description: Projects, components, areas, staff, quotas, fund sources, lifecycle (A6)
  - name: templates
    description: Project templates (BD-10)
  - name: forms
    description: Forms, versions, sections, fields, options, public link (B3)
  - name: public
    description: Public application form without login (A8.5, O-08)
  - name: applications
    description: Applications, workflow actions, scores, quotas, field unlock, transfers (A7, WORKFLOW_ENGINE.md)
  - name: media
    description: The Media Team's referrals, works, publications and portfolios (D-101, D-136, D-137)
  - name: activities
    description: Activities and bulk-update screens (B5, WORKFLOW_ENGINE.md section 8)
  - name: files
    description: Upload sessions and files streamed through the API (FILES_AND_DOCUMENTS.md, D-074, D-108)
  - name: notifications
    description: In-app inbox and preferences (NOTIFICATIONS.md)
  - name: exports
    description: Asynchronous export jobs (API_STANDARDS section 14)
  - name: reference
    description: Locations, reference lists, settings, nisab versions
  - name: audit
    description: The audit viewer of the global roles (DECISION_LOG D-098)
  - name: admin
    description: Notification channels and system health (DECISION_LOG D-098)
  - name: sync
    description: Offline sync batch and snapshot (OFFLINE_SYNC.md)
  - name: health
    description: Liveness and readiness probes in the IETF health check format, for the proxy, Compose and the deploy scripts

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token, 15 minutes (O-05). Refresh at POST /auth/refresh with the refresh cookie and X-CSRF-Token.
    refreshCookie:
      type: apiKey
      in: cookie
      name: css_refresh
      description: >-
        HttpOnly, Secure, SameSite=Strict refresh token cookie scoped to /api/v1/auth/refresh; the value is the
        device session id, a dot and 256 random bits, rotated on every refresh (D-070). Login and refresh also set
        the readable cookie css_csrf (path /, SameSite=Strict) whose value the PWA sends as X-CSRF-Token.

  parameters:
    TemplateKey:
      name: key
      in: path
      required: true
      description: A key of the notification catalogue.
      schema: { type: string, pattern: '^[a-z_]{2,64}$' }
    TemplateChannel:
      name: channel
      in: path
      required: true
      schema: { type: string, enum: [in_app, email] }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque, signed keyset cursor from meta.nextCursor or meta.prevCursor.
      schema: { type: string }
    PageNumber:
      name: page
      in: query
      required: false
      description: >-
        Page number (1-based) of the volunteer and the beneficiary lists (D-105): an offset into the
        same order as the cursor pages. Allowed only inside the counted range of 10,000 rows and
        never together with `cursor` (422); the answer still carries the cursors for the pages after.
      schema: { type: integer, minimum: 1 }
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, default 25, maximum 100 (NFR-11).
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IncludeTotal:
      name: include
      in: query
      required: false
      description: Set to total to receive meta.total (exact up to 10000, otherwise "10000+").
      schema: { type: string, enum: [total] }
    Sort:
      name: sort
      in: query
      required: false
      description: Comma-separated whitelisted fields, leading minus for descending.
      schema: { type: string }
    VolunteerDivisionId:
      name: divisionId
      in: query
      schema: { type: string, format: uuid }
    VolunteerDistrictId:
      name: districtId
      in: query
      schema: { type: string, format: uuid }
    VolunteerUpazilaId:
      name: upazilaId
      in: query
      schema: { type: string, format: uuid }
    VolunteerUnionId:
      name: unionId
      in: query
      schema: { type: string, format: uuid }
    VolunteerTypeFilter:
      name: type
      in: query
      schema: { type: string, enum: [general, local_daee, both, team_member, paid] }
    VolunteerStateFilter:
      name: state
      in: query
      schema: { type: string, enum: [pending, active, blocked, deactivated] }
    VolunteerProjectId:
      name: projectId
      in: query
      description: Volunteers with an active assignment on the project
      schema: { type: string, format: uuid }
    VolunteerCategoryFilter:
      name: category
      in: query
      description: A category or the inactive flag; 403 without the volunteer.rating class (O-67)
      schema: { type: string, enum: [A, B, C, D, inactive] }
    VolunteerBlockedFilter:
      name: blocked
      in: query
      description: true for volunteers on the blocklist now, false for the others
      schema: { type: string, enum: ['true', 'false'] }
    Search:
      name: q
      in: query
      required: false
      description: Name or number search (trigram, O-39). Identity numbers use the lookup endpoint.
      schema: { type: string, minLength: 2, maxLength: 100 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag of the record as last read (API_STANDARDS section 6).
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID chosen by the client for this batch (API_STANDARDS section 9).
      schema: { type: string, format: uuid }
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: bn or en; messages fall back to the user's language, then bn.
      schema: { type: string, enum: [bn, en] }
    ClientVersion:
      name: X-Client-Version
      in: header
      required: false
      description: PWA version; below the minimum supported version the server returns 426.
      schema: { type: string }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Double-submit token equal to the css_csrf cookie and signed for the session (refresh only, D-070).
      schema: { type: string }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProgramId:
      name: programId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BeneficiaryId:
      name: beneficiaryId
      in: path
      required: true
      description: The BEN-ID (UUID v7, O-03).
      schema: { type: string, format: uuid }
    VolunteerId:
      name: volunteerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FormId:
      name: formId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionId:
      name: versionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FileId:
      name: fileId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UploadSessionId:
      name: uploadSessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PartNumber:
      name: partNumber
      in: path
      required: true
      description: 1-based number of a 256 KB part inside the declared size (D-108)
      schema: { type: integer, minimum: 1, maximum: 80 }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LocationId:
      name: locationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RegistrationToken:
      name: X-Registration-Token
      in: header
      required: true
      description: Draft token returned once by the OTP verification (D-082); never in a URL or a log.
      schema: { type: string, minLength: 32, maxLength: 128 }
    RequestId:
      name: requestId
      in: path
      required: true
      description: Id of a correction, edit or merge request.
      schema: { type: string, format: uuid }
    GrantId:
      name: grantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ComponentKey:
      name: componentKey
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z_]{2,64}$' }
    ApplicationAction:
      name: action
      in: path
      required: true
      description: >-
        Workflow action of the common cycle or the project's template (WORKFLOW_ENGINE.md section 3):
        submit, review, send_for_approval, approve, reject, waitlist, pull_from_waitlist, delete, verify_link,
        reject_unverified. The permission is the transition's permission in the project's snapshot.
      schema:
        type: string
        enum: [submit, review, send_for_approval, approve, reject, waitlist, pull_from_waitlist, delete, verify_link, reject_unverified, return_to_review]
    AppNo:
      name: appNo
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Z]{2,8}-[0-9]{4}-[0-9]{5}$' }
    ListKey:
      name: listKey
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z_]{2,64}$' }
    SettingKey:
      name: settingKey
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9_.]{2,100}$' }
    PublicToken:
      name: token
      in: path
      required: true
      schema: { type: string, minLength: 16 }

  headers:
    ETag:
      description: Weak validator derived from updated_at.
      schema: { type: string }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer }
    IdempotentReplay:
      description: true when the response replays a stored result.
      schema: { type: boolean }

  responses:
    BadRequest:
      description: Malformed request or unknown parameter (validation.malformed, validation.unknown_parameter).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: >-
        auth.token_missing, auth.token_expired, auth.token_stale, auth.session_revoked, auth.refresh_invalid,
        auth.refresh_reused, auth.invalid_credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: permission.denied, auth.account_blocked, auth.account_pending, auth.password_change_required, auth.account_deactivated, auth.csrf_failed, sync.not_permitted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: permission.not_found - the record does not exist or is outside the caller's scope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: >-
        workflow.transition_not_allowed, workflow.guard.<guard_name>, conflict.locked_on_server,
        beneficiary.already_applied, beneficiary.identity_taken, beneficiary.mobile_is_volunteer_mobile,
        beneficiary.correction_pending, beneficiary.correction_stale, beneficiary.merge_conflict,
        beneficiary.merge_revert_order, beneficiary.merge_stale, beneficiary.dismissed,
        payment.transaction_id_exists, payment.claim_already_paid,
        animal.already_allocated, file.duplicate, export.not_ready, export.running_limit, session.use_logout,
        user.system_owner_protected, user.handover_required, user.transition_not_allowed, user.not_locked.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Gone:
      description: file.infected, file.session_expired, export.expired.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PreconditionFailed:
      description: conflict.stale_version - If-Match does not match; details carry the current version.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge:
      description: sync.batch_too_large, file.too_large.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnsupportedMediaType:
      description: file.type_not_allowed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unprocessable:
      description: >-
        validation.failed with field details; business rules such as beneficiary.identity_missing,
        beneficiary.mobile_is_volunteer_mobile, beneficiary.blocked, beneficiary.locked_field,
        beneficiary.merge_keep_document,
        workflow.reason_required, workflow.comment_required, otp.invalid, otp.expired, file.source_not_allowed,
        export.too_many_rows, export.pdf_too_many_rows;
        password details validation.password_too_short, validation.password_uppercase_digit,
        auth.current_password_invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Locked:
      description: auth.account_locked (with Retry-After, the seconds until the lock ends), file.quarantined.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UpgradeRequired:
      description: client.upgrade_required - sync the outbox, then update the PWA.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: rate_limit.exceeded or otp.attempts_exceeded.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServerError:
      description: server.internal, server.unavailable or server.busy (a list read over its time limit, O-67); never contains stack traces or SQL.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NoContent:
      description: Done; nothing to return.

  schemas:
    Uuid: { type: string, format: uuid }
    HealthStatus:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [pass, warn, fail] }
    Money:
      type: string
      pattern: '^[0-9]{1,12}(\.[0-9]{1,2})?$'
      description: Decimal string in BDT; digits 0-9 (UX-05).
    Bilingual:
      type: object
      required: [bn, en]
      properties:
        bn: { type: string }
        en: { type: string }
    Gps:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        accuracyM: { type: number, minimum: 0 }
    Meta:
      type: object
      required: [requestId]
      properties:
        requestId: { type: string }
        etag: { type: string }
    ListMeta:
      type: object
      required: [requestId, limit]
      properties:
        requestId: { type: string }
        limit: { type: integer }
        nextCursor: { type: [string, 'null'] }
        prevCursor: { type: [string, 'null'] }
        total:
          oneOf:
            - type: integer
            - type: string
              const: 10000+
    ErrorDetail:
      type: object
      required: [code, messageKey, message]
      properties:
        path: { type: string, description: JSON path in camelCase }
        code: { type: string }
        messageKey: { type: string }
        message: { type: string }
        params:
          type: object
          additionalProperties: { type: string }
          description: Only for codes that document them in API_STANDARDS section 8 (beneficiary.identity_taken, beneficiary.merge_conflict, application.answer_not_in_list, form.label_language)
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, messageKey, message, requestId]
          properties:
            code: { type: string, description: Code from API_STANDARDS section 8 }
            messageKey: { type: string }
            message: { type: string }
            params:
              type: object
              additionalProperties: { type: string }
              description: Only for codes that document them in API_STANDARDS section 8, e.g. permission.grant_refused (rule)
            details:
              type: array
              items: { $ref: '#/components/schemas/ErrorDetail' }
            requestId: { type: string }
    ActionResult:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            status: { type: string }
            stage: { type: [string, 'null'] }
        meta: { $ref: '#/components/schemas/Meta' }
    StaffDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      description: A role on approval (any official role but the Department Head's), a reason on rejection (R9 of the T1.9 plan)
      properties:
        decision: { type: string, enum: [approve, reject] }
        reason: { type: string, minLength: 3, maxLength: 1000 }
        roleKey: { type: string, maxLength: 64 }
    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 1000 }
    RegistrationStartRequest:
      type: object
      additionalProperties: false
      description: A draft starts with its kind only; each contact comes with its own code (D-090)
      properties:
        kind: { type: string, enum: [volunteer, staff], default: volunteer }
    RegistrationStart:
      type: object
      required: [registrationId]
      properties:
        registrationId: { $ref: '#/components/schemas/Uuid' }
    RegistrationStartResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/RegistrationStart' }
        meta: { $ref: '#/components/schemas/Meta' }
    OtpSendRequest:
      description: The contact of one channel; a changed address clears that channel's verification (D-090)
      oneOf:
        - type: object
          additionalProperties: false
          required: [address, channel, registrationId]
          properties:
            registrationId: { $ref: '#/components/schemas/Uuid' }
            channel: { type: string, const: sms }
            address: { type: string, pattern: '^01[3-9][0-9]{8}$' }
        - type: object
          additionalProperties: false
          required: [address, channel, registrationId]
          properties:
            registrationId: { $ref: '#/components/schemas/Uuid' }
            channel: { type: string, const: email }
            address: { type: string, format: email, maxLength: 254 }
    OtpVerifyRequest:
      type: object
      additionalProperties: false
      required: [channel, code, registrationId]
      properties:
        registrationId: { $ref: '#/components/schemas/Uuid' }
        channel: { type: string, enum: [sms, email] }
        code: { type: string, pattern: '^[0-9]{6}$' }
    RegistrationVerified:
      type: object
      required: [verified]
      description: The channels verified so far; the token, its expiry and the kind come once both are verified (D-090)
      properties:
        verified: { type: array, items: { type: string, enum: [sms, email] } }
        registrationToken: { type: string, description: Shown once; sent back in X-Registration-Token (D-082) }
        expiresAt: { type: string, format: date-time }
        kind: { type: string, enum: [volunteer, staff] }
    RegistrationVerifiedResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/RegistrationVerified' }
        meta: { $ref: '#/components/schemas/Meta' }
    UploadedPhotoResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [fileId]
          properties:
            fileId: { $ref: '#/components/schemas/Uuid' }
        meta: { $ref: '#/components/schemas/Meta' }
    BankDetails:
      type: object
      additionalProperties: false
      properties:
        bankName: { type: string, maxLength: 200 }
        accountName: { type: string, maxLength: 200 }
        accountNumber: { type: string, maxLength: 40 }
        branchName: { type: string, maxLength: 100 }
        routingNumber: { type: string, maxLength: 20 }
    VolunteerRegistrationSubmit:
      type: object
      additionalProperties: false
      required: [kind, registrationId, password, name, fatherName, motherName, nid, divisionId, districtId, upazilaId, unionId, profession]
      properties:
        kind: { type: string, const: volunteer }
        registrationId: { $ref: '#/components/schemas/Uuid' }
        password: { type: string, minLength: 8, maxLength: 128, description: 'At least one upper-case letter and one digit (O-64)' }
        name: { type: string, minLength: 1, maxLength: 200 }
        fatherName: { type: string, minLength: 1, maxLength: 200 }
        motherName: { type: string, minLength: 1, maxLength: 200 }
        nid: { type: string, pattern: '^([0-9]{10}|[0-9]{13}|[0-9]{17})$' }
        whatsapp: { type: string, pattern: '^01[3-9][0-9]{8}$' }
        divisionId: { $ref: '#/components/schemas/Uuid' }
        districtId: { $ref: '#/components/schemas/Uuid' }
        upazilaId: { $ref: '#/components/schemas/Uuid' }
        unionId: { $ref: '#/components/schemas/Uuid' }
        addressLine: { type: string, maxLength: 500 }
        permanentAddress: { $ref: '#/components/schemas/PermanentAddress' }
        educationDetails: { $ref: '#/components/schemas/EducationDetails' }
        facebookId: { type: string, maxLength: 300, description: 'An https link to the Facebook account: parsed as a URL, a Facebook host, no credentials or port (O-66); the server never fetches it' }
        dateOfBirth: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$', description: 'A real date in the past, not before 1900 (O-65)' }
        bloodGroup: { type: string, enum: [A+, A-, B+, B-, O+, O-, AB+, AB-] }
        tshirtSize: { type: string, enum: [S, M, L, XL, XXL] }
        volunteeringArea: { type: string, enum: [own_union, own_upazila, own_district, anywhere] }
        profession: { type: string, enum: [student, teacher, imam, businessman, job_seeker, service_holder], description: The one mandatory new field (O-65) }
        professionDetails: { $ref: '#/components/schemas/ProfessionDetails' }
        interestAreas: { type: array, maxItems: 5, description: Each area at most once, items: { type: string, enum: [field_relief, survey, data_entry, media, first_aid] } }
        vehicle: { type: string, enum: [bicycle, motorcycle, none] }
        canSwim: { type: boolean }
        availability: { type: string, enum: [holidays, anytime, on_call] }
        emergencyFullTime: { type: boolean, description: Can give full time in an emergency (O-66) }
    ProfessionDetails:
      type: object
      description: The own fields of the chosen profession only, all optional; a field of another profession is refused (422). student educationMedium (general, aliya, qawmi, technical), institutionName, currentClass, subject, institutionLocation; teacher institutionType (school, college, university, madrasa), institutionNameAddress, designation, teachingSubject; imam role (khatib, imam, muazzin), mosqueName, mosqueType (jame, panjegana), mosqueAddress; businessman businessName, businessType (retail, wholesale, service, agriculture, it_online, other), businessAddress; job_seeker skills; service_holder sector, organization, designation, workplaceLocation
      propertyNames: { type: string }
      additionalProperties: {}
    PermanentAddress:
      type: object
      additionalProperties: false
      required: [divisionId, districtId, upazilaId, unionId]
      description: The permanent address (O-66, BR-248); the four levels must form one chain like the present address
      properties:
        divisionId: { $ref: '#/components/schemas/Uuid' }
        districtId: { $ref: '#/components/schemas/Uuid' }
        upazilaId: { $ref: '#/components/schemas/Uuid' }
        unionId: { $ref: '#/components/schemas/Uuid' }
        addressLine: { type: string, maxLength: 500 }
    EducationDetails:
      type: object
      additionalProperties: false
      description: Education as one value (O-66, BR-248), all parts optional
      properties:
        highestQualification: { type: string, enum: [psc, jsc, ssc, dakhil, hsc, alim, diploma, bachelor, fazil, masters, kamil, hafez, other] }
        institutionName: { type: string, maxLength: 200 }
        subject: { type: string, maxLength: 200 }
        passingYear: { type: integer, minimum: 1950, maximum: 9007199254740991, description: The server accepts up to the current year plus 8 }
        result: { type: string, maxLength: 60 }
        status: { type: string, enum: [studying, completed] }
    VolunteerProfileDetails:
      type: object
      description: The personal, profession and skills data of a volunteer (O-65, D-092; BR-246)
      required: [professionDetails, interestAreas, educationDetails]
      properties:
        bloodGroup: { type: [string, 'null'], enum: [A+, A-, B+, B-, O+, O-, AB+, AB-, null] }
        dateOfBirth: { type: [string, 'null'], format: date }
        tshirtSize: { type: [string, 'null'], enum: [S, M, L, XL, XXL, null] }
        volunteeringArea: { type: [string, 'null'], enum: [own_union, own_upazila, own_district, anywhere, null] }
        profession: { type: [string, 'null'], enum: [student, teacher, imam, businessman, job_seeker, service_holder, null] }
        professionDetails: { $ref: '#/components/schemas/ProfessionDetails' }
        interestAreas: { type: array, items: { type: string, enum: [field_relief, survey, data_entry, media, first_aid] } }
        vehicle: { type: [string, 'null'], enum: [bicycle, motorcycle, none, null] }
        canSwim: { type: [boolean, 'null'] }
        availability: { type: [string, 'null'], enum: [holidays, anytime, on_call, null] }
        emergencyFullTime: { type: [boolean, 'null'] }
        educationDetails: { $ref: '#/components/schemas/EducationDetails' }
        permanentAddress:
          anyOf:
            - { $ref: '#/components/schemas/PermanentAddress' }
            - { type: 'null' }
    StaffRegistrationSubmit:
      type: object
      additionalProperties: false
      required: [kind, registrationId, password, name, designation]
      properties:
        kind: { type: string, const: staff }
        registrationId: { $ref: '#/components/schemas/Uuid' }
        password: { type: string, minLength: 8, maxLength: 128 }
        name: { type: string, minLength: 1, maxLength: 200 }
        designation: { type: string, minLength: 1, maxLength: 200 }
    RegistrationSubmitRequest:
      description: The form of the draft's kind (MASTER_SPEC A5, D-088); the photos are linked through the draft
      oneOf:
        - $ref: '#/components/schemas/VolunteerRegistrationSubmit'
        - $ref: '#/components/schemas/StaffRegistrationSubmit'
    LoginRequest:
      type: object
      additionalProperties: false
      required: [loginId, password]
      properties:
        loginId: { type: string, minLength: 1, maxLength: 254, description: Mobile number or email (email for staff only) }
        password: { type: string, minLength: 1, maxLength: 128 }
        device:
          type: object
          additionalProperties: false
          properties:
            name: { type: string, maxLength: 100 }
            platform:
              type: string
              enum: [android, ios, desktop, other]
              description: Staff sessions on desktop get the 12-hour idle timeout (O-25, D-070)
            appVersion: { type: string, maxLength: 32 }
        recoverSessionId:
          type: string
          format: uuid
          description: The ended device session whose key the phone asks back once, to re-key the encrypted outbox it kept (OFFLINE_SYNC.md, local storage security)
        lostPending:
          type: object
          additionalProperties: false
          required: [count, reason]
          description: Records the phone lost before this login; audited as auth.logout_with_pending or sync.outbox_unrecoverable
          properties:
            count: { type: integer, minimum: 0, maximum: 100000 }
            reason: { type: string, enum: [logout, unrecoverable] }
    LogoutRequest:
      type: object
      additionalProperties: false
      properties:
        pendingCount: { type: integer, minimum: 0, maximum: 100000, description: Records left unsent on the device; audited as auth.logout_with_pending when above zero }
    Me:
      type: object
      required: [id, displayName, kind, state, roles, language, permissionVersion]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string }
        kind: { type: string, enum: [staff, volunteer] }
        state: { type: string, enum: [pending, active, blocked, deactivated] }
        roles: { type: array, items: { type: string } }
        language: { type: string, enum: [bn, en] }
        permissionVersion: { type: integer }
        passwordChangeRequired:
          type: boolean
          description: true until the person sets a new password (a staff role with global scope was approved); every other operation answers 403 auth.password_change_required
        blockMessage: { type: [string, 'null'] }
        volunteerId: { type: [string, 'null'], format: uuid }
        photoFileId:
          type: [string, 'null']
          format: uuid
          description: The person's uploaded photo (a volunteer's or an official's), shown in the app bar; null shows the initial (D-147)
    TokenPair:
      type: object
      required: [accessToken, expiresAt, me, deviceKey]
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
        me: { $ref: '#/components/schemas/Me' }
        deviceKey:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: The session's device key (32 bytes, base64url) that wraps the phone's offline store key; kept in memory only, returned by login and by every refresh (AUTH.md 5)
        previousDeviceKey:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: The key of the ended session named by recoverSessionId, handed back once so the phone can re-key its outbox
    TokenResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/TokenPair' }
        meta: { $ref: '#/components/schemas/Meta' }
    MeResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Me' }
        meta: { $ref: '#/components/schemas/Meta' }
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { type: string, minLength: 8, maxLength: 128 }
    PasswordResetStartRequest:
      type: object
      additionalProperties: false
      required: [loginId]
      properties:
        loginId: { type: string, minLength: 1, maxLength: 254 }
    PasswordResetCompleteRequest:
      type: object
      additionalProperties: false
      required: [loginId, code, newPassword]
      properties:
        loginId: { type: string, minLength: 1, maxLength: 254 }
        code: { type: string, pattern: '^[0-9]{6}$' }
        newPassword: { type: string, minLength: 8, maxLength: 128 }
    DeviceSession:
      type: object
      required: [id, createdAt, lastSeenAt, current]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        deviceName: { type: [string, 'null'] }
        platform: { type: [string, 'null'] }
        appVersion: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        current: { type: boolean }
        revokedAt: { type: [string, 'null'], format: date-time }
        pendingCount: { type: [integer, 'null'], minimum: 0, description: Records the device last reported as still waiting on it (a sync batch or a logout); null before any report }
        pendingReportedAt: { type: [string, 'null'], format: date-time }
    DeviceSessionList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/DeviceSession' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    UserSummary:
      type: object
      required: [id, displayName, kind, state]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string }
        kind: { type: string, enum: [staff, volunteer] }
        state: { type: string, enum: [pending, active, blocked, deactivated] }
        designation: { type: [string, 'null'] }
        roles: { type: array, items: { type: string } }
        jobId: { type: [string, 'null'], description: 'Officials only, in capitals (D-097)' }
        affiliation: { type: [string, 'null'], enum: [department, foundation, external, null] }
        affiliationUnit: { type: [string, 'null'] }
        homeProgramId: { type: [string, 'null'], format: uuid }
        homeDivisionId: { type: [string, 'null'], format: uuid }
        supervisorUserId: { type: [string, 'null'], format: uuid }
        awaitingPassword:
          type: boolean
          description: An official created by the admin who has not used the set-password link yet
        photoFileId:
          type: [string, 'null']
          format: uuid
          description: The official's uploaded photo, readable by those who may see the staff list; null shows the initial (D-147)
    OwnStaffProfile:
      type: object
      required: [id, displayName, jobId, designation, roles, affiliation, affiliationUnit, program, division, supervisor, mobile, email, state, lastLoginAt, photoFileId]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string }
        jobId: { type: [string, 'null'] }
        designation: { type: [string, 'null'] }
        roles:
          type: array
          items:
            type: object
            required: [key, name]
            properties:
              key: { type: string }
              name: { $ref: '#/components/schemas/Bilingual' }
        affiliation: { type: [string, 'null'], enum: [department, foundation, external, null] }
        affiliationUnit: { type: [string, 'null'] }
        program:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, name]
              properties:
                id: { $ref: '#/components/schemas/Uuid' }
                name: { $ref: '#/components/schemas/Bilingual' }
        division:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, name]
              properties:
                id: { $ref: '#/components/schemas/Uuid' }
                name: { $ref: '#/components/schemas/Bilingual' }
        supervisor:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, name]
              properties:
                id: { $ref: '#/components/schemas/Uuid' }
                name: { type: string }
        mobile: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        state: { type: string, enum: [pending, active, blocked, deactivated] }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        photoFileId: { type: [string, 'null'], format: uuid }
    ProjectsWork:
      type: object
      required: [everyProject, years]
      description: >-
        An official's projects by year, newest first, each with their roles and areas there and the
        figures of their work (D-147, BR-291 to BR-293). A person whom every project is open to
        (everyProject) gets no list.
      properties:
        everyProject: { type: boolean }
        years:
          type: array
          items:
            type: object
            required: [year, projects]
            properties:
              year: { type: integer }
              projects: { type: array, items: { $ref: '#/components/schemas/ProjectWork' } }
    ProjectWork:
      type: object
      required: [id, code, name, year, status, program, applyFrom, applyTo, roles, areas, wholeProject, figures]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string }
        name: { $ref: '#/components/schemas/Bilingual' }
        year: { type: integer }
        status: { type: string, enum: [draft, active, closing, closed, cancelled] }
        program:
          type: object
          required: [id, name]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            name: { $ref: '#/components/schemas/Bilingual' }
        applyFrom: { type: [string, 'null'], format: date }
        applyTo: { type: [string, 'null'], format: date }
        roles:
          type: array
          items:
            type: object
            required: [key, name]
            properties:
              key: { type: string }
              name: { $ref: '#/components/schemas/Bilingual' }
        areas:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              name: { $ref: '#/components/schemas/Bilingual' }
        wholeProject: { type: boolean }
        figures:
          type: object
          required: [area, mine]
          properties:
            area:
              type: object
              description: In the official's areas, or the whole project for its PM or an access without an area
              required: [received, waiting, approved, rejected, waitlisted, volunteers]
              properties:
                received: { type: integer, minimum: 0 }
                waiting: { type: integer, minimum: 0 }
                approved: { type: integer, minimum: 0 }
                rejected: { type: integer, minimum: 0 }
                waitlisted: { type: integer, minimum: 0 }
                volunteers: { type: integer, minimum: 0 }
            mine:
              type: object
              description: The official's own decisions on the project
              required: [reviewed, approved, rejected, waitlisted, medianDays]
              properties:
                reviewed: { type: integer, minimum: 0 }
                approved: { type: integer, minimum: 0 }
                rejected: { type: integer, minimum: 0 }
                waitlisted: { type: integer, minimum: 0 }
                medianDays: { type: [number, 'null'], minimum: 0 }
    User:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          properties:
            mobile: { type: [string, 'null'] }
            email: { type: [string, 'null'] }
            isSystemOwner: { type: boolean }
            lastLoginAt: { type: [string, 'null'], format: date-time }
    UserResponse:
      type: object
      required: [data, meta]
