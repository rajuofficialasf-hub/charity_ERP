      operationId: beneficiaries.merge.candidates
      summary: Suggested duplicate profiles in the caller scope (name, father or husband and mobile; name, date of birth and union; one mobile)
      description: >-
        Pairs of live profiles both inside the caller's scope (D-113), in id order, paged forward
        by cursor; a pair marked as two different people is left out until the mark is lifted.
        Never an identity number or a mobile.
      x-permission: beneficiary.merge.dismiss
      x-scope: beneficiary
      x-audit: none
      x-idempotency: none
      x-rate-limit: list
