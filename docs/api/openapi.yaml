        year: { type: integer }
        name: { $ref: '#/components/schemas/Bilingual' }
        status: { type: string, enum: [active, closing] }
        applyFrom: { type: [string, 'null'], format: date }
        applyTo: { type: [string, 'null'], format: date }
        perVolunteerLimit: { type: [integer, 'null'] }
        dawahEnabled: { type: boolean }
        via: { type: string, enum: [assignment, team], description: "Own assignment, or a membership of a main volunteer's team" }
        permissionSet: { type: [string, 'null'], description: Null for a team member }
        isPaid: { type: boolean }
        consentStatus: { type: string, enum: [pending, accepted], description: The project opens for work only when accepted }
        rulesVersion: { type: integer, minimum: 0 }
        applicationsCounted: { type: integer, minimum: 0, description: The main volunteer's count for a team member (BR-059) }
        applicationsLeft: { type: [integer, 'null'], minimum: 0 }
        leadsTeam: { type: boolean, description: An assigned General or দাঈ-স্বেচ্ছাসেবক volunteer may build a team }
    MyProjectList:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/MyProject' } }
    MyProjectResponse:
