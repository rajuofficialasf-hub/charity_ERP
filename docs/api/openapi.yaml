      x-scope: self
      x-audit: none
      x-idempotency: clientUuid
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadSessionCreate' }
      responses:
        '201':
          description: Upload session with presigned part URLs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSessionResponse' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /upload-sessions/{uploadSessionId}:
    parameters:
      - $ref: '#/components/parameters/UploadSessionId'
    get:
      tags: [files]
      operationId: files.uploadSession.get
      summary: Upload session status for resuming after a dropped connection
      x-permission: file.upload
      x-scope: self
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: Session with acknowledged parts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSessionResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
  /upload-sessions/{uploadSessionId}/finalize:
    parameters:
      - $ref: '#/components/parameters/UploadSessionId'
    post:
      tags: [files]
      operationId: files.uploadSession.finalize
      summary: Complete the upload; the file stays quarantined until the scan is clean (O-30)
      x-permission: file.upload
      x-scope: self
      x-audit: file.uploaded
      x-idempotency: clientUuid
      x-rate-limit: default
      responses:
        '201':
          description: File created (virusScan pending)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileInfoResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /files/{fileId}:
    parameters:
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [files]
      operationId: files.file.get
      summary: File metadata, scan state and data-quality flags
      x-permission: entity
      x-scope: file
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: File
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileInfoResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /files/{fileId}/content:
    parameters:
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [files]
      operationId: files.file.content
      summary: Stream a registration or profile photo to its owner and to allowed officials; the NID photo only to the volunteer.identity roles (Cache-Control no-store, nosniff; D-087)
      x-permission: entity
      x-scope: file
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: The image
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /files/{fileId}/url:
    parameters:
      - $ref: '#/components/parameters/FileId'
    post:
      tags: [files]
      operationId: files.file.signedUrl
      summary: Signed download URL valid 15 minutes, after the linked entity's read permission and field-class checks
      x-permission: entity
      x-scope: file
      x-audit: file.download_sensitive
      x-idempotency: none
      x-rate-limit: default
      x-sensitive-fields: [volunteer.identity, beneficiary.nid]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FileUrlRequest' }
      responses:
        '200':
          description: Signed URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileUrlResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '423': { $ref: '#/components/responses/Locked' }

  # ======================= notifications =======================
  /notifications:
    get:
      tags: [notifications]
      operationId: notifications.inbox.list
      summary: Own in-app notifications, newest first, with the unread count
      x-permission: notification.read_own
      x-scope: self
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: unread
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications/read:
    post:
      tags: [notifications]
      operationId: notifications.inbox.markRead
      summary: Mark own notifications as read
      x-permission: notification.read_own
      x-scope: self
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkReadRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/language:
    put:
      tags: [auth]
      operationId: auth.me.language.set
      summary: >-
        Set own interface language (users.language, I18N 2); the PWA also keeps it in the css_locale
        cookie and device storage. Live with login in T1.7 (O-56)
      x-permission: authenticated
      x-scope: self
      x-audit: user.language_changed
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [language]
              properties:
                language: { type: string, enum: [bn, en] }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /me/preferences:
    get:
      tags: [notifications]
      operationId: notifications.preferences.get
      summary: Own preferences (email mode, digest time, push opt-in)
      x-permission: notification.read_own
      x-scope: self
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreferencesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [notifications]
      operationId: notifications.preferences.update
      summary: Update own preferences; mandatory notification classes cannot be switched off
      x-permission: notification.read_own
      x-scope: self
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../database/json-schemas/user-preferences.schema.json' }
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreferencesResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ======================= exports =======================
  /exports:
    post:
      tags: [exports]
      operationId: exports.job.create
      summary: >-
        Start an export job with the caller's scope and masks frozen; kinds with identity, bank or
        official-section fields additionally need export.beneficiaries, export.volunteers or export.forms
      x-permission: export.list
      x-scope: project
      x-audit: export.requested
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportCreate' }
      responses:
        '202':
          description: Job queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportJobResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /exports/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [exports]
      operationId: exports.job.get
      summary: Export job status; when done, fileId is used with POST /files/{fileId}/url
      x-permission: export.list
      x-scope: self
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportJobResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }

  # ======================= reference =======================
  /locations:
    get:
      tags: [reference]
      operationId: reference.location.list
      summary: Active children of a location (divisions when parentId is omitted); public reference data for the registration form (D-083); not paginated
      security: []
      x-permission: public
      x-scope: system
      x-audit: none
      x-idempotency: none
      x-rate-limit: reference-read
      parameters:
        - name: parentId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Locations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationList' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [reference]
      operationId: reference.location.create
      summary: Add a district, upazila or union (O-09)
      x-permission: location.manage
      x-scope: global
      x-audit: location.create
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /locations/{locationId}:
    parameters:
      - $ref: '#/components/parameters/LocationId'
    patch:
      tags: [reference]
      operationId: reference.location.update
      summary: Rename or deactivate a location; never deleted (O-09)
      x-permission: location.manage
      x-scope: global
      x-audit: location.update
      x-idempotency: none
      x-rate-limit: default
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /reference-lists/{listKey}:
    parameters:
      - $ref: '#/components/parameters/ListKey'
    get:
      tags: [reference]
      operationId: reference.list.get
      summary: Items of a system-wide reference list (gender, payment_method, consent_channel, ...); not paginated
      x-permission: authenticated
      x-scope: system
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: Items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceList' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [reference]
      operationId: reference.list.addItem
      summary: Add an item to a reference list
      x-permission: settings.manage
      x-scope: global
      x-audit: settings.change
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferenceItem' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceItemResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /reference-lists/{listKey}/items/{code}:
    parameters:
      - $ref: '#/components/parameters/ListKey'
      - name: code
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z0-9_]{1,64}$' }
    patch:
      tags: [reference]
      operationId: reference.list.updateItem
      summary: Relabel or deactivate a reference item; old rows stay valid
      x-permission: settings.manage
      x-scope: global
      x-audit: settings.change
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { $ref: '#/components/schemas/Bilingual' }
                active: { type: boolean }
                sortOrder: { type: integer }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceItemResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /settings:
    get:
      tags: [reference]
      operationId: reference.setting.list
      summary: System settings (thresholds, photo defaults, limits); provider secrets are never returned
      x-permission: settings.manage
      x-scope: global
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingList' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /settings/{settingKey}:
    parameters:
      - $ref: '#/components/parameters/SettingKey'
    patch:
      tags: [reference]
      operationId: reference.setting.update
      summary: Change a setting (validated per key; audited)
      x-permission: settings.manage
      x-scope: global
      x-audit: settings.change
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /nisab-versions:
    get:
      tags: [reference]
      operationId: reference.nisab.list
      summary: Nisab versions, newest first; not paginated (O-15)
      x-permission: authenticated
      x-scope: system
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: Nisab versions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NisabList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [reference]
      operationId: reference.nisab.add
      summary: Add a nisab version (PM or above); never edits old versions
      x-permission: nisab.set
      x-scope: global
      x-audit: nisab.change
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NisabVersion' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NisabResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ======================= sync =======================
  /sync/batch:
    post:
      tags: [sync]
      operationId: sync.batch.submit
      summary: >-
        Submit up to 50 offline text records; each is processed through its normal service with the
        originating user as actor; per-record results (OFFLINE_SYNC section 4)
      x-permission: sync.batch
      x-scope: self
      x-audit: sync.batch
      x-idempotency: header
      x-rate-limit: sync
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncBatchRequest' }
      responses:
        '200':
          description: Per-record results
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncBatchResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServerError' }
  /sync/snapshot:
    get:
      tags: [sync]
      operationId: sync.snapshot.get
      summary: Offline data set deltas since a timestamp, masked like every other read (O-07)
      x-permission: sync.batch
      x-scope: self
      x-audit: none
      x-idempotency: none
      x-rate-limit: sync
      parameters:
        - $ref: '#/components/parameters/ClientVersion'
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: projectId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Snapshot delta
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotResponse' }
        '304':
          description: Not modified
        '401': { $ref: '#/components/responses/Unauthorized' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
