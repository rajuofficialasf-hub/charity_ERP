      tags: [beneficiaries]
      operationId: beneficiaries.merge.propose
      summary: Propose a merge of two profiles with a reason
      description: >-
        Both profiles live and in the caller's scope (404 otherwise, without naming either); one
        open proposal per pair. Where only one of the two has an identity document, that one is the
        kept profile: the other choice answers 422 with the detail
        `beneficiary.merge_keep_document` on `keptId` (D-172).
      x-permission: beneficiary.merge.propose
      x-scope: beneficiary
      x-audit: beneficiary.merge_proposed
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MergeRequest' }
      responses:
        '201':
          description: Proposed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MergeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    get:
      tags: [beneficiaries]
      operationId: beneficiaries.merge.list
      summary: The merge proposals and merges of profiles in the caller scope, newest first
      x-permission: beneficiary.merge.dismiss
      x-scope: beneficiary
      x-audit: none
      x-idempotency: none
      x-rate-limit: list
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [proposed, merged, reverted] } }
      responses:
        '200':
          description: At most 100 merges
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Merge' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /beneficiary-merges/direct:
    post:
      tags: [beneficiaries]
      operationId: beneficiaries.merge.direct
      summary: Merge two profiles without a proposal, keeping the one named and a reason
      description: >-
        The same merge as an executed proposal (D-113); the caller is proposer and merger. A merge
        that moves an application outside the caller's merge reach (another program, for a PM)
        answers 403 `beneficiary.merge_needs_global` (D-118). Where only one of the two profiles has
        an identity document, keeping the other answers 422 with the detail
        `beneficiary.merge_keep_document` on `keptId` (D-172).
      x-permission: beneficiary.merge
      x-scope: beneficiary
      x-audit: beneficiary.merge
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MergeRequest' }
      responses:
        '201':
          description: Merged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MergeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /beneficiary-merges/{requestId}/execute:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [beneficiaries]
      operationId: beneficiaries.merge.execute
      summary: Execute a merge; the retired BEN-ID points to the kept profile (BR-013)
      description: >-
        Everything that points to the retired profile moves to the kept one and is listed in the
        snapshot; a pending application of the retired profile in a project both applied to answers
        409 `beneficiary.merge_conflict` (details name the project), one past pending stays on the
        retired profile (`leftBehind`); a block moves to the kept profile; where only the retired
        profile knows whether the name beside the person is the father's or the husband's, the kept
        profile takes it and a revert empties it again; a proposal whose profiles
        are no longer both live answers 409 `beneficiary.merge_stale` (D-113); an application of
        another program than the caller reaches answers 403 `beneficiary.merge_needs_global` (D-118).
        A merge moves no identity number: where only one of the two profiles has an identity
        document, keeping the other (as proposed, or as chosen with `keptId`) answers 422 with the
        detail `beneficiary.merge_keep_document` on `keptId` (D-172).
      x-permission: beneficiary.merge
      x-scope: beneficiary
      x-audit: beneficiary.merge
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MergeExecuteRequest' }
      responses:
        '200':
          description: Merged
          content:
            application/json:
