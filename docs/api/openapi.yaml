              schema: { $ref: '#/components/schemas/FormFieldMapResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /form-versions/{versionId}:
    parameters:
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [forms]
      operationId: forms.version.get
      summary: Get a form version (official-only sections absent without application.view_official_section)
      x-permission: project.view
      x-scope: project
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      x-sensitive-fields: [application.official_section]
      responses:
        '200':
          description: Form version
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormVersionResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [forms]
      operationId: forms.version.updateDraft
      summary: Replace sections, fields and options of a draft version; a text may wait for its second language until the publish
      description: "A draft saves with any text (a part's title, a question's label, help text or placeholder, an option, a number table's row or column, a calculation's text result) empty in one language or in both (BR-245, D-171); references, cycles, keys and limits are checked at every save."
      x-permission: form.build
      x-scope: project
      x-audit: form.draft_changed
      x-idempotency: none
      x-rate-limit: default
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormDraftUpdate' }
      responses:
        '200':
          description: Updated draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormVersionResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /form-versions/{versionId}/publish:
    parameters:
      - $ref: '#/components/parameters/VersionId'
    post:
      tags: [forms]
      operationId: forms.version.publish
      summary: Publish a draft version; the previous version is retired; mandatory fields (BD-13) and every text in both languages (BR-245) enforced
      description: "A text that lacks a language refuses the publish with 422 `validation.failed` and one detail `form.label_language` per text and language: `path` is the question's key (the part's key for a title) and `params` names the text (API_STANDARDS section 8). A text of only spaces is missing; a help text or placeholder empty in both languages is none."
      x-permission: form.publish
      x-scope: project
      x-audit: form.publish
      x-idempotency: none
      x-rate-limit: default
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Published
          content:
