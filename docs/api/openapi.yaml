  /applications/{applicationId}:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      tags: [applications]
      operationId: applications.application.get
      summary: Get an application with answers, warnings and the actions the caller may perform
      x-permission: application.view
      x-scope: application
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      x-sensitive-fields: [application.official_section, beneficiary.nid, beneficiary.contact, beneficiary.profile_detail]
      responses:
        '200':
          description: Application
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
