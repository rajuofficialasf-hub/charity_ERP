        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password/change:
    post:
      tags: [auth]
      operationId: auth.password.change
      summary: Change own password; revokes the user's other device sessions
      x-permission: authenticated
      x-scope: self
      x-audit: auth.password_changed
      x-idempotency: none
      x-rate-limit: password-reset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/password/reset/start:
    post:
      tags: [auth]
      operationId: auth.password.resetStart
      summary: Send a password-reset OTP; the response is the same whether or not the id exists
      security: []
      x-permission: public
      x-scope: self
      x-audit: auth.password_reset_started
