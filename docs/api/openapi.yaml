      properties:
        data: { type: array, items: { $ref: '#/components/schemas/UserSummary' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    StaffCreateRequest:
      description: >-
        A new official created by the admin (DECISION_LOG D-097, BR-261). The job ID is stored in
        capitals and may not read as a mobile number; affiliationUnit is required for `foundation`
        and `external` and null for `department`; the role is an official role other than
        department_head.
      type: object
      additionalProperties: false
      required: [jobId, displayName, designation, affiliation, affiliationUnit, homeProgramId, homeDivisionId, supervisorUserId, email, mobile, roleKey]
      properties:
        jobId: { type: string, maxLength: 64 }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        designation: { type: string, minLength: 1, maxLength: 200 }
        affiliation: { type: string, enum: [department, foundation, external] }
        affiliationUnit:
          anyOf:
            - { type: string, minLength: 1, maxLength: 200 }
            - { type: 'null' }
        homeProgramId:
          anyOf:
            - { type: string, format: uuid }
            - { type: 'null' }
        homeDivisionId:
          anyOf:
            - { type: string, format: uuid }
            - { type: 'null' }
        supervisorUserId:
          anyOf:
            - { type: string, format: uuid }
            - { type: 'null' }
        email: { type: string, format: email, maxLength: 254 }
        mobile:
          anyOf:
            - { type: string, pattern: '^01[3-9][0-9]{8}$' }
            - { type: 'null' }
        roleKey: { type: string, minLength: 1, maxLength: 64 }
        language:
          description: The account's language; the system default language when left out (D-098).
          type: string
          enum: [bn, en]
    StaffProfileRequest:
      description: >-
        The whole profile of an official, replacing the stored one (DECISION_LOG D-097, BR-261);
        the same rules as StaffCreateRequest. The supervisor is an active department official and
        the line above never comes back to this official (422 user.supervisor_invalid).
      type: object
      additionalProperties: false
      required: [jobId, displayName, designation, affiliation, affiliationUnit, homeProgramId, homeDivisionId, supervisorUserId]
      properties:
        jobId: { type: string, maxLength: 64 }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        designation: { type: string, minLength: 1, maxLength: 200 }
        affiliation: { type: string, enum: [department, foundation, external] }
        affiliationUnit:
          anyOf:
            - { type: string, minLength: 1, maxLength: 200 }
            - { type: 'null' }
        homeProgramId:
          anyOf:
            - { type: string, format: uuid }
            - { type: 'null' }
        homeDivisionId:
          anyOf:
            - { type: string, format: uuid }
            - { type: 'null' }
        supervisorUserId:
          anyOf:
            - { type: string, format: uuid }
            - { type: 'null' }
