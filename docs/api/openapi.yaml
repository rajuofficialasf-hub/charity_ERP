        projects:
          type: array
          description: Active project assignments (read only here; assignment in T1.12)
          items:
            type: object
            required: [id, code, nameBn, nameEn, year, permissionSet, isPaid, regionLocationId, assignedAt]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              code: { type: string }
              nameBn: { type: string }
              nameEn: { type: string }
              year: { type: integer }
              permissionSet: { type: string }
              isPaid: { type: boolean }
              regionLocationId: { $ref: '#/components/schemas/Uuid' }
              assignedAt: { type: string, format: date-time }
        team:
          type: array
          description: The members who registered with this volunteer as their reference (name, type and state only)
          items:
            type: object
            required: [id, displayName, type, state]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              displayName: { type: string }
              type: { type: string, enum: [general, local_daee, both, team_member, paid] }
              state: { type: string, enum: [pending, active, blocked, deactivated] }
        category: { type: [string, 'null'], enum: [A, B, C, D, null], x-sensitive-class: volunteer.rating }
        inactiveFlag: { type: boolean, x-sensitive-class: volunteer.rating }
        ratings:
          type: array
          x-sensitive-class: volunteer.rating
          description: Finalized ratings per project and kind of work, never averaged (Phase 5)
          items:
            type: object
            required: [projectId, workKind, finalScores, finalizedAt]
            properties:
              projectId: { $ref: '#/components/schemas/Uuid' }
              workKind: { type: string }
              finalScores: {}
              finalizedAt: { type: string, format: date-time }
        blocklist:
          type: object
          required: [blocked]
          properties:
            blocked: { type: boolean }
            blockedAt: { type: string, format: date-time }
            reason: { type: string, x-sensitive-class: blocklist.reason }
        actions:
          type: object
          description: What the caller may do to this volunteer, decided like the action routes
          required: [review, approve, requestCorrection, block, unblock, viewSessions, revokeSessions]
          properties:
            review:
              type: boolean
              description: >-
                The caller may decide on this pending registration (approve, ask for a correction,
                reject), even while a correction holds it; approve and requestCorrection say
                whether that action is possible now
            approve: { type: boolean }
            requestCorrection: { type: boolean }
            block: { type: boolean }
            unblock: { type: boolean }
            viewSessions: { type: boolean }
            revokeSessions: { type: boolean }
    VolunteerResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Volunteer' }
        meta: { $ref: '#/components/schemas/Meta' }
    VolunteerList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/VolunteerSummary' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    ChangeValue:
      description: Text for a text field; an object for the address, the bank details, the profession ({ profession, details }), the skills, the education and the permanent address (O-65, O-66); a file id from the photo upload for a photo field (D-085)
      anyOf:
        - { type: string, maxLength: 2000 }
        - { type: object, propertyNames: { type: string }, additionalProperties: {} }
    RegistrationCorrectionCreate:
      type: object
      additionalProperties: false
      required: [fields, note]
      properties:
        fields:
          type: array
          minItems: 1
          maxItems: 40
          items: { type: string, enum: [name, fatherName, motherName, nid, whatsapp, address, addressLine, education, experience, workDescription, previousProjects, facebookId, bloodGroup, dateOfBirth, tshirtSize, volunteeringArea, profession, skills, educationDetails, permanentAddress, bank, photo, nid_photo, nid_photo_back] }
        note: { type: string, minLength: 3, maxLength: 1000 }
    EditRequestCreate:
      type: object
      additionalProperties: false
      required: [field]
      description: The new value is required except for a photo, which the own photo upload fills (D-085)
      properties:
        field: { type: string, enum: [name, fatherName, motherName, nid, whatsapp, address, addressLine, education, experience, workDescription, previousProjects, facebookId, bloodGroup, dateOfBirth, tshirtSize, volunteeringArea, profession, skills, educationDetails, permanentAddress, bank, photo, nid_photo, nid_photo_back, mobile, email] }
        newValue: { $ref: '#/components/schemas/ChangeValue' }
        note: { type: string, maxLength: 1000 }
    ChangeRequestAnswer:
      type: object
      additionalProperties: false
      required: [newValue]
      properties:
        newValue: { $ref: '#/components/schemas/ChangeValue' }
    OtpCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
    ChangeRequest:
      type: object
      required: [id, volunteerId, kind, field, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        volunteerId: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [registration_correction, profile_edit] }
        field: { type: string }
        newValue: { description: 'Absent for NID, bank, mobile and email values towards anyone but the owner and allowed officials' }
        note: { type: [string, 'null'] }
        status: { type: string, enum: [open, submitted, approved, rejected, closed] }
        contactVerified: { type: boolean, description: 'For a mobile or email change: the code to the new value was verified' }
        decidedAt: { type: [string, 'null'], format: date-time }
        volunteerName: { type: string, description: 'Display name of the volunteer; only in the approvers'' list (GET /edit-requests)' }
    ChangeRequestResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/ChangeRequest' }
        meta: { $ref: '#/components/schemas/Meta' }
    ChangeRequestList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ChangeRequest' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    PendingRegistration:
      type: object
      required: [userId, kind, displayName, status, submittedAt]
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [volunteer, staff] }
        displayName: { type: string }
        status: { type: string, enum: [awaiting_review, in_correction] }
        submittedAt: { type: string, format: date-time }
        volunteerType: { type: [string, 'null'], enum: [general, local_daee, both, team_member, paid, null] }
        divisionId: { type: [string, 'null'], format: uuid }
        districtId: { type: [string, 'null'], format: uuid }
        designation: { type: [string, 'null'] }
    PendingRegistrationList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/PendingRegistration' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    RegistrationDetail:
      allOf:
        - $ref: '#/components/schemas/PendingRegistration'
        - type: object
          properties:
            mobile: { type: [string, 'null'] }
            email: { type: [string, 'null'] }
            photoFileId: { type: [string, 'null'], format: uuid }
            homeProgramId: { type: [string, 'null'], format: uuid }
            homeDivisionId: { type: [string, 'null'], format: uuid }
            volunteer: { oneOf: [{ $ref: '#/components/schemas/PendingVolunteerDetail' }, { type: 'null' }] }
            blocklisted: { type: boolean }
            corrections: { type: array, items: { $ref: '#/components/schemas/ChangeRequest' } }
    RegistrationVolunteer:
      type: object
      description: The volunteer of a registration as the approval answers it
      required: [id, userId, displayName, type, state, districtId, upazilaId, approvedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        userId: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string }
        type: { type: string, enum: [general, local_daee, both, team_member, paid] }
        state: { type: string, enum: [pending, active, blocked, deactivated] }
        districtId: { $ref: '#/components/schemas/Uuid' }
        upazilaId: { $ref: '#/components/schemas/Uuid' }
        approvedAt: { type: [string, 'null'], format: date-time }
    RegistrationVolunteerResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/RegistrationVolunteer' }
        meta: { $ref: '#/components/schemas/Meta' }
    PendingVolunteerDetail:
      description: The volunteer of a pending registration as the approver opens it; NID, NID photos, bank, blood group and date of birth only inside the caller's field classes (RBAC.md 6)
      allOf:
