  # ======================= beneficiaries =======================
  /beneficiaries:
    get:
      tags: [beneficiaries]
      operationId: beneficiaries.beneficiary.list
      summary: Nationwide beneficiary tab with filters (masks per role)
      description: >-
        Every beneficiary the caller's beneficiary.view_all scope reaches, newest first (O-67, D-094):
        the officials and the Media Team nationwide, the Procurement Team only the beneficiaries of
        its house-construction projects. A digit search matches the mobile only with the
        beneficiary.contact class, an NID or birth registration only inside the beneficiary.view_nid
        scope.
      x-permission: beneficiary.view_all
      x-scope: beneficiary
      x-audit: none
      x-idempotency: none
      x-rate-limit: list
      x-sensitive-fields: [beneficiary.contact, beneficiary.address_detail, beneficiary.care, beneficiary.profile_detail]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IncludeTotal'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/VolunteerDivisionId'
        - $ref: '#/components/parameters/VolunteerDistrictId'
        - $ref: '#/components/parameters/VolunteerUpazilaId'
        - name: unionId
          in: query
          description: 403 without the beneficiary.address_detail class (O-67)
          schema: { type: string, format: uuid }
        - name: type
          in: query
          description: The beneficiary type (class code)
          schema: { type: string, pattern: '^[a-z][a-z0-9_]{0,49}$' }
        - name: projectId
          in: query
          description: Beneficiaries with an application in the project
          schema: { type: string, format: uuid }
        - name: year
          in: query
          description: Beneficiaries with an application in a project of the year
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - name: blocked
          in: query
          description: true for blocked beneficiaries; 403 without the beneficiary.care class (O-67)
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '200':
          description: Beneficiaries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BeneficiaryList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServerError' }
  /beneficiaries/statistics:
    get:
      tags: [beneficiaries]
      operationId: beneficiaries.beneficiary.statistics
      summary: Counts of the beneficiary tab for the filters in use (masks per role)
      description: >-
        The same filters as the list (O-67): everyone, those with an application approved or later in
        a project of this year, and the blocked (only with the beneficiary.care class).
      x-permission: beneficiary.view_all
      x-scope: beneficiary
      x-audit: none
      x-idempotency: none
      x-rate-limit: list
      x-sensitive-fields: [beneficiary.contact, beneficiary.address_detail, beneficiary.care, beneficiary.profile_detail]
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/VolunteerDivisionId'
        - $ref: '#/components/parameters/VolunteerDistrictId'
        - $ref: '#/components/parameters/VolunteerUpazilaId'
        - name: unionId
          in: query
          description: 403 without the beneficiary.address_detail class (O-67)
          schema: { type: string, format: uuid }
        - name: type
          in: query
          description: The beneficiary type (class code)
          schema: { type: string, pattern: '^[a-z][a-z0-9_]{0,49}$' }
        - name: projectId
          in: query
          description: Beneficiaries with an application in the project
          schema: { type: string, format: uuid }
        - name: year
          in: query
          description: Beneficiaries with an application in a project of the year
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - name: blocked
          in: query
          description: true for blocked beneficiaries; 403 without the beneficiary.care class (O-67)
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BeneficiaryStatisticsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServerError' }
  /beneficiaries/lookup:
    post:
      tags: [beneficiaries]
      operationId: beneficiaries.beneficiary.lookup
      summary: Look up by NID or birth registration for auto-fill (number in the body, never in the URL)
      description: >-
        The full auto-fill of a found profile wherever it lives, with the identity fields marked
        locked; never the other identity number or a block reason. A retired profile's number leads
        to the kept profile (`mergedInto`). Every lookup writes an audit row without the number,
        and the `lookup` rate limit counts per user and per address (D-114). A profile outside the
        caller's own scope is filled in 20 times a day per user; after that the lookup answers 429
        `beneficiary.lookup_outside_limit` until the next day in Bangladesh, while profiles inside
        the scope go on.
      x-permission: beneficiary.lookup
      x-scope: project
      x-audit: beneficiary.looked_up
      x-idempotency: none
      x-rate-limit: lookup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LookupRequest' }
      responses:
        '200':
          description: Lookup result with auto-fill fields only
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LookupResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /beneficiaries/{beneficiaryId}:
    parameters:
      - $ref: '#/components/parameters/BeneficiaryId'
    get:
      tags: [beneficiaries]
      operationId: beneficiaries.beneficiary.get
      summary: Beneficiary 360° profile shell (masks per role and record)
      description: >-
        The sections of the 360° profile with real data where it exists (O-67, D-094). NID and birth
        registration only inside the caller's beneficiary.view_nid scope; a project-scoped caller sees
        only the rows of its projects.
      x-permission: beneficiary.view_all
      x-scope: beneficiary
      x-audit: none
      x-idempotency: none
      x-rate-limit: list
      x-sensitive-fields: [beneficiary.contact, beneficiary.address_detail, beneficiary.care, beneficiary.profile_detail, beneficiary.application_history, beneficiary.nid]
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BeneficiaryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServerError' }
  /beneficiaries/{beneficiaryId}/family-members:
    parameters:
      - $ref: '#/components/parameters/BeneficiaryId'
    get:
      tags: [beneficiaries]
      operationId: beneficiaries.familyMember.list
      summary: Current household members (O-37); not paginated
      x-permission: beneficiary.view_all
      x-scope: beneficiary
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: Family members
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilyMemberList' }
        '404': { $ref: '#/components/responses/NotFound' }
  /beneficiaries/{beneficiaryId}/contact:
    parameters:
      - $ref: '#/components/parameters/BeneficiaryId'
    patch:
      tags: [beneficiaries]
      operationId: beneficiaries.contact.update
      summary: Edit the mobile and the address of a beneficiary outside an application (each change logged; identity fields refused)
      description: >-
        The mobile and the address down to village, post office and landmark (D-115); the four
        places of the address change together as one chain. Each changed field writes a change-log
        row of kind `contact_update`. A name or an identity number answers 422
        `beneficiary.locked_field`; the mobile of a volunteer an application of the person belongs
        to answers 409 `beneficiary.mobile_is_volunteer_mobile`; a mobile other live profiles have
        is saved with the `beneficiary.mobile_shared` warning, which names only the profiles the
        caller's scope reaches.
      x-permission: beneficiary.contact.edit
      x-scope: beneficiary
      x-audit: beneficiary.contact_updated
      x-idempotency: none
      x-rate-limit: default
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactUpdate' }
      responses:
        '200':
          description: The contact data after the edit, with the ETag of the new version
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /beneficiaries/{beneficiaryId}/correction-requests:
    parameters:
      - $ref: '#/components/parameters/BeneficiaryId'
    post:
      tags: [beneficiaries]
      operationId: beneficiaries.correction.create
      summary: Request correction of a locked field
      x-permission: beneficiary.correction.request
      x-scope: beneficiary
      x-audit: beneficiary.correction_requested
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrectionRequestCreate' }
      responses:
        '201':
          description: Requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CorrectionRequestResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /beneficiary-corrections/{requestId}/decision:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [beneficiaries]
      operationId: beneficiaries.correction.decide
      summary: Approve or reject a correction; approval changes the locked field
      description: >-
        Never by the official who requested it (403 `beneficiary.correction_own`); an approval
        re-checks that the field still holds the old value (409 `beneficiary.correction_stale`) and
        that a new identity number is unused (409 `beneficiary.identity_taken`), and applies it in
        the same transaction with a change-log row (D-115).
      x-permission: beneficiary.correction.approve
      x-scope: beneficiary
      x-audit: beneficiary.correction_decided
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CorrectionRequestResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /beneficiaries/merge-candidates:
    get:
      tags: [beneficiaries]
      operationId: beneficiaries.merge.candidates
      summary: Suspected duplicate profiles found by the system (BR-012)
      x-permission: beneficiary.merge.propose
      x-scope: beneficiary
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Candidates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MergeCandidateList' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /beneficiary-merges:
    post:
      tags: [beneficiaries]
      operationId: beneficiaries.merge.propose
      summary: Propose a merge of two profiles
      x-permission: beneficiary.merge.propose
      x-scope: beneficiary
      x-audit: beneficiary.merge_proposed
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MergeRequest' }
      responses:
        '201':
          description: Proposed
