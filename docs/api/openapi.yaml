  /projects/{projectId}/volunteers:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [volunteers]
      operationId: volunteers.assignment.list
      summary: Volunteers assigned to the project in the caller areas, with set, paid flag and consent
      x-permission: project.view
      x-scope: project
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Assignments that have not ended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectVolunteerList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    post:
      tags: [volunteers]
      operationId: volunteers.assignment.create
      summary: Assign up to 100 volunteers of the caller areas with a permission set and a paid flag
      description: >-
        All or nothing (BR-037, BR-038, D-096). A volunteer outside the caller areas, not approved,
        blocked or of the team-member type answers 404; one already assigned 409
        volunteer.already_assigned, one on a team of the project 409 volunteer.on_team; a set not
        meant for the volunteer's type 422. A paid flag needs volunteer.mark_paid. Each volunteer
        must accept the rules before working.
      x-permission: volunteer.assign_project
      x-scope: project
      x-audit: volunteer.assigned
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
