    get:
      tags: [projects]
      operationId: projects.candidate.list
      summary: Officials with a role, by name, to assign to the project (an RPM or field staff)
      description: >-
        Active officials holding the role whose name contains q (at least 2 characters), at most 20,
        names and designations only. The RPM of an area is looked up by the PM and the global roles
        only (403 otherwise); a field role also by an RPM of the project.
      x-permission: project.staff_access.manage
      x-scope: project
