      operationId: projects.component.update
      summary: Switch a component on or off and replace its settings (checked against its JSON Schema; BD-09)
      description: >-
        If-Match carries the component's own etag from the list. Settings that fail the component's schema answer 422 with the field paths; a closing, closed or cancelled project answers 409 project.read_only.
        A project without a stored application_form row gets it with the first save, switched off unless the save says otherwise.
        A save that changes what the application asks (identity_document, mobile, repeat_person, repeat_family of application_form)
