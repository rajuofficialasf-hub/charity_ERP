      tags: [projects]
      operationId: projects.fundSource.replace
      summary: Replace the fund-source tags with their amounts, and the budget when it changes with them
      description: >-
        Once a project is active its fund sources always add up to its planned budget (cost per
        beneficiary × target), so a budget change comes with its fund sources in this one request;
        otherwise 422 project.budget_mismatch (D-095). A draft may save them apart. A fund source
