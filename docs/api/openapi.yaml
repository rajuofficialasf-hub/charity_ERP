    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [projects]
      operationId: projects.project.activate
      summary: Activate a complete draft (guard project.setup_complete; snapshots the workflow)
      description: >-
        An incomplete draft answers 409 workflow.guard.project_setup_complete with the missing
        items in details (BR-258). On success the workflow definition is stored as the
        project's workflow snapshot, so later workflow versions never change a running project.
        A draft of an inactive program answers 409 program.inactive.
      x-permission: project.activate
      x-scope: project
      x-audit: project.activate
      x-idempotency: none
      x-rate-limit: default
