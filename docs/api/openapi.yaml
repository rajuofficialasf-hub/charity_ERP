        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /projects/{projectId}/rules:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: projects.rules.get
      summary: The four rules texts and their version (officials; volunteers read them as their own)
      x-permission: project.view
      x-scope: project
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectRulesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [projects]
      operationId: projects.rules.replace
      summary: Save the rules texts as a new version; every acceptance goes back to pending
      description: >-
        Every saved change is a new version kept in project_rules_versions (BR-039, D-096); in the
        same transaction every accepted assignment and team membership of the project goes back to
        pending. The same texts again make no new version. Once the project has been active, a body
        without a required text answers 409 workflow.guard.project_setup_complete with the rules items.
      x-permission: project.configure
      x-scope: project
      x-audit: project.configure
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectRules' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectRulesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
