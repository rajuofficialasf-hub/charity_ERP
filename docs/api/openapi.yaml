          required: [fatherName, motherName, divisionId, unionId, photoFileId, referenceVolunteerId]
          properties:
            fatherName: { type: string }
            motherName: { type: string }
            mobile: { type: [string, 'null'] }
            whatsapp: { type: [string, 'null'] }
            divisionId: { $ref: '#/components/schemas/Uuid' }
            unionId: { $ref: '#/components/schemas/Uuid' }
            addressLine: { type: [string, 'null'] }
            education: { type: [string, 'null'] }
            experience: { type: [string, 'null'] }
            workDescription: { type: [string, 'null'] }
            previousProjects: { type: [string, 'null'] }
            facebookId: { type: [string, 'null'] }
            nid: { type: string, x-sensitive-class: volunteer.identity }
            nidPhotoFileId: { type: [string, 'null'], format: uuid, x-sensitive-class: volunteer.identity }
            nidPhotoBackFileId: { type: [string, 'null'], format: uuid, x-sensitive-class: volunteer.identity }
            bank:
              type: object
              x-sensitive-class: volunteer.bank
              properties:
                bankName: { type: [string, 'null'] }
                accountName: { type: [string, 'null'] }
                accountNumber: { type: [string, 'null'] }
                branchName: { type: [string, 'null'] }
                routingNumber: { type: [string, 'null'] }
            photoFileId: { type: [string, 'null'], format: uuid }
            referenceVolunteerId: { type: [string, 'null'], format: uuid }
    RegistrationDetailResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/RegistrationDetail' }
        meta: { $ref: '#/components/schemas/Meta' }
    OwnVolunteerProfile:
      type: object
      description: The volunteer's own profile; includes the own NID, bank details and personal data in full (D-081, O-65) and never the own rating or category
      allOf:
        - $ref: '#/components/schemas/VolunteerProfileDetails'
      required: [userId, state, displayName, inAnyProject]
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }
        volunteerId: { type: [string, 'null'], format: uuid }
        state: { type: string, enum: [pending, active, blocked, deactivated] }
        displayName: { type: string }
        mobile: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        inAnyProject: { type: boolean, description: False shows the "not yet in any project" message (BR-031) }
        fatherName: { type: string }
        motherName: { type: string }
        nid: { type: string }
        type: { type: string, enum: [general, local_daee, both, team_member, paid] }
        whatsapp: { type: [string, 'null'] }
        divisionId: { $ref: '#/components/schemas/Uuid' }
        districtId: { $ref: '#/components/schemas/Uuid' }
        upazilaId: { $ref: '#/components/schemas/Uuid' }
        unionId: { $ref: '#/components/schemas/Uuid' }
        addressLine: { type: [string, 'null'] }
        education: { type: [string, 'null'] }
        experience: { type: [string, 'null'] }
        workDescription: { type: [string, 'null'] }
        previousProjects: { type: [string, 'null'] }
        facebookId: { type: [string, 'null'] }
        bank: { $ref: '#/components/schemas/BankDetails' }
        referenceNid: { type: [string, 'null'] }
        photoFileId: { type: [string, 'null'], format: uuid }
        nidPhotoFileId: { type: [string, 'null'], format: uuid }
        nidPhotoBackFileId: { type: [string, 'null'], format: uuid }
    OwnVolunteerProfileResponse:
      type: object
