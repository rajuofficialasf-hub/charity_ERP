        - name: unionId
          in: query
          description: 403 without the beneficiary.address_detail class (O-67)
          schema: { type: string, format: uuid }
        - name: type
          in: query
          description: The beneficiary type (class code)
          schema: { type: string, pattern: '^[a-z][a-z0-9_]{0,49}$' }
        - name: gender
          in: query
          description: The gender, one of the two the list counts; 403 without the beneficiary.profile_detail class (D-146)
          schema: { type: string, enum: [male, female] }
        - name: projectId
          in: query
          description: Beneficiaries with an application in the project
