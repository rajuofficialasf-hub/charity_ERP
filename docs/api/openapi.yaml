      x-audit: volunteer.assignment_ended
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /projects/{projectId}/transfers:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [applications]
      operationId: applications.transfer.create
      summary: Hand all or chosen applications of one volunteer to another on an active project, with a reason; optionally move the old volunteer's team and assign the new volunteer in the same request
      description: >-
        BD-07, R22 to R26. The RPM, or an Executive the RPM granted application.transfer; moving the
        team needs volunteer.team.transfer, assigning needs volunteer.assign_project. The new volunteer
        must be active, not blocklisted and on the project (422); every application must be the old
        volunteer's on this project (422) and inside the caller's scope (404); a project that is not
        active refuses (409). The owner changes, an open unlock waits for the new owner, the old
        volunteer and their unmoved team no longer reach the applications; each application gets a
        transfer row and a timeline step, one audit entry names the batch, and the two volunteers are
        told how many moved. Going over the new volunteer's limit is allowed and reported.
      x-permission: application.transfer
      x-scope: application
      x-audit: application.transfer
      x-idempotency: header
      x-rate-limit: sync
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferRequest' }
      responses:
        '200':
          description: Transferred
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /projects/{projectId}/volunteers/{volunteerId}/applications:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: volunteerId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    get:
      tags: [applications]
      operationId: applications.transfer.candidates
      summary: "A volunteer's applications on the project that the caller may hand to another volunteer (the transfer's picker)"
      x-permission: application.transfer
      x-scope: application
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: The applications, oldest first, at most 500
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferCandidateList' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ======================= beneficiaries =======================
