            application/json:
              schema: { $ref: '#/components/schemas/MergeResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /beneficiary-merges/{requestId}/execute:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [beneficiaries]
      operationId: beneficiaries.merge.execute
      summary: Execute a merge; the retired BEN-ID points to the kept profile (BR-013)
      x-permission: beneficiary.merge
      x-scope: beneficiary
      x-audit: beneficiary.merge
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: Merged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MergeResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /beneficiary-merges/{requestId}/revert:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [beneficiaries]
      operationId: beneficiaries.merge.revert
      summary: Revert a merge (Monitoring Team)
      x-permission: beneficiary.merge.revert
      x-scope: beneficiary
      x-audit: beneficiary.merge_reverted
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Reverted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MergeResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /beneficiaries/{beneficiaryId}/block:
    parameters:
      - $ref: '#/components/parameters/BeneficiaryId'
    post:
      tags: [beneficiaries]
      operationId: beneficiaries.blocklist.set
      summary: Block a beneficiary with a reason; ongoing applications continue (BD-06)
      x-permission: beneficiary.block
      x-scope: beneficiary
      x-audit: blocklist.set
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlocklistRequest' }
      responses:
        '201':
          description: Blocked
          content:
            application/json:
