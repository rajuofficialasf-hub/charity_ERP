  /projects/{projectId}/fund-sources:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: projects.fundSource.list
      summary: Fund-source tags of the budget (BD-30; the program's PM and the global roles only); not paginated
      x-permission: project.view
      x-scope: project
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FundSourceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [projects]
      operationId: projects.fundSource.replace
      summary: Replace the fund-source tags with their amounts, and the budget when it changes with them
      description: >-
        Once a project is active its fund sources always add up to its planned budget (cost per
        beneficiary × target), so a budget change comes with its fund sources in this one request;
        otherwise 422 project.budget_mismatch (D-095). A draft may save them apart. A fund source
        that budget entries already use cannot be removed (409 project.fund_source_in_use).
      x-permission: fund_source.manage
      x-scope: project
      x-audit: project.fund_source_change
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FundSourceReplace' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FundSourceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
