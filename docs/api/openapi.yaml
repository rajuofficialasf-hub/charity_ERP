          items:
            type: object
            additionalProperties: false
            required: [volunteerId]
            properties:
              volunteerId: { type: string, format: uuid }
              permissionSet: { type: string, enum: [application_distribution, application_distribution_dawah, work_progress] }
              isPaid: { type: boolean, default: false }
    ProjectVolunteerUpdate:
      type: object
      additionalProperties: false
      description: At least one of the two.
      properties:
        permissionSet: { type: string, enum: [application_distribution, application_distribution_dawah, work_progress] }
        isPaid: { type: boolean }
    ProjectVolunteer:
      type: object
      required: [id, volunteerId, displayName, type, regionLocationId, permissionSet, isPaid, consentStatus, consentAt, applicationsCounted, assignedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        volunteerId: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string }
        type: { type: string }
        regionLocationId: { $ref: '#/components/schemas/Uuid' }
        permissionSet: { type: string, enum: [application_distribution, application_distribution_dawah, work_progress] }
        isPaid: { type: boolean }
        consentStatus: { type: string, enum: [pending, accepted] }
        consentAt: { type: [string, 'null'], format: date-time }
        applicationsCounted: { type: integer, minimum: 0 }
        assignedAt: { type: string, format: date-time }
    ProjectVolunteerList:
      type: object
      required: [data, meta]
      properties:
