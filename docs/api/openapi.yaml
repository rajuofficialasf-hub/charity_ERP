    parameters:
      - $ref: '#/components/parameters/FormId'
    get:
      tags: [forms]
      operationId: forms.field.map
      summary: The fields of a form across its versions by key, so reports align answers of different versions (BD-12)
      x-permission: form.build
      x-scope: project
      x-audit: none
