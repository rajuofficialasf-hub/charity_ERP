        id: { $ref: '#/components/schemas/Uuid' }
        field: { type: string }
        kind: { type: string, enum: [unlock, contact_update, correction, sync_conflict] }
        unlockState: { type: [string, 'null'], enum: [open, updated, relocked, null] }
        oldValue: {}
        newValue: {}
        reason: { type: [string, 'null'] }
        requestedBy: { type: [string, 'null'], format: uuid }
        approvedBy: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
    FieldChangeList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/FieldChange' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    Transfer:
      type: object
      required: [id, applicationId, fromVolunteerId, toVolunteerId, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        applicationId: { $ref: '#/components/schemas/Uuid' }
        fromVolunteerId: { $ref: '#/components/schemas/Uuid' }
        toVolunteerId: { $ref: '#/components/schemas/Uuid' }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
    TransferList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Transfer' } }
        meta: { $ref: '#/components/schemas/ListMeta' }

    # ---------------- activities ----------------
    ActivityCreate:
      type: object
      required: [clientUuid, applicationId, type]
      properties:
        clientUuid: { $ref: '#/components/schemas/Uuid' }
        clientCreatedAt: { type: string, format: date-time }
        applicationId: { $ref: '#/components/schemas/Uuid' }
        type: { type: string, enum: [distribution, construction, purchase, training, visit, payment, voucher, expense, issue, inspection, follow_up] }
        stage: { type: string }
        outcome: { type: string }
        comment: { type: string }
        photoFileIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
    Activity:
      allOf:
        - $ref: '#/components/schemas/ActivityCreate'
        - type: object
          required: [id, projectId, status, doneBy, doneAt]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            projectId: { $ref: '#/components/schemas/Uuid' }
            status: { type: string, enum: [planned, done, failed] }
            doneBy: { $ref: '#/components/schemas/Uuid' }
            doneAt: { type: string, format: date-time }
    ActivityResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Activity' }
        meta: { $ref: '#/components/schemas/Meta' }
    ActivityList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Activity' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    BulkRow:
      type: object
      required: [clientUuid, applicationId]
      properties:
        clientUuid: { $ref: '#/components/schemas/Uuid' }
        applicationId: { $ref: '#/components/schemas/Uuid' }
        outcome: { type: string }
        stage: { type: string }
        present: { type: boolean, description: class screen }
        familyMemberId: { type: string, format: uuid, description: 'class screen - family attendance (O-11)' }
        absenceReason: { type: string }
        topicUpdates:
          type: array
          description: class screen
          items:
            type: object
            properties:
              topicId: { $ref: '#/components/schemas/Uuid' }
              status: { type: string, enum: [in_progress, learned] }
        method: { type: string, enum: [visit, phone], description: followup screen }
        answers: { type: object, description: followup screen answers (followup-answers schema) }
        photoFileIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        comment: { type: string }
    BulkRequest:
      type: object
      required: [rows]
      properties:
        rows: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/BulkRow' } }
    RowResult:
      type: object
      required: [clientUuid, result]
      properties:
        clientUuid: { $ref: '#/components/schemas/Uuid' }
        result: { type: string, enum: [done, failed, pending_photos, needs_verification, synced] }
        code: { type: [string, 'null'], description: Error code when failed }
        serverId: { type: [string, 'null'], format: uuid }
        status: { type: [string, 'null'] }
        stage: { type: [string, 'null'] }
    BulkResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [results]
          properties:
            results: { type: array, items: { $ref: '#/components/schemas/RowResult' } }
        meta: { $ref: '#/components/schemas/Meta' }

    # ---------------- files ----------------
    UploadSessionCreate:
      type: object
      required: [clientUuid, kind, entityType, slot, mime, sizeBytes, sha256, source]
      properties:
        clientUuid: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [distribution_proof, construction_proof, evidence, voucher, payment_copy, document, animal_photo, profile_photo, nid_photo, media_asset, issue_photo] }
        entityType: { type: string }
        entityId: { type: string, format: uuid, description: Omit when the owning record is not yet synced }
        slot: { type: string }
        mime: { type: string }
        sizeBytes: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        capturedAt: { type: string, format: date-time }
        recordCreatedAt: { type: string, format: date-time }
        gps: { $ref: '#/components/schemas/Gps' }
        source: { type: string, enum: [camera, gallery, scan] }
    UploadSession:
      type: object
      required: [id, chunkSize, parts, expiresAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        chunkSize: { type: integer, const: 262144 }
        parts:
          type: array
          items:
            type: object
            required: [partNumber, url]
            properties:
              partNumber: { type: integer }
              url: { type: string, format: uri }
              acknowledged: { type: boolean }
        expiresAt: { type: string, format: date-time }
    UploadSessionResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/UploadSession' }
        meta: { $ref: '#/components/schemas/Meta' }
    FileInfo:
      type: object
      required: [id, kind, mime, sizeBytes, virusScan, flags]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string }
        mime: { type: string }
        sizeBytes: { type: integer }
        capturedAt: { type: [string, 'null'], format: date-time }
        uploadedAt: { type: string, format: date-time }
        virusScan: { type: string, enum: [pending, clean, infected, failed, skipped] }
        flags: { type: array, items: { type: string, enum: [no_capture_time, no_gps, gallery_under_camera_only, stale_capture, duplicate_suspect] } }
        duplicateOf: { type: [string, 'null'], format: uuid }
    FileInfoResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/FileInfo' }
        meta: { $ref: '#/components/schemas/Meta' }
    FileUrlRequest:
      type: object
      properties:
        variant: { type: string, enum: [original, thumb_small, thumb_medium], default: original }
    FileUrlResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [url, expiresAt]
          properties:
            url: { type: string, format: uri }
            expiresAt: { type: string, format: date-time }
        meta: { $ref: '#/components/schemas/Meta' }

    # ---------------- notifications and exports ----------------
    Notification:
      type: object
      required: [id, templateKey, title, body, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        templateKey: { type: string }
        title: { type: string }
        body: { type: string }
        link: { type: [string, 'null'], description: In-app route of the related record }
        count: { type: integer, description: Coalesced events (O-35) }
        readAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    NotificationList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        meta:
          allOf:
            - $ref: '#/components/schemas/ListMeta'
            - type: object
              properties:
                unreadCount: { type: integer }
    MarkReadRequest:
      type: object
      properties:
        ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        all: { type: boolean }
    PreferencesResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '../database/json-schemas/user-preferences.schema.json' }
        meta: { $ref: '#/components/schemas/Meta' }
    ExportCreate:
      type: object
      required: [kind, format]
      properties:
        kind: { type: string, enum: [applications, beneficiaries, volunteers, form_data, work_summary, audit] }
        format: { type: string, enum: [csv, xlsx, pdf] }
        filters: { type: object }
    ExportJob:
      type: object
      required: [id, kind, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string }
        status: { type: string, enum: [queued, running, done, failed] }
        rowCount: { type: [integer, 'null'] }
        fileId: { type: [string, 'null'], format: uuid }
        sensitive: { type: boolean }
        createdAt: { type: string, format: date-time }
    ExportJobResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/ExportJob' }
        meta: { $ref: '#/components/schemas/Meta' }

    # ---------------- reference data ----------------
    Location:
      type: object
      required: [id, level, code, name, active]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        parentId: { type: [string, 'null'], format: uuid }
        level: { type: string, enum: [division, district, upazila, union] }
        code: { type: string }
        name: { $ref: '#/components/schemas/Bilingual' }
        active: { type: boolean }
    LocationCreate:
      type: object
      required: [parentId, level, code, name]
      properties:
        parentId: { $ref: '#/components/schemas/Uuid' }
        level: { type: string, enum: [district, upazila, union] }
        code: { type: string }
        name: { $ref: '#/components/schemas/Bilingual' }
    LocationUpdate:
      type: object
      properties:
        name: { $ref: '#/components/schemas/Bilingual' }
        active: { type: boolean, description: Deactivate instead of delete (O-09) }
    LocationResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Location' }
        meta: { $ref: '#/components/schemas/Meta' }
    LocationList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Location' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    ReferenceItem:
      type: object
      required: [code, label, active]
      properties:
        code: { type: string, pattern: '^[a-z0-9_]{1,64}$' }
        label: { $ref: '#/components/schemas/Bilingual' }
        active: { type: boolean }
        sortOrder: { type: integer }
    ReferenceList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ReferenceItem' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    ReferenceItemResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/ReferenceItem' }
        meta: { $ref: '#/components/schemas/Meta' }
    Setting:
      type: object
      required: [key, value]
      properties:
        key: { type: string }
        value: {}
        updatedAt: { type: string, format: date-time }
    SettingResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Setting' }
        meta: { $ref: '#/components/schemas/Meta' }
    SettingList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Setting' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    SettingUpdate:
      type: object
      required: [value]
      properties:
        value: {}
    NisabVersion:
      type: object
      required: [value, effectiveFrom]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        value: { $ref: '#/components/schemas/Money' }
        effectiveFrom: { type: string, format: date }
        basisNote: { type: string }
    NisabResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/NisabVersion' }
        meta: { $ref: '#/components/schemas/Meta' }
    NisabList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/NisabVersion' } }
        meta: { $ref: '#/components/schemas/ListMeta' }

    # ---------------- sync ----------------
    SyncRecord:
      type: object
      required: [clientUuid, kind, payload, clientCreatedAt]
      properties:
        clientUuid: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [application_draft, application_submit, application_update, field_update, activity, stock_receive, stock_reconcile, expense_claim, voucher_submit, consent_accept, edit_request, profile_contact_update] }
        target: { type: [string, 'null'], format: uuid }
        projectId: { $ref: '#/components/schemas/Uuid' }
        formVersionId: { $ref: '#/components/schemas/Uuid' }
        templateVersion: { type: integer }
        payload: { type: object, description: Validated with the shared schema of the record kind }
        clientCreatedAt: { type: string, format: date-time }
        clientUpdatedAt: { type: string, format: date-time }
        dependencies: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
    SyncBatchRequest:
      type: object
      required: [deviceTime, records]
      properties:
        deviceTime: { type: string, format: date-time }
        records: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/SyncRecord' } }
    SyncBatchResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [serverTime, results]
          properties:
            serverTime: { type: string, format: date-time }
            results: { type: array, items: { $ref: '#/components/schemas/RowResult' } }
        meta: { $ref: '#/components/schemas/Meta' }
    SnapshotResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [serverTime]
          properties:
            serverTime: { type: string, format: date-time }
            projects: { type: array, items: { $ref: '#/components/schemas/Project' } }
            formVersions: { type: array, items: { $ref: '#/components/schemas/FormVersion' } }
            applications: { type: array, items: { $ref: '#/components/schemas/ApplicationSummary' } }
            beneficiaries: { type: array, items: { $ref: '#/components/schemas/BeneficiarySummary' } }
            locationsVersion: { type: integer }
            removedIds: { type: array, items: { $ref: '#/components/schemas/Uuid' }, description: Records no longer in the caller's scope }
        meta: { $ref: '#/components/schemas/Meta' }

paths:
  # ======================= auth =======================
  /auth/register/start:
    post:
      tags: [auth]
      operationId: auth.registration.start
      summary: Start a registration draft of a kind; nothing is sent, each contact is verified on its own (D-090)
      security: []
      x-permission: public
      x-scope: self
      x-audit: auth.register_started
      x-idempotency: none
      x-rate-limit: registration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationStartRequest' }
      responses:
        '201':
          description: Draft started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationStartResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/register/otp/send:
    post:
      tags: [auth]
      operationId: auth.registration.resendOtp
      summary: Send an OTP to one contact of the draft; a changed address clears that channel (D-090; dummy code in dev/test)
      security: []
      x-permission: public
      x-scope: self
      x-audit: auth.otp_sent
      x-idempotency: none
      x-rate-limit: otp-request
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpSendRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/register/otp/verify:
    post:
      tags: [auth]
      operationId: auth.registration.verifyOtp
      summary: Verify the OTP of one channel; once both are verified returns the draft token once (BR-023, D-082, D-090); a contact of an existing account answers registration.account_exists only then (D-086)
      security: []
      x-permission: public
      x-scope: self
      x-audit: auth.otp_verified
      x-idempotency: none
      x-rate-limit: otp-verify
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
      responses:
        '200':
          description: The channel is verified; with both, the draft token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationVerifiedResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/register/photos/{slot}:
    parameters:
      - name: slot
        in: path
        required: true
        schema: { type: string, enum: [photo, nid_photo, nid_photo_back] }
    post:
      tags: [auth]
      operationId: auth.registration.uploadPhoto
      summary: Upload the photo or the NID photo of a verified draft (JPEG or PNG, at most 2 MB; metadata stripped; replaces the slot's earlier upload; D-087)
      security: []
      x-permission: public
      x-scope: self
      x-audit: file.uploaded
      x-idempotency: none
      x-rate-limit: public-form
      x-sensitive-fields: [volunteer.identity]
      parameters:
        - $ref: '#/components/parameters/RegistrationToken'
        - name: registrationId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: source
          in: query
          schema: { type: string, enum: [camera, gallery] }
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadedPhotoResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '413': { $ref: '#/components/responses/Unprocessable' }
        '415': { $ref: '#/components/responses/Unprocessable' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/register/submit:
    post:
      tags: [auth]
      operationId: auth.registration.submit
      summary: Submit the registration form of the draft's kind; the account is created in state pending, or a rejected never-approved account returns to pending (D-086)
      security: []
      x-permission: public
      x-scope: self
      x-audit: auth.registered
      x-idempotency: none
      x-rate-limit: registration
      x-sensitive-fields: [volunteer.identity, volunteer.bank]
      parameters:
        - $ref: '#/components/parameters/RegistrationToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationSubmitRequest' }
      responses:
        '201':
          description: Registered; awaiting approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/login:
    post:
      tags: [auth]
      operationId: auth.session.login
      summary: Log in with mobile or email and password; no OTP at login (O-05)
      security: []
      x-permission: public
      x-scope: self
      x-audit: auth.login
      x-idempotency: none
      x-rate-limit: login
      parameters:
        - $ref: '#/components/parameters/ClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Tokens issued; the refresh cookie is set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '423': { $ref: '#/components/responses/Locked' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/refresh:
    post:
      tags: [auth]
      operationId: auth.session.refresh
      summary: Rotate the refresh token and issue a new access token
      security:
        - refreshCookie: []
      x-permission: public
      x-scope: self
      x-audit: none
      x-idempotency: none
      x-rate-limit: refresh
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: auth.session.logout
      summary: Revoke the current device session; the PWA wipes local data
      x-permission: authenticated
      x-scope: self
      x-audit: auth.logout
      x-idempotency: none
      x-rate-limit: default
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [auth]
      operationId: auth.me.get
      summary: Current user, roles, language and state (block message when blocked)
      x-permission: authenticated
      x-scope: self
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password/change:
    post:
      tags: [auth]
      operationId: auth.password.change
      summary: Change own password; revokes the user's other device sessions
      x-permission: authenticated
      x-scope: self
      x-audit: auth.password_changed
      x-idempotency: none
      x-rate-limit: password-reset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
