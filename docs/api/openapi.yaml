openapi: 3.1.0
info:
  title: Charity & Social Service ERP API
  version: 1.0.0-phase2
  license:
    name: Proprietary, As-Sunnah Foundation
    identifier: LicenseRef-ASF-Proprietary
  description: >-
    REST contract of the Charity & Social Service ERP (As-Sunnah Foundation), Phase 1 and Phase 2 modules,
    written in task T0.18 (2026-10-10). Conventions are defined in docs/api/API_STANDARDS.md: envelope,
    keyset cursor pagination, ETag and If-Match, the error-code catalogue, idempotency through clientUuid or
    the Idempotency-Key header, rate-limit classes and the required x- annotations. Every operation declares
    x-permission (a name from docs/security/permissions.yaml, or one of the markers public, authenticated,
    workflow, entity), x-scope, x-audit, x-idempotency and x-rate-limit. Later phases extend this file;
    an existing contract is never broken silently (API_STANDARDS section 17). The generated document from
    the code must match this file (drift test, NFR-54).
servers:
  - url: /api/v1
    description: Versioned base path
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Registration with OTP, login, token refresh, password (AUTH.md)
  - name: sessions
    description: Device sessions and remote revocation (AUTH.md section 8)
  - name: users
    description: Users, account states, handover, system owner (AUTH.md sections 7, 10, 11)
  - name: access
    description: Roles, permissions, permission panel and project grants (RBAC.md)
  - name: registration
    description: Registration review, correction and edit requests (A5)
  - name: volunteers
    description: Volunteer tab, profile, assignment, teams, categories, blocklist, transfer (A5)
  - name: beneficiaries
    description: Beneficiary tab, identity lookup, 360 profile, corrections, merge, blocklist, consent (A7, B3)
  - name: programs
    description: Programs (A2, A6)
  - name: projects
    description: Projects, components, areas, staff, quotas, fund sources, lifecycle (A6)
  - name: templates
    description: Project templates (BD-10)
  - name: forms
    description: Forms, versions, sections, fields, options, public link (B3)
  - name: public
    description: Public application form without login (A8.5, O-08)
  - name: applications
    description: Applications, workflow actions, scores, quotas, field unlock, transfers (A7, WORKFLOW_ENGINE.md)
  - name: activities
    description: Activities and bulk-update screens (B5, WORKFLOW_ENGINE.md section 8)
  - name: files
    description: Upload sessions and signed download URLs (FILES_AND_DOCUMENTS.md)
  - name: notifications
    description: In-app inbox and preferences (NOTIFICATIONS.md)
  - name: exports
    description: Asynchronous export jobs (API_STANDARDS section 14)
  - name: reference
    description: Locations, reference lists, settings, nisab versions
  - name: sync
    description: Offline sync batch and snapshot (OFFLINE_SYNC.md)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token, 15 minutes (O-05). Refresh at POST /auth/refresh with the refresh cookie and X-CSRF-Token.
    refreshCookie:
      type: apiKey
      in: cookie
      name: css_refresh
      description: >-
        HttpOnly, Secure, SameSite=Strict refresh token cookie scoped to /api/v1/auth/refresh; the value is the
        device session id, a dot and 256 random bits, rotated on every refresh (D-070). Login and refresh also set
        the readable cookie css_csrf (path /, SameSite=Strict) whose value the PWA sends as X-CSRF-Token.

  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque, signed keyset cursor from meta.nextCursor or meta.prevCursor.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, default 25, maximum 100 (NFR-11).
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IncludeTotal:
      name: include
      in: query
      required: false
      description: Set to total to receive meta.total (exact up to 10000, otherwise "10000+").
      schema: { type: string, enum: [total] }
    Sort:
      name: sort
      in: query
      required: false
      description: Comma-separated whitelisted fields, leading minus for descending.
      schema: { type: string }
    Search:
      name: q
      in: query
      required: false
      description: Name or number search (trigram, O-39). Identity numbers use the lookup endpoint.
      schema: { type: string, minLength: 2, maxLength: 100 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag of the record as last read (API_STANDARDS section 6).
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID chosen by the client for this batch (API_STANDARDS section 9).
      schema: { type: string, format: uuid }
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: bn or en; messages fall back to the user's language, then bn.
      schema: { type: string, enum: [bn, en] }
    ClientVersion:
      name: X-Client-Version
      in: header
      required: false
      description: PWA version; below the minimum supported version the server returns 426.
      schema: { type: string }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Double-submit token equal to the css_csrf cookie and signed for the session (refresh only, D-070).
      schema: { type: string }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProgramId:
      name: programId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BeneficiaryId:
      name: beneficiaryId
      in: path
      required: true
      description: The BEN-ID (UUID v7, O-03).
      schema: { type: string, format: uuid }
    VolunteerId:
      name: volunteerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FormId:
      name: formId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionId:
      name: versionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FileId:
      name: fileId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UploadSessionId:
      name: uploadSessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LocationId:
      name: locationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RegistrationToken:
      name: X-Registration-Token
      in: header
      required: true
      description: Draft token returned once by the OTP verification (D-082); never in a URL or a log.
      schema: { type: string, minLength: 32, maxLength: 128 }
    RequestId:
      name: requestId
      in: path
      required: true
      description: Id of a correction, edit or merge request.
      schema: { type: string, format: uuid }
    GrantId:
      name: grantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ComponentKey:
      name: componentKey
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z_]{2,64}$' }
    ApplicationAction:
      name: action
      in: path
      required: true
      description: >-
        Workflow action of the common cycle or the project's template (WORKFLOW_ENGINE.md section 3):
        submit, review, send_for_approval, approve, reject, waitlist, pull_from_waitlist, delete, verify_link,
        reject_unverified. The permission is the transition's permission in the project's snapshot.
      schema:
        type: string
        enum: [submit, review, send_for_approval, approve, reject, waitlist, pull_from_waitlist, delete, verify_link, reject_unverified]
    AppNo:
      name: appNo
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Z]{2,8}-[0-9]{4}-[0-9]{5}$' }
    ListKey:
      name: listKey
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z_]{2,64}$' }
    SettingKey:
      name: settingKey
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9_.]{2,100}$' }
    PublicToken:
      name: token
      in: path
      required: true
      schema: { type: string, minLength: 16 }

  headers:
    ETag:
      description: Weak validator derived from updated_at.
      schema: { type: string }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer }
    IdempotentReplay:
      description: true when the response replays a stored result.
      schema: { type: boolean }

  responses:
    BadRequest:
      description: Malformed request or unknown parameter (validation.malformed, validation.unknown_parameter).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: >-
        auth.token_missing, auth.token_expired, auth.token_stale, auth.session_revoked, auth.refresh_invalid,
        auth.refresh_reused, auth.invalid_credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: permission.denied, auth.account_blocked, auth.account_pending, auth.account_deactivated, auth.csrf_failed, sync.not_permitted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: permission.not_found - the record does not exist or is outside the caller's scope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: >-
        workflow.transition_not_allowed, workflow.guard.<guard_name>, conflict.locked_on_server,
        beneficiary.already_applied, payment.transaction_id_exists, payment.claim_already_paid,
        animal.already_allocated, file.duplicate, export.not_ready, session.use_logout,
        user.system_owner_protected, user.handover_required, user.transition_not_allowed, user.not_locked.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Gone:
      description: file.infected, file.session_expired, export.expired.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PreconditionFailed:
      description: conflict.stale_version - If-Match does not match; details carry the current version.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge:
      description: sync.batch_too_large, file.too_large.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnsupportedMediaType:
      description: file.type_not_allowed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unprocessable:
      description: >-
        validation.failed with field details; business rules such as beneficiary.identity_missing,
        beneficiary.mobile_is_volunteer_mobile, beneficiary.blocked, beneficiary.locked_field,
        workflow.reason_required, workflow.comment_required, otp.invalid, otp.expired, file.source_not_allowed;
        password details validation.password_too_short, validation.password_uppercase_digit,
        auth.current_password_invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Locked:
      description: auth.account_locked (with Retry-After, the seconds until the lock ends), file.quarantined.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UpgradeRequired:
      description: client.upgrade_required - sync the outbox, then update the PWA.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: rate_limit.exceeded or otp.attempts_exceeded.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServerError:
      description: server.internal or server.unavailable; never contains stack traces or SQL.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NoContent:
      description: Done; nothing to return.

  schemas:
    Uuid: { type: string, format: uuid }
    Money:
      type: string
      pattern: '^[0-9]{1,12}(\.[0-9]{1,2})?$'
      description: Decimal string in BDT; digits 0-9 (UX-05).
    Bilingual:
      type: object
      required: [bn, en]
      properties:
        bn: { type: string }
        en: { type: string }
    Gps:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        accuracyM: { type: number, minimum: 0 }
    Meta:
      type: object
      required: [requestId]
      properties:
        requestId: { type: string }
        etag: { type: string }
    ListMeta:
      type: object
      required: [requestId, limit]
      properties:
        requestId: { type: string }
        limit: { type: integer }
        nextCursor: { type: [string, 'null'] }
        prevCursor: { type: [string, 'null'] }
        total:
          oneOf:
            - type: integer
            - type: string
              const: 10000+
    ErrorDetail:
      type: object
      required: [code, messageKey, message]
      properties:
        path: { type: string, description: JSON path in camelCase }
        code: { type: string }
        messageKey: { type: string }
        message: { type: string }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, messageKey, message, requestId]
          properties:
            code: { type: string, description: Code from API_STANDARDS section 8 }
            messageKey: { type: string }
            message: { type: string }
            params:
              type: object
              additionalProperties: { type: string }
              description: Only for codes that document them in API_STANDARDS section 8, e.g. permission.grant_refused (rule)
            details:
              type: array
              items: { $ref: '#/components/schemas/ErrorDetail' }
            requestId: { type: string }
    ActionResult:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            status: { type: string }
            stage: { type: [string, 'null'] }
        meta: { $ref: '#/components/schemas/Meta' }
    StaffDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      description: A role on approval (any official role but the Department Head's), a reason on rejection (R9 of the T1.9 plan)
      properties:
        decision: { type: string, enum: [approve, reject] }
        reason: { type: string, minLength: 3, maxLength: 1000 }
        roleKey: { type: string, maxLength: 64 }
    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 1000 }
    RegistrationStartRequest:
      type: object
      additionalProperties: false
      description: A draft starts with its kind only; each contact comes with its own code (D-090)
      properties:
        kind: { type: string, enum: [volunteer, staff], default: volunteer }
    RegistrationStart:
      type: object
      required: [registrationId]
      properties:
        registrationId: { $ref: '#/components/schemas/Uuid' }
    RegistrationStartResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/RegistrationStart' }
        meta: { $ref: '#/components/schemas/Meta' }
    OtpSendRequest:
      description: The contact of one channel; a changed address clears that channel's verification (D-090)
      oneOf:
        - type: object
          additionalProperties: false
          required: [address, channel, registrationId]
          properties:
            registrationId: { $ref: '#/components/schemas/Uuid' }
            channel: { type: string, const: sms }
            address: { type: string, pattern: '^01[3-9][0-9]{8}$' }
        - type: object
          additionalProperties: false
          required: [address, channel, registrationId]
          properties:
            registrationId: { $ref: '#/components/schemas/Uuid' }
            channel: { type: string, const: email }
            address: { type: string, format: email, maxLength: 254 }
    OtpVerifyRequest:
      type: object
      additionalProperties: false
      required: [channel, code, registrationId]
      properties:
        registrationId: { $ref: '#/components/schemas/Uuid' }
        channel: { type: string, enum: [sms, email] }
        code: { type: string, pattern: '^[0-9]{6}$' }
    RegistrationVerified:
      type: object
      required: [verified]
      description: The channels verified so far; the token, its expiry and the kind come once both are verified (D-090)
      properties:
        verified: { type: array, items: { type: string, enum: [sms, email] } }
        registrationToken: { type: string, description: Shown once; sent back in X-Registration-Token (D-082) }
        expiresAt: { type: string, format: date-time }
        kind: { type: string, enum: [volunteer, staff] }
    RegistrationVerifiedResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/RegistrationVerified' }
        meta: { $ref: '#/components/schemas/Meta' }
    UploadedPhotoResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [fileId]
          properties:
            fileId: { $ref: '#/components/schemas/Uuid' }
        meta: { $ref: '#/components/schemas/Meta' }
    BankDetails:
      type: object
      additionalProperties: false
      properties:
        bankName: { type: string, maxLength: 200 }
        accountName: { type: string, maxLength: 200 }
        accountNumber: { type: string, maxLength: 40 }
        branchName: { type: string, maxLength: 100 }
        routingNumber: { type: string, maxLength: 20 }
    VolunteerRegistrationSubmit:
      type: object
      additionalProperties: false
      required: [kind, registrationId, password, name, fatherName, motherName, nid, divisionId, districtId, upazilaId, unionId, profession]
      properties:
        kind: { type: string, const: volunteer }
        registrationId: { $ref: '#/components/schemas/Uuid' }
        password: { type: string, minLength: 8, maxLength: 128, description: 'At least one upper-case letter and one digit (O-64)' }
        name: { type: string, minLength: 1, maxLength: 200 }
        fatherName: { type: string, minLength: 1, maxLength: 200 }
        motherName: { type: string, minLength: 1, maxLength: 200 }
        nid: { type: string, pattern: '^([0-9]{10}|[0-9]{13}|[0-9]{17})$' }
        whatsapp: { type: string, pattern: '^01[3-9][0-9]{8}$' }
        divisionId: { $ref: '#/components/schemas/Uuid' }
        districtId: { $ref: '#/components/schemas/Uuid' }
        upazilaId: { $ref: '#/components/schemas/Uuid' }
        unionId: { $ref: '#/components/schemas/Uuid' }
        addressLine: { type: string, maxLength: 500 }
        education: { type: string, maxLength: 500 }
        previousProjects: { type: string, maxLength: 2000 }
        facebookId: { type: string, maxLength: 200 }
        dateOfBirth: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$', description: 'A real date in the past, not before 1900 (O-65)' }
        bloodGroup: { type: string, enum: [A+, A-, B+, B-, O+, O-, AB+, AB-] }
        tshirtSize: { type: string, enum: [S, M, L, XL, XXL] }
        volunteeringArea: { type: string, enum: [own_union, own_upazila, own_district, anywhere] }
        profession: { type: string, enum: [student, teacher, imam, businessman, job_seeker, service_holder], description: The one mandatory new field (O-65) }
        professionDetails: { $ref: '#/components/schemas/ProfessionDetails' }
        interestAreas: { type: array, maxItems: 5, description: Each area at most once, items: { type: string, enum: [field_relief, survey, data_entry, media, first_aid] } }
        vehicle: { type: string, enum: [bicycle, motorcycle, none] }
        canSwim: { type: boolean }
        availability: { type: string, enum: [holidays, anytime, on_call] }
        emergencyContact: { $ref: '#/components/schemas/EmergencyContact' }
    ProfessionDetails:
      type: object
      description: The own fields of the chosen profession only, all optional; a field of another profession is refused (422). student educationMedium (general, aliya, qawmi, technical), institutionName, currentClass, subject, institutionLocation; teacher institutionType (school, college, university, madrasa), institutionNameAddress, designation, teachingSubject; imam role (khatib, imam, muazzin), mosqueName, mosqueType (jame, panjegana), mosqueAddress; businessman businessName, businessType (retail, wholesale, service, agriculture, it_online, other), businessAddress; job_seeker highestQualification, skills, fullTimeAvailable (boolean); service_holder sector, organization, designation, workplaceLocation
      propertyNames: { type: string }
      additionalProperties: {}
    EmergencyContact:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 200 }
        mobile: { type: string, pattern: '^01[3-9][0-9]{8}$' }
    VolunteerProfileDetails:
      type: object
      description: The personal, profession and skills data of a volunteer (O-65, D-092; BR-246)
      required: [professionDetails, interestAreas, emergencyContact]
      properties:
        bloodGroup: { type: [string, 'null'], enum: [A+, A-, B+, B-, O+, O-, AB+, AB-, null] }
        dateOfBirth: { type: [string, 'null'], format: date }
        tshirtSize: { type: [string, 'null'], enum: [S, M, L, XL, XXL, null] }
        volunteeringArea: { type: [string, 'null'], enum: [own_union, own_upazila, own_district, anywhere, null] }
        profession: { type: [string, 'null'], enum: [student, teacher, imam, businessman, job_seeker, service_holder, null] }
        professionDetails: { $ref: '#/components/schemas/ProfessionDetails' }
        interestAreas: { type: array, items: { type: string, enum: [field_relief, survey, data_entry, media, first_aid] } }
        vehicle: { type: [string, 'null'], enum: [bicycle, motorcycle, none, null] }
        canSwim: { type: [boolean, 'null'] }
        availability: { type: [string, 'null'], enum: [holidays, anytime, on_call, null] }
        emergencyContact:
          type: object
          properties:
            name: { type: [string, 'null'] }
            mobile: { type: [string, 'null'] }
    StaffRegistrationSubmit:
      type: object
      additionalProperties: false
      required: [kind, registrationId, password, name, designation]
      properties:
        kind: { type: string, const: staff }
        registrationId: { $ref: '#/components/schemas/Uuid' }
        password: { type: string, minLength: 8, maxLength: 128 }
        name: { type: string, minLength: 1, maxLength: 200 }
        designation: { type: string, minLength: 1, maxLength: 200 }
    RegistrationSubmitRequest:
      description: The form of the draft's kind (MASTER_SPEC A5, D-088); the photos are linked through the draft
      oneOf:
        - $ref: '#/components/schemas/VolunteerRegistrationSubmit'
        - $ref: '#/components/schemas/StaffRegistrationSubmit'
    LoginRequest:
      type: object
      additionalProperties: false
      required: [loginId, password]
      properties:
        loginId: { type: string, minLength: 1, maxLength: 254, description: Mobile number or email (email for staff only) }
        password: { type: string, minLength: 1, maxLength: 128 }
        device:
          type: object
          additionalProperties: false
          properties:
            name: { type: string, maxLength: 100 }
            platform:
              type: string
              enum: [android, ios, desktop, other]
              description: Staff sessions on desktop get the 12-hour idle timeout (O-25, D-070)
            appVersion: { type: string, maxLength: 32 }
    Me:
      type: object
      required: [id, displayName, kind, state, roles, language, permissionVersion]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string }
        kind: { type: string, enum: [staff, volunteer] }
        state: { type: string, enum: [pending, active, blocked, deactivated] }
        roles: { type: array, items: { type: string } }
        language: { type: string, enum: [bn, en] }
        permissionVersion: { type: integer }
        blockMessage: { type: [string, 'null'] }
        volunteerId: { type: [string, 'null'], format: uuid }
    TokenPair:
      type: object
      required: [accessToken, expiresAt, me]
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
        me: { $ref: '#/components/schemas/Me' }
    TokenResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/TokenPair' }
        meta: { $ref: '#/components/schemas/Meta' }
    MeResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Me' }
        meta: { $ref: '#/components/schemas/Meta' }
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { type: string, minLength: 8, maxLength: 128 }
    PasswordResetStartRequest:
      type: object
      additionalProperties: false
      required: [loginId]
      properties:
        loginId: { type: string, minLength: 1, maxLength: 254 }
    PasswordResetCompleteRequest:
      type: object
      additionalProperties: false
      required: [loginId, code, newPassword]
      properties:
        loginId: { type: string, minLength: 1, maxLength: 254 }
        code: { type: string, pattern: '^[0-9]{6}$' }
        newPassword: { type: string, minLength: 8, maxLength: 128 }
    DeviceSession:
      type: object
      required: [id, createdAt, lastSeenAt, current]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        deviceName: { type: [string, 'null'] }
        platform: { type: [string, 'null'] }
        appVersion: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        current: { type: boolean }
        revokedAt: { type: [string, 'null'], format: date-time }
    DeviceSessionList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/DeviceSession' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    UserSummary:
      type: object
      required: [id, displayName, kind, state]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string }
        kind: { type: string, enum: [staff, volunteer] }
        state: { type: string, enum: [pending, active, blocked, deactivated] }
        designation: { type: [string, 'null'] }
        roles: { type: array, items: { type: string } }
    User:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          properties:
            mobile: { type: [string, 'null'] }
            email: { type: [string, 'null'] }
            homeProgramId: { type: [string, 'null'], format: uuid }
            homeDivisionId: { type: [string, 'null'], format: uuid }
            isSystemOwner: { type: boolean }
            lastLoginAt: { type: [string, 'null'], format: date-time }
    UserResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/User' }
        meta: { $ref: '#/components/schemas/Meta' }
    UserList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/UserSummary' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    UserStateRequest:
      type: object
      additionalProperties: false
      required: [state, reason]
      properties:
        state: { type: string, enum: [active, blocked, deactivated] }
        reason: { type: string, minLength: 3, maxLength: 1000 }
    HandoverRequest:
      type: object
      additionalProperties: false
      required: [toUserId]
      properties:
        toUserId: { $ref: '#/components/schemas/Uuid' }
        items:
          type: array
          minItems: 1
          maxItems: 500
          description: Items to reassign; omitted means every listed item (reassign all)
          items:
            type: object
            additionalProperties: false
            required: [itemType, itemId]
            properties:
              itemType: { type: string, enum: [program, project_area, project_staff, pending_review, document, issue, followup] }
              itemId: { $ref: '#/components/schemas/Uuid' }
    HandoverItem:
      type: object
      required: [category, itemType, itemId, label]
      properties:
        category: { type: string, enum: [reviews_approvals, projects, documents, issues, followups] }
        itemType: { type: string }
        itemId: { $ref: '#/components/schemas/Uuid' }
        projectId: { type: [string, 'null'], format: uuid }
        label: { type: string }
    Handover:
      type: object
      required: [fromUserId, pending, outstandingCount]
      properties:
        id: { type: [string, 'null'], format: uuid, description: Null until the first reassignment starts the handover }
        fromUserId: { $ref: '#/components/schemas/Uuid' }
        pending: { type: array, items: { $ref: '#/components/schemas/HandoverItem' } }
        scope: { $ref: '../database/json-schemas/handover-scope.schema.json' }
        outstandingCount: { type: integer, description: Items still without a new owner }
        completedAt: { type: [string, 'null'], format: date-time }
    HandoverResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Handover' }
        meta: { $ref: '#/components/schemas/Meta' }
    OwnerTransferRequest:
      type: object
      required: [toUserId, password]
      properties:
        toUserId: { $ref: '#/components/schemas/Uuid' }
        password: { type: string, description: Current system owner's password }

    # ---------------- access ----------------
    Role:
      type: object
      required: [key, name, kind, globalScope]
      properties:
        key: { type: string }
        name: { $ref: '#/components/schemas/Bilingual' }
        kind: { type: string, enum: [official, volunteer] }
        globalScope: { type: boolean }
    RoleList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Role' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    Permission:
      type: object
      required: [name, module, sensitive, description]
      properties:
        name: { type: string }
        module: { type: string }
        sensitive: { type: boolean }
        description: { type: string }
    PermissionList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Permission' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    EffectivePermission:
      type: object
      required: [permission, scopeType, source]
      properties:
        permission: { type: string }
        scopeType: { type: string, enum: [GLOBAL, PROGRAM, PROJECT, REGION, DISTRICT, UPAZILA, UNION, ASSIGNED, SELF] }
        scopeRef: { type: [string, 'null'], format: uuid }
        condition: { type: [string, 'null'] }
        source: { type: string, enum: [global_role, role_default, permission_set, project_grant, panel_grant] }
        grantId: { $ref: '#/components/schemas/Uuid', description: 'The panel override behind a panel_grant row (D-079)' }
    EffectivePermissionList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/EffectivePermission' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    PermissionGrantRequest:
      type: object
      required: [userId, permission, effect, scopeType, reason]
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }
        permission: { type: string }
        effect: { type: string, enum: [grant, revoke] }
        scopeType: { type: string, enum: [GLOBAL, PROGRAM, PROJECT, REGION, DISTRICT, UPAZILA, UNION, ASSIGNED, SELF] }
        scopeRef: { $ref: '#/components/schemas/Uuid' }
        condition: { type: string }
        reason: { type: string, minLength: 3, maxLength: 1000 }
        expiresAt: { type: string, format: date-time }
    PermissionGrant:
      allOf:
        - $ref: '#/components/schemas/PermissionGrantRequest'
        - type: object
          required: [id, grantedBy, createdAt]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            grantedBy: { $ref: '#/components/schemas/Uuid' }
            createdAt: { type: string, format: date-time }
            revokedAt: { type: [string, 'null'], format: date-time }
    PermissionGrantResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/PermissionGrant' }
        meta: { $ref: '#/components/schemas/Meta' }
    ProjectGrantRequest:
      type: object
      required: [userId, permissions, reason]
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }
        permissions:
          type: array
          maxItems: 50
          items: { type: string }
          description: Only permissions marked if_rpm_grants in permissions.yaml that the RPM holds
        reason: { type: string, minLength: 3, maxLength: 1000 }

    # ---------------- volunteers and registration ----------------
    VolunteerSummary:
      type: object
      required: [id, userId, displayName, type, state]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        userId: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string }
        type: { type: string, enum: [general, local_daee, both, team_member, paid] }
        state: { type: string, enum: [pending, active, blocked, deactivated] }
        districtId: { $ref: '#/components/schemas/Uuid' }
        upazilaId: { $ref: '#/components/schemas/Uuid' }
        category: { type: [string, 'null'], enum: [A, B, C, D, null], x-sensitive-class: volunteer.rating }
        inactiveFlag: { type: boolean, x-sensitive-class: volunteer.rating }
        averageRatings:
          type: object
          x-sensitive-class: volunteer.rating
          description: Average per kind of work, never across kinds (O-10)
          properties:
            applicationDistribution: { type: [number, 'null'] }
            dawah: { type: [number, 'null'] }
    Volunteer:
      allOf:
        - $ref: '#/components/schemas/VolunteerSummary'
        - $ref: '#/components/schemas/VolunteerProfileDetails'
        - type: object
          properties:
            bloodGroup: { x-sensitive-class: volunteer.identity }
            dateOfBirth: { x-sensitive-class: volunteer.identity }
            emergencyContact: { x-sensitive-class: volunteer.identity }
            fatherName: { type: string }
            motherName: { type: string }
            mobile: { type: string }
            whatsapp: { type: [string, 'null'] }
            divisionId: { $ref: '#/components/schemas/Uuid' }
            unionId: { $ref: '#/components/schemas/Uuid' }
            addressLine: { type: [string, 'null'] }
            education: { type: [string, 'null'] }
            experience: { type: [string, 'null'] }
            workDescription: { type: [string, 'null'] }
            previousProjects: { type: [string, 'null'] }
            facebookId: { type: [string, 'null'] }
            nid: { type: string, x-sensitive-class: volunteer.identity }
            nidPhotoFileId: { type: [string, 'null'], format: uuid, x-sensitive-class: volunteer.identity }
            nidPhotoBackFileId: { type: [string, 'null'], format: uuid, x-sensitive-class: volunteer.identity, description: The second page of the NID card (UX-18) }
            bank:
              type: object
              x-sensitive-class: volunteer.bank
              properties:
                bankName: { type: [string, 'null'] }
                accountName: { type: [string, 'null'] }
                accountNumber: { type: [string, 'null'] }
                branchName: { type: [string, 'null'] }
                routingNumber: { type: [string, 'null'] }
            photoFileId: { type: [string, 'null'], format: uuid }
            referenceVolunteerId: { type: [string, 'null'], format: uuid }
            approvedAt: { type: [string, 'null'], format: date-time }
            projects: { type: array, items: { $ref: '#/components/schemas/ProjectVolunteer' } }
    VolunteerResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Volunteer' }
        meta: { $ref: '#/components/schemas/Meta' }
    VolunteerList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/VolunteerSummary' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    ChangeValue:
      description: Text for a text field; an object for the address, the bank details, the profession ({ profession, details }), the skills and the emergency contact (O-65); a file id from the photo upload for a photo field (D-085)
      anyOf:
        - { type: string, maxLength: 2000 }
        - { type: object, propertyNames: { type: string }, additionalProperties: {} }
    RegistrationCorrectionCreate:
      type: object
      additionalProperties: false
      required: [fields, note]
      properties:
        fields:
          type: array
          minItems: 1
          maxItems: 40
          items: { type: string, enum: [name, fatherName, motherName, nid, whatsapp, address, addressLine, education, experience, workDescription, previousProjects, facebookId, bloodGroup, dateOfBirth, tshirtSize, volunteeringArea, profession, skills, emergencyContact, bank, photo, nid_photo, nid_photo_back] }
        note: { type: string, minLength: 3, maxLength: 1000 }
    EditRequestCreate:
      type: object
      additionalProperties: false
      required: [field]
      description: The new value is required except for a photo, which the own photo upload fills (D-085)
      properties:
        field: { type: string, enum: [name, fatherName, motherName, nid, whatsapp, address, addressLine, education, experience, workDescription, previousProjects, facebookId, bloodGroup, dateOfBirth, tshirtSize, volunteeringArea, profession, skills, emergencyContact, bank, photo, nid_photo, nid_photo_back, mobile, email] }
        newValue: { $ref: '#/components/schemas/ChangeValue' }
        note: { type: string, maxLength: 1000 }
    ChangeRequestAnswer:
      type: object
      additionalProperties: false
      required: [newValue]
      properties:
        newValue: { $ref: '#/components/schemas/ChangeValue' }
    OtpCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
    ChangeRequest:
      type: object
      required: [id, volunteerId, kind, field, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        volunteerId: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [registration_correction, profile_edit] }
        field: { type: string }
        newValue: { description: 'Absent for NID, bank, mobile and email values towards anyone but the owner and allowed officials' }
        note: { type: [string, 'null'] }
        status: { type: string, enum: [open, submitted, approved, rejected, closed] }
        contactVerified: { type: boolean, description: 'For a mobile or email change: the code to the new value was verified' }
        decidedAt: { type: [string, 'null'], format: date-time }
        volunteerName: { type: string, description: 'Display name of the volunteer; only in the approvers'' list (GET /edit-requests)' }
    ChangeRequestResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/ChangeRequest' }
        meta: { $ref: '#/components/schemas/Meta' }
    ChangeRequestList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ChangeRequest' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    PendingRegistration:
      type: object
      required: [userId, kind, displayName, status, submittedAt]
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [volunteer, staff] }
        displayName: { type: string }
        status: { type: string, enum: [awaiting_review, in_correction] }
        submittedAt: { type: string, format: date-time }
        volunteerType: { type: [string, 'null'], enum: [general, local_daee, both, team_member, paid, null] }
        divisionId: { type: [string, 'null'], format: uuid }
        districtId: { type: [string, 'null'], format: uuid }
        designation: { type: [string, 'null'] }
    PendingRegistrationList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/PendingRegistration' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    RegistrationDetail:
      allOf:
        - $ref: '#/components/schemas/PendingRegistration'
        - type: object
          properties:
            mobile: { type: [string, 'null'] }
            email: { type: [string, 'null'] }
            photoFileId: { type: [string, 'null'], format: uuid }
            homeProgramId: { type: [string, 'null'], format: uuid }
            homeDivisionId: { type: [string, 'null'], format: uuid }
            volunteer: { oneOf: [{ $ref: '#/components/schemas/Volunteer' }, { type: 'null' }] }
            blocklisted: { type: boolean }
            corrections: { type: array, items: { $ref: '#/components/schemas/ChangeRequest' } }
    RegistrationDetailResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/RegistrationDetail' }
        meta: { $ref: '#/components/schemas/Meta' }
    OwnVolunteerProfile:
      type: object
      description: The volunteer's own profile; includes the own NID, bank details and personal data in full (D-081, O-65) and never the own rating or category
      allOf:
        - $ref: '#/components/schemas/VolunteerProfileDetails'
      required: [userId, state, displayName, inAnyProject]
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }
        volunteerId: { type: [string, 'null'], format: uuid }
        state: { type: string, enum: [pending, active, blocked, deactivated] }
        displayName: { type: string }
        mobile: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        inAnyProject: { type: boolean, description: False shows the "not yet in any project" message (BR-031) }
        fatherName: { type: string }
        motherName: { type: string }
        nid: { type: string }
        type: { type: string, enum: [general, local_daee, both, team_member, paid] }
        whatsapp: { type: [string, 'null'] }
        divisionId: { $ref: '#/components/schemas/Uuid' }
        districtId: { $ref: '#/components/schemas/Uuid' }
        upazilaId: { $ref: '#/components/schemas/Uuid' }
        unionId: { $ref: '#/components/schemas/Uuid' }
        addressLine: { type: [string, 'null'] }
        education: { type: [string, 'null'] }
        experience: { type: [string, 'null'] }
        workDescription: { type: [string, 'null'] }
        previousProjects: { type: [string, 'null'] }
        facebookId: { type: [string, 'null'] }
        bank: { $ref: '#/components/schemas/BankDetails' }
        referenceNid: { type: [string, 'null'] }
        photoFileId: { type: [string, 'null'], format: uuid }
        nidPhotoFileId: { type: [string, 'null'], format: uuid }
        nidPhotoBackFileId: { type: [string, 'null'], format: uuid }
    OwnVolunteerProfileResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/OwnVolunteerProfile' }
        meta: { $ref: '#/components/schemas/Meta' }
    DecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      description: A refusal needs a reason
      properties:
        decision: { type: string, enum: [approve, reject] }
        reason: { type: string, minLength: 3, maxLength: 1000 }
    ProjectVolunteerCreate:
      type: object
      required: [volunteerIds, regionLocationId, permissionSet]
      properties:
        volunteerIds: { type: array, minItems: 1, maxItems: 200, items: { $ref: '#/components/schemas/Uuid' } }
        regionLocationId: { $ref: '#/components/schemas/Uuid' }
        permissionSet: { type: string, enum: [application_distribution, application_distribution_dawah, work_progress] }
        isPaid: { type: boolean, default: false }
    ProjectVolunteer:
      type: object
      required: [id, projectId, volunteerId, permissionSet, consentStatus]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        projectId: { $ref: '#/components/schemas/Uuid' }
        volunteerId: { $ref: '#/components/schemas/Uuid' }
        regionLocationId: { $ref: '#/components/schemas/Uuid' }
        permissionSet: { type: string, enum: [application_distribution, application_distribution_dawah, work_progress] }
        extraPermissions: { type: array, items: { type: string } }
        isPaid: { type: boolean }
        consentStatus: { type: string, enum: [pending, accepted, rejected] }
        consentAt: { type: [string, 'null'], format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
    ProjectVolunteerList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ProjectVolunteer' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    ConsentRequest:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }
        acceptedSections: { type: array, items: { type: string, enum: [volunteer_duties, implementation, daee_duties, measures] } }
    TeamMember:
      type: object
      required: [id, projectId, leadVolunteerId, memberVolunteerId]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        projectId: { $ref: '#/components/schemas/Uuid' }
        leadVolunteerId: { $ref: '#/components/schemas/Uuid' }
        memberVolunteerId: { $ref: '#/components/schemas/Uuid' }
        memberName: { type: string }
        addedAt: { type: string, format: date-time }
    TeamMemberList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/TeamMember' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    CategoryRequest:
      type: object
      required: [comment]
      properties:
        category: { type: [string, 'null'], enum: [A, B, C, D, null] }
        inactiveFlag: { type: boolean }
        comment: { type: string, minLength: 3, description: Mandatory (BR-045) }
    BlocklistRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 1000 }
    BlocklistEntry:
      type: object
      required: [id, subjectType, subjectId, active, blockedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        subjectType: { type: string, enum: [volunteer, beneficiary] }
        subjectId: { $ref: '#/components/schemas/Uuid' }
        reason: { type: string, x-sensitive-class: blocklist.reason }
        active: { type: boolean }
        blockedAt: { type: string, format: date-time }
        releasedAt: { type: [string, 'null'], format: date-time }
    BlocklistResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/BlocklistEntry' }
        meta: { $ref: '#/components/schemas/Meta' }
    TransferRequest:
      type: object
      required: [fromVolunteerId, toVolunteerId, reason]
      properties:
        fromVolunteerId: { $ref: '#/components/schemas/Uuid' }
        toVolunteerId: { $ref: '#/components/schemas/Uuid' }
        applicationIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
          description: Omit to transfer all of the volunteer's applications in the project
        moveTeam: { type: boolean, default: false, description: RPM decides whether the team moves (BR-050) }
        reason: { type: string, minLength: 3 }
    TransferResult:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [transferBatch, transferredCount]
          properties:
            transferBatch: { $ref: '#/components/schemas/Uuid' }
            transferredCount: { type: integer }
        meta: { $ref: '#/components/schemas/Meta' }

    # ---------------- beneficiaries ----------------
    BeneficiarySummary:
      type: object
      required: [id, name, fatherOrHusbandName, districtId, unionId, village, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        fatherOrHusbandName: { type: string }
        mobile: { type: string }
        districtId: { $ref: '#/components/schemas/Uuid' }
        upazilaId: { $ref: '#/components/schemas/Uuid' }
        unionId: { $ref: '#/components/schemas/Uuid' }
        village: { type: string }
        status: { type: string, enum: [active, deceased, relocated] }
        isBlocked: { type: boolean }
        mergedIntoId: { type: [string, 'null'], format: uuid }
    Beneficiary:
      allOf:
        - $ref: '#/components/schemas/BeneficiarySummary'
        - type: object
          properties:
            nid: { type: [string, 'null'], x-sensitive-class: beneficiary.nid }
            birthReg: { type: [string, 'null'], x-sensitive-class: beneficiary.nid }
            motherName: { type: [string, 'null'] }
            genderCode: { type: string }
            dob: { type: [string, 'null'], format: date }
            ageYears: { type: [integer, 'null'] }
            maritalStatusCode: { type: [string, 'null'] }
            educationCode: { type: [string, 'null'] }
            classCode: { type: [string, 'null'] }
            classOtherText: { type: [string, 'null'] }
            occupationCode: { type: [string, 'null'] }
            occupationOtherText: { type: [string, 'null'] }
