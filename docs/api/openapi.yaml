            application/json:
              schema: { $ref: '#/components/schemas/ApplicationResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [applications]
      operationId: applications.application.update
      summary: >-
        Edit answers; the permission depends on the state (draft - application.edit_draft, submitted -
        application.edit_pending, under_review - application.review), per WORKFLOW_ENGINE section 3
      x-permission: workflow
      x-scope: application
      x-audit: application.update
      x-idempotency: none
      x-rate-limit: default
      x-sensitive-fields: [application.official_section, beneficiary.nid, beneficiary.contact, beneficiary.profile_detail]
      x-workflow: { scope: application, action: edit }
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /applications/{applicationId}/actions/{action}:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
      - $ref: '#/components/parameters/ApplicationAction'
    post:
      tags: [applications]
      operationId: applications.application.act
      summary: >-
        Perform a workflow action; the engine checks the transition's permission, guards and effects
        (submit, review, send_for_approval, approve, reject, waitlist, pull_from_waitlist, delete, verify_link,
        reject_unverified)
      x-permission: workflow
      x-scope: application
      x-audit: application.<action>
      x-idempotency: none
      x-rate-limit: default
      x-sensitive-fields: [application.official_section, beneficiary.nid, beneficiary.contact, beneficiary.profile_detail]
      x-workflow: { scope: application, action: path }
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationActionRequest' }
      responses:
        '200':
          description: New state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
