    PermissionGrant:
      type: object
      description: A panel override as stored; the parts the request left out are null
      required: [id, userId, permission, effect, scopeType, reason, grantedBy, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        userId: { $ref: '#/components/schemas/Uuid' }
        permission: { type: string }
        effect: { type: string, enum: [grant, revoke] }
        scopeType: { type: string, enum: [GLOBAL, PROGRAM, PROJECT, REGION, DISTRICT, UPAZILA, UNION, ASSIGNED, SELF] }
        scopeRef: { type: [string, 'null'], format: uuid }
        condition: { type: [string, 'null'] }
        reason: { type: string }
        expiresAt: { type: [string, 'null'], format: date-time }
        grantedBy: { $ref: '#/components/schemas/Uuid' }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
    PermissionGrantResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/PermissionGrant' }
        meta: { $ref: '#/components/schemas/Meta' }
    ProjectGrantRequest:
      type: object
      required: [userId, permissions, reason]
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }
        permissions:
          type: array
          maxItems: 50
          items: { type: string }
          description: Only permissions marked if_rpm_grants in permissions.yaml that the RPM holds
        reason: { type: string, minLength: 3, maxLength: 1000 }

    # ---------------- volunteers and registration ----------------
    VolunteerSummary:
      type: object
      description: One row of the volunteer tab (O-67)
      required: [id, userId, displayName, type, state, divisionId, districtId, upazilaId, photoFileId, blocked, projects]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        userId: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string }
        type: { type: string, enum: [general, local_daee, both, team_member, paid] }
        state: { type: string, enum: [pending, active, blocked, deactivated] }
        divisionId: { $ref: '#/components/schemas/Uuid' }
        districtId: { $ref: '#/components/schemas/Uuid' }
        upazilaId: { $ref: '#/components/schemas/Uuid' }
        photoFileId: { type: [string, 'null'], format: uuid }
        blocked: { type: boolean, description: On the blocklist now }
        projects:
          type: array
          description: The active project assignments
          items:
            type: object
            required: [id, code, nameBn, nameEn]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              code: { type: string }
              nameBn: { type: string }
              nameEn: { type: string }
        category: { type: [string, 'null'], enum: [A, B, C, D, null], x-sensitive-class: volunteer.rating }
        inactiveFlag: { type: boolean, x-sensitive-class: volunteer.rating }
    VolunteerStatistics:
      type: object
      required: [volunteers, applications]
      properties:
        volunteers:
          type: object
          required: [total, active, pending, blocked, deactivated]
          properties:
            total: { type: integer, minimum: 0 }
            active: { type: integer, minimum: 0 }
            pending: { type: integer, minimum: 0 }
            blocked: { type: integer, minimum: 0 }
            deactivated: { type: integer, minimum: 0 }
            inactive: { type: integer, minimum: 0, x-sensitive-class: volunteer.rating, description: The BD-40 inactive flag }
        applications:
          type: object
          required: [total, approved, underReview]
          properties:
            total: { type: integer, minimum: 0 }
            approved: { type: integer, minimum: 0 }
            underReview: { type: integer, minimum: 0 }
    VolunteerStatisticsResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/VolunteerStatistics' }
        meta: { $ref: '#/components/schemas/Meta' }
    Volunteer:
      type: object
      description: The official view of one volunteer (SCR-043, O-67, D-094)
      required: [id, userId, displayName, type, state, fatherName, motherName, divisionId, districtId, upazilaId, unionId, photoFileId, registeredAt, approvedAt, projects, team, blocklist, actions]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        userId: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string }
        type: { type: string, enum: [general, local_daee, both, team_member, paid] }
        state: { type: string, enum: [pending, active, blocked, deactivated] }
        mobile: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        whatsapp: { type: [string, 'null'] }
        fatherName: { type: string }
        motherName: { type: string }
        divisionId: { $ref: '#/components/schemas/Uuid' }
        districtId: { $ref: '#/components/schemas/Uuid' }
        upazilaId: { $ref: '#/components/schemas/Uuid' }
        unionId: { $ref: '#/components/schemas/Uuid' }
        addressLine: { type: [string, 'null'] }
        facebookId: { type: [string, 'null'] }
        education: { type: [string, 'null'] }
        experience: { type: [string, 'null'] }
        workDescription: { type: [string, 'null'] }
        previousProjects: { type: [string, 'null'] }
        tshirtSize: { type: [string, 'null'] }
        volunteeringArea: { type: [string, 'null'] }
        profession: { type: [string, 'null'] }
        professionDetails: { type: object }
        interestAreas: { type: array, items: { type: string } }
        vehicle: { type: [string, 'null'] }
        canSwim: { type: [boolean, 'null'] }
        availability: { type: [string, 'null'] }
        emergencyFullTime: { type: [boolean, 'null'] }
        educationDetails: { $ref: '#/components/schemas/EducationDetails' }
        permanentAddress: { oneOf: [{ $ref: '#/components/schemas/PermanentAddress' }, { type: 'null' }] }
        bloodGroup: { type: [string, 'null'], x-sensitive-class: volunteer.identity, description: Only inside the volunteer.view_sensitive scope }
        dateOfBirth: { type: [string, 'null'], format: date, x-sensitive-class: volunteer.identity, description: Only inside the volunteer.view_sensitive scope }
        nid: { type: string, x-sensitive-class: volunteer.identity, description: Only inside the volunteer.view_sensitive scope }
        nidPhotoFileId: { type: [string, 'null'], format: uuid, x-sensitive-class: volunteer.identity }
        nidPhotoBackFileId: { type: [string, 'null'], format: uuid, x-sensitive-class: volunteer.identity }
        bank:
          type: object
          x-sensitive-class: volunteer.bank
          description: Only inside the volunteer.view_sensitive scope
          properties:
            bankName: { type: string }
            accountName: { type: string }
            accountNumber: { type: string }
            branchName: { type: string }
            routingNumber: { type: string }
        photoFileId: { type: [string, 'null'], format: uuid }
        registeredAt: { type: string, format: date-time }
        approvedAt: { type: [string, 'null'], format: date-time }
        projects:
          type: array
          description: Active project assignments (read only here; assignment in T1.12)
          items:
            type: object
            required: [id, code, nameBn, nameEn, year, permissionSet, isPaid, regionLocationId, assignedAt]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              code: { type: string }
              nameBn: { type: string }
              nameEn: { type: string }
              year: { type: integer }
              permissionSet: { type: string }
              isPaid: { type: boolean }
              regionLocationId: { $ref: '#/components/schemas/Uuid' }
              assignedAt: { type: string, format: date-time }
        team:
          type: array
          description: The members who registered with this volunteer as their reference (name, type and state only)
          items:
            type: object
            required: [id, displayName, type, state]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              displayName: { type: string }
              type: { type: string, enum: [general, local_daee, both, team_member, paid] }
              state: { type: string, enum: [pending, active, blocked, deactivated] }
        category: { type: [string, 'null'], enum: [A, B, C, D, null], x-sensitive-class: volunteer.rating }
        inactiveFlag: { type: boolean, x-sensitive-class: volunteer.rating }
        ratings:
          type: array
          x-sensitive-class: volunteer.rating
          description: Finalized ratings per project and kind of work, never averaged (Phase 5)
          items:
            type: object
            required: [projectId, workKind, finalScores, finalizedAt]
            properties:
              projectId: { $ref: '#/components/schemas/Uuid' }
              workKind: { type: string }
              finalScores: {}
              finalizedAt: { type: string, format: date-time }
        blocklist:
          type: object
          required: [blocked]
          properties:
            blocked: { type: boolean }
            blockedAt: { type: string, format: date-time }
            reason: { type: string, x-sensitive-class: blocklist.reason }
        actions:
          type: object
          description: What the caller may do to this volunteer, decided like the action routes
          required: [review, approve, requestCorrection, block, unblock, viewSessions, revokeSessions]
          properties:
            review:
              type: boolean
              description: >-
                The caller may decide on this pending registration (approve, ask for a correction,
                reject), even while a correction holds it; approve and requestCorrection say
                whether that action is possible now
            approve: { type: boolean }
            requestCorrection: { type: boolean }
            block: { type: boolean }
            unblock: { type: boolean }
            viewSessions: { type: boolean }
            revokeSessions: { type: boolean }
    VolunteerResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Volunteer' }
        meta: { $ref: '#/components/schemas/Meta' }
