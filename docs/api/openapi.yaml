    ProjectVolunteerResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ProjectVolunteer' }
    VolunteerCandidate:
      type: object
      required: [volunteerId, displayName, type, divisionId, districtId, upazilaId, unionId, defaultPermissionSet]
      properties:
        volunteerId: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string }
        type: { type: string }
        divisionId: { $ref: '#/components/schemas/Uuid' }
        districtId: { $ref: '#/components/schemas/Uuid' }
        upazilaId: { $ref: '#/components/schemas/Uuid' }
        unionId: { $ref: '#/components/schemas/Uuid' }
        defaultPermissionSet: { type: [string, 'null'] }
    VolunteerCandidateList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/VolunteerCandidate' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    RulesPart:
      type: string
      enum: [volunteer_duties, implementation_process, daee_duties, misconduct]
    RuleText:
      type: object
      additionalProperties: false
      required: [bn, en]
      properties:
        bn: { type: string, maxLength: 10000 }
        en: { type: string, maxLength: 10000 }
    ProjectRules:
      type: object
      additionalProperties: false
      description: The four rules texts; any part may be absent while a draft is set up (BR-039).
      properties:
        volunteer_duties: { $ref: '#/components/schemas/RuleText' }
        implementation_process: { $ref: '#/components/schemas/RuleText' }
        daee_duties: { $ref: '#/components/schemas/RuleText' }
        misconduct: { $ref: '#/components/schemas/RuleText' }
    ProjectRulesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [version, rules]
          properties:
            version: { type: integer, minimum: 0, description: 0 while no rules are saved }
            rules: { $ref: '#/components/schemas/ProjectRules' }
    ConsentRequest:
      type: object
      additionalProperties: false
      required: [rulesVersion, decision]
      properties:
        rulesVersion: { type: integer, minimum: 1, maximum: 9007199254740991 }
        decision: { type: string, enum: [accepted, refused] }
        parts:
          type: array
          maxItems: 4
          default: []
          description: The parts accepted, each once; an acceptance names every required part.
          items: { type: string, enum: [volunteer_duties, implementation_process, daee_duties, misconduct] }
    MyProject:
      type: object
      required: [projectId, code, year, name, status, applyFrom, applyTo, perVolunteerLimit, dawahEnabled, via, permissionSet, isPaid, consentStatus, rulesVersion, applicationsCounted, applicationsLeft, leadsTeam]
      properties:
        projectId: { $ref: '#/components/schemas/Uuid' }
