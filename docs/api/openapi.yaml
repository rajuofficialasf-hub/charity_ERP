  # ======================= projects =======================
  /projects:
    get:
      tags: [projects]
      operationId: projects.project.list
      summary: Projects within scope (volunteers see only active projects they are assigned to)
      description: >-
        Cancelled projects are left out unless `status=cancelled` asks for them. A volunteer gets
        only the work facts of a project (no program, budget or dates of the lifecycle).
      x-permission: project.view
      x-scope: project
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IncludeTotal'
        - name: programId
          in: query
          schema: { type: string, format: uuid }
        - name: year
          in: query
          schema: { type: integer, minimum: 2020, maximum: 2100 }
        - name: status
          in: query
          schema: { type: string, enum: [draft, active, closing, closed, cancelled] }
        - name: endingSoon
          in: query
          description: Only the projects whose application window ends today or within the next 7 days (Dhaka dates)
          schema: { type: string, enum: ['true'] }
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    post:
      tags: [projects]
      operationId: projects.project.create
      summary: Create a draft project from a workflow in a program of the caller
      description: >-
        The project starts with the components and settings of its workflow (D-095). The program
        must be in the caller's scope (403) and active (409 program.inactive); a taken code answers
        409 project.code_taken. A master template and a copy of a project come with T1.12.
      x-permission: project.create
      x-scope: program
      x-audit: project.create
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreate' }
      responses:
        '201':
          description: Draft project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: projects.project.get
      summary: Get a project
      x-permission: project.view
      x-scope: project
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: Project
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [projects]
      operationId: projects.project.update
      summary: Update setup fields as the project state allows
      description: >-
        A draft changes every field; an active project everything but its code, program, year and
        workflow, and its end date only through extend-deadline; closing, closed and cancelled
        projects are read-only (409 project.read_only, BR-257). Moving a draft to another program
        needs project.configure there and an active program.
      x-permission: project.configure
      x-scope: project
      x-audit: project.configure
      x-idempotency: none
      x-rate-limit: default
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /projects/{projectId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [projects]
      operationId: projects.project.cancel
      summary: Cancel a draft that was never activated, with a reason (BR-255)
      x-permission: project.cancel
      x-scope: project
      x-audit: project.cancel
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
