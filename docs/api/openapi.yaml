    post:
      tags: [beneficiaries]
      operationId: beneficiaries.merge.dismissal_lift
      summary: Lift the mark of a pair with a reason; the pair is suggested again
      x-permission: beneficiary.merge.dismiss
      x-scope: beneficiary
      x-audit: beneficiary.merge_dismissal_lifted
      x-idempotency: none
