        name: { type: string }
        fatherOrHusbandName: { type: string, x-sensitive-class: beneficiary.profile_detail }
        motherName: { type: [string, 'null'], x-sensitive-class: beneficiary.profile_detail }
        genderCode: { type: string, x-sensitive-class: beneficiary.profile_detail }
        ageYears: { type: [integer, 'null'], x-sensitive-class: beneficiary.profile_detail }
        classCode: { type: [string, 'null'], x-sensitive-class: beneficiary.profile_detail }
        classOtherText: { type: [string, 'null'], x-sensitive-class: beneficiary.profile_detail }
        occupationCode: { type: [string, 'null'], x-sensitive-class: beneficiary.profile_detail }
        status: { type: string }
        photoFileId: { type: [string, 'null'], format: uuid, x-sensitive-class: beneficiary.profile_detail }
        divisionId: { $ref: '#/components/schemas/Uuid' }
        districtId: { $ref: '#/components/schemas/Uuid' }
        upazilaId: { $ref: '#/components/schemas/Uuid' }
        unionId: { type: string, format: uuid, x-sensitive-class: beneficiary.address_detail }
        village: { type: string, x-sensitive-class: beneficiary.address_detail }
        postOffice: { type: [string, 'null'], x-sensitive-class: beneficiary.address_detail }
        postCode: { type: [string, 'null'], x-sensitive-class: beneficiary.address_detail }
        landmark: { type: [string, 'null'], x-sensitive-class: beneficiary.address_detail }
        mobile: { type: string, x-sensitive-class: beneficiary.contact }
        familyMembers:
          type: array
          x-sensitive-class: beneficiary.contact
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              name: { type: string }
              relationshipCode: { type: [string, 'null'] }
              ageYears: { type: [integer, 'null'], x-sensitive-class: beneficiary.profile_detail }
        nid: { type: [string, 'null'], x-sensitive-class: beneficiary.nid, description: Only inside the beneficiary.view_nid scope }
        birthReg: { type: [string, 'null'], x-sensitive-class: beneficiary.nid, description: Only inside the beneficiary.view_nid scope }
        isBlocked: { type: boolean, x-sensitive-class: beneficiary.care }
        projectsByYear:
          type: array
          items:
            type: object
            properties:
              year: { type: integer }
              projects:
                type: array
                items:
                  type: object
                  properties:
                    id: { $ref: '#/components/schemas/Uuid' }
                    code: { type: string }
                    nameBn: { type: string }
                    nameEn: { type: string }
                    status: { type: string, description: The status of the beneficiary's application }
        applications:
          type: array
          x-sensitive-class: beneficiary.application_history
          description: Application history, latest 20 (for a project-scoped caller only its projects)
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              appNo: { type: [string, 'null'] }
              projectId: { $ref: '#/components/schemas/Uuid' }
              status: { type: string }
              submittedAt: { type: [string, 'null'], format: date-time }
              reviewedAt: { type: [string, 'null'], format: date-time }
              approvedAt: { type: [string, 'null'], format: date-time }
        distributions:
          type: array
          description: Distribution and implementation activities, latest 20
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              applicationId: { type: [string, 'null'], format: uuid }
              projectId: { $ref: '#/components/schemas/Uuid' }
              status: { type: string }
              doneAt: { type: string, format: date-time }
        dawah:
          type: object
          x-sensitive-class: beneficiary.care
          description: Class attendance, learning progress and exams, latest 20 each
        followUps:
          type: object
          x-sensitive-class: beneficiary.care
          description: Calls and follow-up evaluations, latest 20 each
        activities:
          type: array
          x-sensitive-class: beneficiary.care
          description: Activity history, latest 20
          items: { type: object }
    BeneficiaryResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Beneficiary' }
        meta: { $ref: '#/components/schemas/Meta' }
    BeneficiaryList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/BeneficiarySummary' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    LookupRequest:
      type: object
      additionalProperties: false
      description: Exactly one of nid and birthReg (422 `beneficiary.identity_missing` without one, `validation.malformed` with both)
      required: [projectId]
      properties:
        nid: { type: string, pattern: '^([0-9]{10}|[0-9]{13}|[0-9]{17})$' }
        birthReg: { type: string, pattern: '^[0-9]{17}$' }
        projectId: { $ref: '#/components/schemas/Uuid' }
    LookupResult:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [found]
          properties:
            found: { type: boolean }
            blocked: { type: boolean, description: true means a new application is refused (BR-010) }
            alreadyAppliedInProject: { type: boolean }
            mobileIsCallerOwn:
              type: boolean
              description: The profile's mobile is the caller's own, so the form asks for another (BD-03)
            mergedInto:
              description: The number led to a retired profile; the auto-fill is the kept one's
              type: object
              required: [benNo]
              properties:
                benNo: { $ref: '#/components/schemas/BenNo' }
            autofill:
              description: The auto-fill fields (BR-005); locked fields are marked
              type: object
              required:
                [beneficiaryId, benNo, name, fatherOrHusbandName, mobile, genderCode, divisionId, districtId, upazilaId, unionId, village, lockedFields]
              properties:
                beneficiaryId: { $ref: '#/components/schemas/Uuid' }
                benNo: { $ref: '#/components/schemas/BenNo' }
                name: { type: string }
                fatherOrHusbandName: { type: string }
                motherName: { type: [string, 'null'] }
                mobile: { type: string }
                genderCode: { type: string }
                dob: { type: [string, 'null'], format: date }
                ageYears: { type: [integer, 'null'] }
                divisionId: { $ref: '#/components/schemas/Uuid' }
                districtId: { $ref: '#/components/schemas/Uuid' }
                upazilaId: { $ref: '#/components/schemas/Uuid' }
                unionId: { $ref: '#/components/schemas/Uuid' }
                village: { type: string }
                postOffice: { type: [string, 'null'] }
                postCode: { type: [string, 'null'] }
                landmark: { type: [string, 'null'] }
                members14Plus: { type: [integer, 'null'] }
                childrenUnder14: { type: [integer, 'null'] }
                lockedFields:
                  type: array
                  items: { type: string, enum: [name, father_or_husband_name, nid, birth_reg] }
        meta: { $ref: '#/components/schemas/Meta' }
    FamilyMember:
      type: object
      required: [id, name, isEarner, active]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        relationshipCode: { type: [string, 'null'] }
        genderCode: { type: [string, 'null'] }
        dob: { type: [string, 'null'], format: date }
        ageYears: { type: [integer, 'null'] }
        occupationCode: { type: [string, 'null'] }
        monthlyIncome: { $ref: '#/components/schemas/Money' }
        isEarner: { type: boolean }
        active: { type: boolean }
    FamilyMemberList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/FamilyMember' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    CorrectionRequestCreate:
      type: object
      additionalProperties: false
      description: A new NID has 10, 13 or 17 digits and a new birth registration 17 (validation.nid_format, validation.birth_reg_format)
      required: [field, newValue, reason]
      properties:
        field: { type: string, enum: [name, father_or_husband_name, nid, birth_reg] }
        newValue: { type: string, minLength: 1, maxLength: 200 }
        reason: { type: string, minLength: 3, maxLength: 1000 }
    CorrectionRequest:
      type: object
      description: The values of an identity number are null outside the caller's beneficiary.view_nid scope
      required: [id, beneficiaryId, field, oldValue, newValue, reason, status, requestedBy, requestedAt, decidedBy, decidedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        beneficiaryId: { $ref: '#/components/schemas/Uuid' }
        field: { type: string, enum: [name, father_or_husband_name, nid, birth_reg] }
        oldValue: { type: [string, 'null'] }
        newValue: { type: [string, 'null'] }
        reason: { type: string }
        status: { type: string, enum: [submitted, approved, rejected] }
        requestedBy: { $ref: '#/components/schemas/Uuid' }
        requestedAt: { type: string, format: date-time }
        decidedBy: { type: [string, 'null'], format: uuid }
        decidedAt: { type: [string, 'null'], format: date-time }
    ContactUpdate:
      type: object
      additionalProperties: false
      description: At least one field; divisionId, districtId, upazilaId and unionId together; name, fatherOrHusbandName, nid and birthReg are refused with beneficiary.locked_field
      properties:
        mobile: { type: string, pattern: '^01[3-9][0-9]{8}$' }
        divisionId: { $ref: '#/components/schemas/Uuid' }
        districtId: { $ref: '#/components/schemas/Uuid' }
        upazilaId: { $ref: '#/components/schemas/Uuid' }
        unionId: { $ref: '#/components/schemas/Uuid' }
        village: { type: string, minLength: 1, maxLength: 200 }
        postOffice: { type: string, minLength: 1, maxLength: 100 }
        postCode: { type: string, pattern: '^[0-9]{4}$' }
        landmark: { type: string, minLength: 1, maxLength: 200 }
        name: { not: {} }
        fatherOrHusbandName: { not: {} }
        nid: { not: {} }
        birthReg: { not: {} }
    ContactResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [id, mobile, divisionId, districtId, upazilaId, unionId, village, postOffice, postCode, landmark, warnings]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            mobile: { type: string }
            divisionId: { $ref: '#/components/schemas/Uuid' }
            districtId: { $ref: '#/components/schemas/Uuid' }
            upazilaId: { $ref: '#/components/schemas/Uuid' }
            unionId: { $ref: '#/components/schemas/Uuid' }
            village: { type: string }
            postOffice: { type: [string, 'null'] }
            postCode: { type: [string, 'null'] }
            landmark: { type: [string, 'null'] }
            warnings:
              type: array
              items:
                type: object
                required: [code, count, benNos]
                properties:
                  code: { type: string, enum: [beneficiary.mobile_shared] }
                  count: { type: integer, minimum: 1 }
                  benNos: { type: array, items: { type: string } }
        meta: { $ref: '#/components/schemas/Meta' }
    CorrectionRequestResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/CorrectionRequest' }
        meta: { $ref: '#/components/schemas/Meta' }
    MergeCandidate:
      type: object
      required: [beneficiaryId, otherBeneficiaryId, matchedOn]
      properties:
        beneficiaryId: { $ref: '#/components/schemas/Uuid' }
        otherBeneficiaryId: { $ref: '#/components/schemas/Uuid' }
        matchedOn: { type: string, enum: [name_father_mobile, name_dob_union, same_mobile, requested] }
    MergeCandidateList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/MergeCandidate' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    MergeRequest:
      type: object
      required: [keptId, mergedId, reason]
      properties:
        keptId: { $ref: '#/components/schemas/Uuid' }
        mergedId: { $ref: '#/components/schemas/Uuid' }
        reason: { type: string, minLength: 3 }
    Merge:
      allOf:
        - $ref: '#/components/schemas/MergeRequest'
        - type: object
          required: [id, mergedAt]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            status: { type: string, enum: [proposed, merged, reverted] }
            mergedAt: { type: [string, 'null'], format: date-time }
            revertedAt: { type: [string, 'null'], format: date-time }
    MergeResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Merge' }
        meta: { $ref: '#/components/schemas/Meta' }
    BeneficiaryStatusRequest:
      type: object
      required: [status, reason]
      properties:
        status: { type: string, enum: [active, deceased, relocated] }
        reason: { type: string, minLength: 3 }
    MediaConsentRequest:
      type: object
      required: [granted, channels]
      properties:
        granted: { type: boolean }
        channels: { type: array, items: { type: string }, description: reference list consent_channel (O-17) }
        evidenceFileId: { $ref: '#/components/schemas/Uuid' }
    MediaConsent:
      type: [object, 'null']
      properties:
        granted: { type: boolean }
        channels: { type: array, items: { type: string } }
        recordedAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
    MediaConsentResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/MediaConsent' }
        meta: { $ref: '#/components/schemas/Meta' }

    # ---------------- programs and projects ----------------
    BoundedLabel:
      type: object
      description: A bilingual configuration label of at most 200 characters per language
      additionalProperties: false
      required: [bn, en]
      properties:
        bn: { type: string, maxLength: 200 }
        en: { type: string, maxLength: 200 }
    ProgramCreate:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: { type: string, pattern: '^[A-Z]{2,12}$' }
        name: { $ref: '#/components/schemas/BoundedLabel' }
        pmUserId: { type: string, format: uuid }
    ProgramUpdate:
      type: object
      description: At least one of name and active
      additionalProperties: false
      properties:
        name: { $ref: '#/components/schemas/BoundedLabel' }
        active: { type: boolean }
    Program:
      type: object
      required: [id, code, name, pmUserId, pmName, active]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string }
        name: { $ref: '#/components/schemas/Bilingual' }
        pmUserId: { type: [string, 'null'], format: uuid }
        pmName: { type: [string, 'null'] }
        active: { type: boolean }
    ProgramResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Program' }
        meta: { $ref: '#/components/schemas/Meta' }
    ProgramList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Program' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    ProjectCreate:
      type: object
      additionalProperties: false
      required: [programId, code, year, name, source]
      properties:
        programId: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z]{2,8}$', description: Unique project code (O-03) }
        year: { type: integer, minimum: 2020, maximum: 2100 }
        name: { $ref: '#/components/schemas/BoundedLabel' }
        description: { type: string, maxLength: 2000 }
        source:
          description: >-
            Where the project starts (BD-10, D-096): a workflow's starting setup, an active master
            template, or a copy of a project the caller may view. A template or a copy brings the
            components with their settings, the syllabus and the rules texts, and nothing else.
          oneOf:
            - type: object
              additionalProperties: false
              required: [kind, workflowKey]
              properties:
                kind: { type: string, const: workflow }
                workflowKey: { type: string, enum: [distribution, construction, advance_voucher, implementation_evidence, open_application_visit, qurbani] }
            - type: object
              additionalProperties: false
              required: [kind, templateId]
              properties:
                kind: { type: string, const: template }
                templateId: { type: string, format: uuid }
            - type: object
              additionalProperties: false
              required: [kind, projectId]
              properties:
                kind: { type: string, const: copy }
                projectId: { type: string, format: uuid }
    ProjectUpdate:
      type: object
      description: Setup fields of the project row; at least one. Which may change depends on the project state.
      additionalProperties: false
      properties:
        name: { $ref: '#/components/schemas/BoundedLabel' }
        description:
          anyOf:
            - { type: string, maxLength: 2000 }
            - { type: 'null' }
        programId: { type: string, format: uuid }
        year: { type: integer, minimum: 2020, maximum: 2100 }
        workflowKey:
          type: string
          enum:
            [
              distribution,
              construction,
              advance_voucher,
              implementation_evidence,
              open_application_visit,
              qurbani,
            ]
        applyFrom:
          anyOf:
            - { type: string, format: date }
            - { type: 'null' }
        applyTo:
          anyOf:
            - { type: string, format: date }
            - { type: 'null' }
        perVolunteerLimit:
          anyOf:
            - { type: integer, minimum: 1, maximum: 100000 }
            - { type: 'null' }
        costPerBeneficiary:
          anyOf:
            - { type: string, pattern: '^\d{1,12}(\.\d{1,2})?$' }
            - { type: 'null' }
        targetBeneficiaries:
          anyOf:
            - { type: integer, minimum: 1, maximum: 10000000 }
            - { type: 'null' }
    Project:
      type: object
      description: The official view; a volunteer receives only id, code, year, name, status, workflowKey, the window, the limit and dawahEnabled
      required: [id, code, year, name, status, workflowKey, applyFrom, applyTo, perVolunteerLimit, dawahEnabled]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string }
        year: { type: integer }
        name: { $ref: '#/components/schemas/Bilingual' }
        status: { type: string, enum: [draft, active, closing, closed, cancelled] }
        workflowKey: { type: string }
        applyFrom: { type: [string, 'null'], format: date }
        applyTo: { type: [string, 'null'], format: date }
        perVolunteerLimit: { type: [integer, 'null'] }
        dawahEnabled: { type: boolean }
        programId: { $ref: '#/components/schemas/Uuid' }
        description: { type: [string, 'null'] }
        workflowVersion: { type: integer }
        costPerBeneficiary: { type: [string, 'null'] }
        targetBeneficiaries: { type: [integer, 'null'] }
        budgetPlanned: { type: [string, 'null'] }
        activatedAt: { type: [string, 'null'], format: date-time }
        closedAt: { type: [string, 'null'], format: date-time }
        cancelledAt: { type: [string, 'null'], format: date-time }
    ProjectResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Project' }
        meta: { $ref: '#/components/schemas/Meta' }
    ProjectList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Project' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    ExtendDeadlineRequest:
      type: object
      additionalProperties: false
      required: [newApplyTo, reason]
      properties:
        newApplyTo: { type: string, format: date }
        reason: { type: string, minLength: 3, maxLength: 1000 }
    Component:
      type: object
      description: A volunteer receives only the enabled components, with the settings of the photo rule only
      required: [componentKey, enabled]
      properties:
        componentKey: { type: string }
        enabled: { type: boolean }
        settings: { $ref: '../database/json-schemas/project-component-settings.schema.json' }
        etag: { type: string, description: "The component's own version, for If-Match" }
    ComponentPatch:
      type: object
      description: At least one of enabled and settings; settings are checked against the component's schema
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        settings: { type: object, additionalProperties: {}, propertyNames: { type: string } }
    ComponentResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Component' }
        meta: { $ref: '#/components/schemas/Meta' }
    ComponentList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Component' } }
        meta: { $ref: '#/components/schemas/Meta' }
    Area:
      type: object
      required: [id, locationId, level, locationName, rpmUserId, rpmName]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        locationId: { $ref: '#/components/schemas/Uuid' }
        level: { type: string, enum: [division, district] }
        locationName: { $ref: '#/components/schemas/Bilingual' }
        rpmUserId: { $ref: '#/components/schemas/Uuid' }
        rpmName: { type: string }
    AreaCreate:
      type: object
      additionalProperties: false
      required: [locationId, rpmUserId]
      properties:
        locationId: { type: string, format: uuid }
        rpmUserId: { type: string, format: uuid }
    AreaList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Area' } }
        meta: { $ref: '#/components/schemas/Meta' }
    StaffAssignmentCreate:
      type: object
      additionalProperties: false
      required: [userId, roleKey]
      properties:
        userId: { type: string, format: uuid }
        roleKey: { type: string, enum: [project_executive, official_daee, implementer] }
        areaLocationId: { type: string, format: uuid }
        canView: { type: boolean, default: true }
        canEdit: { type: boolean, default: false }
        canDelete: { type: boolean, default: false }
    StaffAssignment:
      type: object
      required: [id, userId, displayName, roleKey, areaLocationId, canView, canEdit, canDelete, extraPermissions, endedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        userId: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string }
        roleKey: { type: string }
        areaLocationId: { type: [string, 'null'], format: uuid }
        canView: { type: boolean }
        canEdit: { type: boolean }
        canDelete: { type: boolean }
        extraPermissions: { type: array, items: { type: string } }
        endedAt: { type: [string, 'null'], format: date-time }
    Candidate:
      type: object
      required: [id, displayName, designation]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string }
        designation: { type: [string, 'null'] }
    CandidateList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Candidate' } }
        meta: { $ref: '#/components/schemas/Meta' }
    StaffAssignmentList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/StaffAssignment' } }
        meta: { $ref: '#/components/schemas/Meta' }
    SyllabusTopic:
      type: object
      required: [id, title]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { $ref: '#/components/schemas/Bilingual' }
    SyllabusList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/SyllabusTopic' } }
        meta: { $ref: '#/components/schemas/Meta' }
    SyllabusReplace:
      type: object
      additionalProperties: false
      required: [topics]
      properties:
        topics:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [title]
            properties:
              id: { type: string, format: uuid }
              title: { $ref: '#/components/schemas/BoundedLabel' }
    Quota:
      type: object
      required: [level, locationId, target]
      properties:
        level: { type: string, enum: [district, union] }
        locationId: { $ref: '#/components/schemas/Uuid' }
        target: { type: integer, minimum: 0 }
        approvedCount: { type: integer, readOnly: true }
        receivedCount: { type: integer, readOnly: true, description: Applications received in the area }
    QuotaList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Quota' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    QuotaReplace:
      type: object
      required: [quotas]
      properties:
        quotas: { type: array, items: { $ref: '#/components/schemas/Quota' } }
    FundSource:
      type: object
      required: [source, label, amount]
      properties:
        source: { type: string, enum: [zakat, sadaqah, general, donor] }
        label: { type: [string, 'null'], description: The donor's name for a specific donor }
        amount: { $ref: '#/components/schemas/Money' }
    FundSourceReplace:
      type: object
      additionalProperties: false
      required: [fundSources]
      properties:
        costPerBeneficiary: { type: string, pattern: '^\d{1,12}(\.\d{1,2})?$' }
        targetBeneficiaries: { type: integer, minimum: 1, maximum: 10000000 }
        fundSources:
          type: array
          maxItems: 10
          items:
            type: object
            description: A specific donor (source donor) needs its label
            additionalProperties: false
            required: [source, amount]
            properties:
              source: { type: string, enum: [zakat, sadaqah, general, donor] }
              label: { type: string, minLength: 1, maxLength: 200 }
              amount: { type: string, pattern: '^\d{1,12}(\.\d{1,2})?$' }
    FundSourceList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/FundSource' } }
        meta: { $ref: '#/components/schemas/Meta' }
    Template:
      type: object
      required: [id, name, description, workflowKey, active, version, sourceProjectId, updatedAt, updatedByName]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { $ref: '#/components/schemas/Bilingual' }
        description: { type: [string, 'null'] }
        workflowKey: { type: string }
        active: { type: boolean }
        version: { type: integer, minimum: 1, description: Raised each time a project's setup replaces the contents }
        sourceProjectId: { type: [string, 'null'], format: uuid }
        updatedAt: { type: string, format: date-time }
        updatedByName: { type: [string, 'null'] }
    TemplateDetail:
      allOf:
        - $ref: '#/components/schemas/Template'
        - type: object
          required: [definition]
          properties:
            definition: { type: object, description: 'The copied parts: workflowKey, components with settings, syllabus, rules' }
    TemplateResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Template' }
    TemplateDetailResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/TemplateDetail' }
    TemplateList:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Template' } }
    SaveAsTemplateRequest:
      description: A new template with its name, or the replacement of an existing template's contents.
      anyOf:
        - type: object
          additionalProperties: false
          required: [name]
          properties:
            name: { $ref: '#/components/schemas/BoundedLabel' }
            description: { type: string, maxLength: 2000 }
        - type: object
          additionalProperties: false
          required: [templateId]
          properties:
            templateId: { type: string, format: uuid }
    TemplateUpdate:
      type: object
      additionalProperties: false
      description: At least one field.
      properties:
        name: { $ref: '#/components/schemas/BoundedLabel' }
        description:
          anyOf:
            - { type: string, maxLength: 2000 }
            - { type: 'null' }
        active: { type: boolean }

    # ---------------- forms ----------------
    Form:
      type: object
      required: [id, projectId, key, title]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        projectId: { $ref: '#/components/schemas/Uuid' }
        key: { type: string }
        title: { $ref: '#/components/schemas/Bilingual' }
        publishedVersionId: { type: [string, 'null'], format: uuid }
    FormList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Form' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    FieldOption:
      type: object
      required: [code, label]
      properties:
        code: { type: string }
        label: { $ref: '#/components/schemas/Bilingual' }
        dependsOnOptionCode: { type: [string, 'null'] }
        allowsOtherText: { type: boolean }
    FormField:
      type: object
      required: [fieldKey, type, label, required]
      properties:
        fieldKey: { type: string, pattern: '^[a-z][a-z0-9_]*$' }
        libraryFieldKey: { type: [string, 'null'] }
        type: { type: string, enum: [short_text, long_text, number, decimal, money, phone, email, date, time, datetime, single_select, multi_select, radio, checkbox, photo, file, signature, gps, bd_address, repeat_group, calculation, note] }
        label: { $ref: '#/components/schemas/Bilingual' }
        required: { type: boolean }
        standardColumn: { type: [string, 'null'] }
        settings: { $ref: '../database/json-schemas/form-field-logic.schema.json#/$defs/settings' }
        logic: { $ref: '../database/json-schemas/form-field-logic.schema.json' }
        calculation: { $ref: '../database/json-schemas/form-field-logic.schema.json#/$defs/calculation' }
        options: { type: array, items: { $ref: '#/components/schemas/FieldOption' } }
    FormSection:
      type: object
      required: [key, title, visibility, fields]
      properties:
        key: { type: string }
        librarySectionKey: { type: [string, 'null'] }
        title: { $ref: '#/components/schemas/Bilingual' }
        visibility: { type: string, enum: [volunteer, official_only] }
        condition: { type: [object, 'null'] }
        fields: { type: array, items: { $ref: '#/components/schemas/FormField' } }
    FormVersion:
      type: object
      required: [id, formId, versionNo, status, sections]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        formId: { $ref: '#/components/schemas/Uuid' }
        versionNo: { type: integer }
        status: { type: string, enum: [draft, published, retired] }
        publishedAt: { type: [string, 'null'], format: date-time }
        sections:
          type: array
          description: Official-only sections are absent for callers without application.view_official_section
          items: { $ref: '#/components/schemas/FormSection' }
    FormVersionResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/FormVersion' }
        meta: { $ref: '#/components/schemas/Meta' }
    FormVersionList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/FormVersion' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    FormDraftUpdate:
      type: object
      required: [sections]
      properties:
        sections: { type: array, items: { $ref: '#/components/schemas/FormSection' } }
    PublicLinkConfig:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        formIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        url: { type: string, readOnly: true }

    # ---------------- applications ----------------
    ApplicationSummary:
      type: object
      required: [id, projectId, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        appNo: { type: [string, 'null'] }
        projectId: { $ref: '#/components/schemas/Uuid' }
        beneficiaryId: { type: [string, 'null'], format: uuid }
        beneficiaryName: { type: [string, 'null'] }
        ownerVolunteerId: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [draft, needs_verification, submitted, under_review, reviewed, waitlisted, approved, rejected, implementation, completed, closed, deleted] }
        stage: { type: [string, 'null'] }
        outcome: { type: [string, 'null'] }
        flags: { type: array, items: { type: string } }
        totalScore: { type: [number, 'null'], x-sensitive-class: application.official_section }
        districtId: { $ref: '#/components/schemas/Uuid' }
        unionId: { $ref: '#/components/schemas/Uuid' }
        submittedAt: { type: [string, 'null'], format: date-time }
        waitingDays: { type: [integer, 'null'], description: Days in the current state (UX-07 stuck approvals) }
    Answer:
      type: object
      required: [fieldKey, value]
      properties:
        fieldKey: { type: string }
        repeatIndex: { type: integer, minimum: 0, default: 0 }
        value: { $ref: '../database/json-schemas/application-answer-value.schema.json' }
    ApplicationCreate:
      type: object
      required: [clientUuid, projectId, formVersionId, answers]
      properties:
        clientUuid: { $ref: '#/components/schemas/Uuid' }
        clientCreatedAt: { type: string, format: date-time }
        projectId: { $ref: '#/components/schemas/Uuid' }
        formVersionId: { $ref: '#/components/schemas/Uuid' }
        beneficiaryId: { type: string, format: uuid, description: From lookup; omit for a new beneficiary }
        answers: { type: array, items: { $ref: '#/components/schemas/Answer' } }
    ApplicationUpdate:
      type: object
      required: [answers]
      properties:
        answers: { type: array, items: { $ref: '#/components/schemas/Answer' } }
    Application:
      allOf:
        - $ref: '#/components/schemas/ApplicationSummary'
        - type: object
          properties:
            formVersionId: { $ref: '#/components/schemas/Uuid' }
            candidateBeneficiaryId: { type: [string, 'null'], format: uuid }
            answers:
              type: array
              description: Official-section answers are absent for callers without application.view_official_section
              items: { $ref: '#/components/schemas/Answer' }
            reviewedAt: { type: [string, 'null'], format: date-time }
            approvedAt: { type: [string, 'null'], format: date-time }
            decisionComment: { type: [string, 'null'] }
            zakat:
              type: [object, 'null']
              x-sensitive-class: application.official_section
              properties:
                nisabValue: { $ref: '#/components/schemas/Money' }
                decision: { type: [string, 'null'], enum: [eligible, not_eligible, null] }
            familyDuplicateWarnings:
              type: array
              description: BR-011 family-duplicate warnings shown at review
              items:
                type: object
                properties:
                  beneficiaryId: { $ref: '#/components/schemas/Uuid' }
                  name: { type: string }
                  matchedOn: { type: string, enum: [union_village, father_or_husband_name, mobile] }
            availableActions: { type: array, items: { type: string }, description: Actions the caller may perform now }
    ApplicationResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Application' }
        meta: { $ref: '#/components/schemas/Meta' }
    ApplicationList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ApplicationSummary' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    ApplicationActionRequest:
      type: object
      properties:
        reason: { type: string, description: 'Required for reject, waitlist and reject_unverified' }
        comment: { type: string, description: Required when deciding against the score order (BR-099) }
        linkBeneficiaryId: { type: string, format: uuid, description: verify_link only }
        zakatDecision: { type: string, enum: [eligible, not_eligible], description: Official দায়ী when the project uses zakat }
    Score:
      type: object
      required: [applicationId, totalScore, criteria]
      properties:
        applicationId: { $ref: '#/components/schemas/Uuid' }
        totalScore: { type: number, minimum: 0, maximum: 100 }
        criteria: { $ref: '../database/json-schemas/application-score-criteria.schema.json' }
        snapshotAt: { type: [string, 'null'], format: date-time }
    ScoreResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Score' }
        meta: { $ref: '#/components/schemas/Meta' }
    FieldUnlockRequest:
      type: object
      required: [fieldKey, reason]
      properties:
        fieldKey: { type: string }
        reason: { type: string, minLength: 3 }
    FieldUnlockUpdate:
      type: object
      required: [fieldKey, value]
      properties:
        fieldKey: { type: string }
        repeatIndex: { type: integer, minimum: 0, default: 0 }
        value: { $ref: '../database/json-schemas/application-answer-value.schema.json' }
    FieldChange:
      type: object
      required: [id, field, kind, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        field: { type: string }
        kind: { type: string, enum: [unlock, contact_update, correction, sync_conflict] }
        unlockState: { type: [string, 'null'], enum: [open, updated, relocked, null] }
        oldValue: {}
        newValue: {}
        reason: { type: [string, 'null'] }
        requestedBy: { type: [string, 'null'], format: uuid }
        approvedBy: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
    FieldChangeList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/FieldChange' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    Transfer:
      type: object
      required: [id, applicationId, fromVolunteerId, toVolunteerId, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        applicationId: { $ref: '#/components/schemas/Uuid' }
        fromVolunteerId: { $ref: '#/components/schemas/Uuid' }
        toVolunteerId: { $ref: '#/components/schemas/Uuid' }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
    TransferList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Transfer' } }
        meta: { $ref: '#/components/schemas/ListMeta' }

    # ---------------- activities ----------------
    ActivityCreate:
      type: object
      required: [clientUuid, applicationId, type]
      properties:
        clientUuid: { $ref: '#/components/schemas/Uuid' }
        clientCreatedAt: { type: string, format: date-time }
        applicationId: { $ref: '#/components/schemas/Uuid' }
        type: { type: string, enum: [distribution, construction, purchase, training, visit, payment, voucher, expense, issue, inspection, follow_up] }
        stage: { type: string }
        outcome: { type: string }
        comment: { type: string }
        photoFileIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
    Activity:
      allOf:
        - $ref: '#/components/schemas/ActivityCreate'
        - type: object
          required: [id, projectId, status, doneBy, doneAt]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            projectId: { $ref: '#/components/schemas/Uuid' }
            status: { type: string, enum: [planned, done, failed] }
            doneBy: { $ref: '#/components/schemas/Uuid' }
            doneAt: { type: string, format: date-time }
    ActivityResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Activity' }
        meta: { $ref: '#/components/schemas/Meta' }
    ActivityList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Activity' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    BulkRow:
      type: object
      required: [clientUuid, applicationId]
      properties:
        clientUuid: { $ref: '#/components/schemas/Uuid' }
        applicationId: { $ref: '#/components/schemas/Uuid' }
        outcome: { type: string }
        stage: { type: string }
        present: { type: boolean, description: class screen }
        familyMemberId: { type: string, format: uuid, description: 'class screen - family attendance (O-11)' }
        absenceReason: { type: string }
        topicUpdates:
          type: array
          description: class screen
          items:
            type: object
            properties:
              topicId: { $ref: '#/components/schemas/Uuid' }
              status: { type: string, enum: [in_progress, learned] }
        method: { type: string, enum: [visit, phone], description: followup screen }
        answers: { type: object, description: followup screen answers (followup-answers schema) }
        photoFileIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        comment: { type: string }
    BulkRequest:
      type: object
      required: [rows]
      properties:
        rows: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/BulkRow' } }
    RowResult:
      type: object
      required: [clientUuid, result]
      properties:
        clientUuid: { $ref: '#/components/schemas/Uuid' }
        result: { type: string, enum: [done, failed, pending_photos, needs_verification, synced] }
        code: { type: [string, 'null'], description: Error code when failed }
        serverId: { type: [string, 'null'], format: uuid }
        status: { type: [string, 'null'] }
        stage: { type: [string, 'null'] }
    BulkResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [results]
          properties:
            results: { type: array, items: { $ref: '#/components/schemas/RowResult' } }
        meta: { $ref: '#/components/schemas/Meta' }

    # ---------------- files ----------------
    UploadSessionCreate:
      type: object
      additionalProperties: false
      required: [clientUuid, kind, entityType, entityId, slot, mime, sizeBytes, sha256, source]
      properties:
        clientUuid: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [distribution_proof, construction_proof, evidence, voucher, payment_copy, document, animal_photo, profile_photo, nid_photo, media_asset, issue_photo] }
        entityType: { type: string, minLength: 1, maxLength: 40, description: 'The record type the file links to: application, activity, issue, voucher, expense_claim, payment, animal or document; each takes its own kinds (D-108)' }
        entityId: { type: string, format: uuid, description: The record the file links to; its scope is checked at create and at finalize }
        slot: { type: string, pattern: '^[a-z][a-z0-9_]{0,39}$' }
        mime: { type: string, minLength: 1, maxLength: 100 }
        sizeBytes: { type: integer, minimum: 1, maximum: 20971520 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        capturedAt: { type: string, format: date-time }
        recordCreatedAt: { type: string, format: date-time }
        gps: { $ref: '#/components/schemas/Gps' }
        source: { type: string, enum: [camera, gallery, scan] }
    UploadSession:
      type: object
      required: [id, chunkSize, partCount, partsReceived, bytesReceived, expiresAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        chunkSize: { type: integer, const: 262144 }
        partCount: { type: integer, minimum: 1, description: The parts the declared size needs }
        partsReceived: { type: array, items: { type: integer, minimum: 1 }, description: 'The parts the server holds, for a resume after a dropped connection' }
        bytesReceived: { type: integer, minimum: 0 }
        expiresAt: { type: string, format: date-time }
        fileId: { type: [string, 'null'], format: uuid, description: Set once the session is finalized }
    UploadSessionResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/UploadSession' }
        meta: { $ref: '#/components/schemas/Meta' }
    FileInfo:
      type: object
      required: [id, kind, mime, sizeBytes, virusScan, flags]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string }
        mime: { type: string }
        sizeBytes: { type: integer }
        capturedAt: { type: [string, 'null'], format: date-time }
        uploadedAt: { type: string, format: date-time }
        gps:
          type: [object, 'null']
          x-sensitive-class: file.location
          required: [lat, lng]
          properties:
            lat: { type: number }
            lng: { type: number }
            accuracyM: { type: [number, 'null'] }
        virusScan: { type: string, enum: [pending, clean, infected, failed, skipped] }
        flags: { type: array, items: { type: string, enum: [no_capture_time, no_gps, gallery_under_camera_only, stale_capture, duplicate_suspect] } }
        duplicateOf: { type: [string, 'null'], format: uuid, description: 'The near or exact duplicate, named only to a caller whose scope reaches it' }
    FileListRow:
      type: object
      required: [id, kind, slot, mime, sizeBytes, capturedAt, uploadedAt, gps, virusScan, flags]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string }
        slot: { type: [string, 'null'] }
        mime: { type: string }
        sizeBytes: { type: integer }
        capturedAt: { type: [string, 'null'], format: date-time }
        uploadedAt: { type: string, format: date-time }
        gps:
          type: [object, 'null']
          x-sensitive-class: file.location
          description: 'Null for a caller without file.location, except on the caller''s own uploads'
          required: [lat, lng]
          properties:
            lat: { type: number }
            lng: { type: number }
            accuracyM: { type: [number, 'null'] }
        virusScan: { type: string, enum: [pending, clean, infected, failed, skipped] }
        flags: { type: array, items: { type: string } }
    FileListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/FileListRow' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    FileInfoResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/FileInfo' }
        meta: { $ref: '#/components/schemas/Meta' }

    # ---------------- notifications and exports ----------------
    Notification:
      type: object
      required: [id, templateKey, title, body, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        templateKey: { type: string }
        title: { type: string }
        body: { type: string }
        link: { type: [string, 'null'], description: In-app route of the related record }
        count: { type: integer, description: Coalesced events (O-35) }
        readAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    NotificationList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        meta:
          allOf:
            - $ref: '#/components/schemas/ListMeta'
            - type: object
              properties:
                unreadCount: { type: integer }
    MarkReadRequest:
      type: object
      additionalProperties: false
      description: Exactly one of ids and all.
      properties:
        ids: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/Uuid' } }
        all: { type: boolean, const: true }
    PreferencesUpdate:
      type: object
      additionalProperties: false
      description: At least one field; officials only (a volunteer has no email setting).
      properties:
        email_mode: { type: string, enum: [digest, immediate] }
        digest_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
    NotificationTemplateText:
      type: object
      additionalProperties: false
      required: [body]
      description: >-
        Plain text without links and without < or >; an email has a subject and no title, an in-app
        entry a title and no subject; a {{placeholder}} must be declared for the key
        (notification.placeholder_unknown), and an in-app text may not use a person's name
        (notification.person_in_app).
      properties:
        subject: { type: string, minLength: 1, maxLength: 200 }
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 2000 }
    NotificationTemplateEdit:
      type: object
      additionalProperties: false
      required: [bn, en]
      properties:
        bn: { $ref: '#/components/schemas/NotificationTemplateText' }
        en: { $ref: '#/components/schemas/NotificationTemplateText' }
    NotificationTemplate:
      type: object
      required: [key, category, variables, channels]
      properties:
        key: { type: string }
        category: { type: string, enum: [security, work, info, alert] }
        variables: { type: array, items: { type: string } }
        channels:
          type: object
          properties:
            in_app: { $ref: '#/components/schemas/NotificationTemplateChannel' }
            email: { $ref: '#/components/schemas/NotificationTemplateChannel' }
    NotificationTemplateChannel:
      type: object
      required: [version, bn, en]
      properties:
        version: { type: integer, minimum: 1 }
        bn: { $ref: '#/components/schemas/StoredTemplateText' }
        en: { $ref: '#/components/schemas/StoredTemplateText' }
    StoredTemplateText:
      type: object
      required: [subject, title, body]
      properties:
        subject: { type: [string, 'null'] }
        title: { type: [string, 'null'] }
        body: { type: string }
    RenderedNotification:
      type: object
      required: [body]
      properties:
        subject: { type: string }
        title: { type: string }
        body: { type: string }
    Delivery:
      type: object
      required: [id, createdAt, channel, templateKey, status, recipient, address, attempts]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        createdAt: { type: string, format: date-time }
        channel: { type: string, enum: [email, sms, push] }
        templateKey: { type: string }
        status: { type: string, enum: [queued, sending, sent, failed, dry_run, suppressed] }
        recipient:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, name]
              properties:
                id: { $ref: '#/components/schemas/Uuid' }
                name: { type: string }
        address: { type: string, description: 'Partly hidden: the first letter and the domain, or 3 and 2 digits' }
        attempts: { type: integer, minimum: 0 }
        lastError: { type: [string, 'null'], description: 'Cleaned: no address or number' }
        nextAttemptAt: { type: [string, 'null'], format: date-time }
        sentAt: { type: [string, 'null'], format: date-time }
    PreferencesResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '../database/json-schemas/user-preferences.schema.json' }
        meta: { $ref: '#/components/schemas/Meta' }
    ExportCreate:
      type: object
      required: [kind, format]
      properties:
        kind: { type: string, enum: [applications, beneficiaries, volunteers, form_data, work_summary, audit] }
        format: { type: string, enum: [csv, xlsx, pdf] }
        filters: { type: object }
    ExportJob:
      type: object
      required: [id, kind, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string }
        status: { type: string, enum: [queued, running, done, failed] }
        rowCount: { type: [integer, 'null'] }
        fileId: { type: [string, 'null'], format: uuid }
        sensitive: { type: boolean }
        createdAt: { type: string, format: date-time }
    ExportJobResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/ExportJob' }
        meta: { $ref: '#/components/schemas/Meta' }

    # ---------------- reference data ----------------
    Location:
      type: object
      required: [id, level, code, name, active]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        parentId: { type: [string, 'null'], format: uuid }
        level: { type: string, enum: [division, district, upazila, union] }
        code: { type: string }
        name: { $ref: '#/components/schemas/Bilingual' }
        active: { type: boolean }
    LocationCreate:
      type: object
      required: [parentId, level, code, name]
      properties:
        parentId: { $ref: '#/components/schemas/Uuid' }
        level: { type: string, enum: [district, upazila, union] }
        code: { type: string }
        name: { $ref: '#/components/schemas/Bilingual' }
    LocationUpdate:
      type: object
      properties:
        name: { $ref: '#/components/schemas/Bilingual' }
        active: { type: boolean, description: Deactivate instead of delete (O-09) }
    LocationResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Location' }
        meta: { $ref: '#/components/schemas/Meta' }
    LocationList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Location' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    ReferenceItem:
      type: object
      required: [code, label, active, sortOrder]
      properties:
        code: { type: string, pattern: '^[a-z0-9_]{1,64}$' }
        label: { $ref: '#/components/schemas/Bilingual' }
        active: { type: boolean }
        sortOrder: { type: integer }
    ReferenceItemCreate:
      description: >-
        A new item of an editable list (DECISION_LOG D-098). The code is small English letters,
        digits and _, starting with a letter, and never changes; each label at most 200 characters.
      type: object
      additionalProperties: false
      required: [code, label]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9_]{1,63}$' }
        label: { $ref: '#/components/schemas/BilingualInput' }
        active: { type: boolean }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
    ReferenceItemUpdate:
      description: At least one of label, active and sortOrder.
      type: object
      additionalProperties: false
      properties:
        label: { $ref: '#/components/schemas/BilingualInput' }
        active: { type: boolean }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
    BilingualInput:
      description: A configuration text in both languages, both required (BR-245).
      type: object
      additionalProperties: false
      required: [bn, en]
      properties:
        bn: { type: string }
        en: { type: string }
    ReferenceList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ReferenceItem' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    ReferenceItemResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/ReferenceItem' }
        meta: { $ref: '#/components/schemas/Meta' }
    Setting:
      description: >-
        One setting key with its whole value; updatedAt is null while the default is in force.
        Keys and value shapes are in @css/shared/settings (organisation, localization,
        monitoring.thresholds; sms.provider through the channels page).
      type: object
      required: [key, value, updatedAt]
      properties:
        key: { type: string }
        value: {}
        updatedAt:
          anyOf:
            - { type: string, format: date-time }
            - { type: 'null' }
    SettingResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Setting' }
        meta: { $ref: '#/components/schemas/Meta' }
    SettingList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Setting' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    SettingUpdate:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: {}
    PublicSettingsResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [defaultLanguage, organisation]
          properties:
            defaultLanguage: { type: string, enum: [bn, en] }
            organisation:
              type: object
              required: [foundationName, departmentName, address, phone, email]
              properties:
                foundationName: { $ref: '#/components/schemas/Bilingual' }
                departmentName: { $ref: '#/components/schemas/Bilingual' }
                address: { $ref: '#/components/schemas/Bilingual' }
                phone: { type: string }
                email: { type: string }
        meta: { $ref: '#/components/schemas/Meta' }
    NisabAddRequest:
      type: object
      additionalProperties: false
      required: [value, effectiveFrom]
      properties:
        value: { $ref: '#/components/schemas/Money' }
        effectiveFrom: { type: string, format: date }
        basisNote: { type: string, maxLength: 500 }
    NisabVersion:
      type: object
      required: [id, value, effectiveFrom, basisNote, setBy, createdAt, inForce, withdrawn]
      properties:
        id: { type: string, format: uuid }
        value: { $ref: '#/components/schemas/Money' }
        effectiveFrom: { type: string, format: date }
        basisNote: { type: [string, 'null'] }
        setBy: { $ref: '#/components/schemas/PersonRef' }
        createdAt: { type: string, format: date-time }
        inForce: { type: boolean, description: In force today (Dhaka date) }
        withdrawn:
          anyOf:
            - type: object
              required: [at, by, reason]
              properties:
                at: { type: string, format: date-time }
                by: { $ref: '#/components/schemas/PersonRef' }
                reason: { type: string }
            - { type: 'null' }
    PersonRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    NisabResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/NisabVersion' }
        meta: { $ref: '#/components/schemas/Meta' }
    NisabList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/NisabVersion' } }
        meta: { $ref: '#/components/schemas/ListMeta' }

    SmsProviderSetting:
      type: object
      additionalProperties: false
      required: [provider, senderId, enabled, endpoint]
      properties:
        provider:
          anyOf:
            - { type: string, pattern: '^[a-z][a-z0-9_]{1,39}$' }
            - { type: 'null' }
        senderId:
          anyOf:
            - { type: string, minLength: 1, maxLength: 20 }
            - { type: 'null' }
        enabled: { type: boolean }
        endpoint:
          anyOf:
            - { type: string, maxLength: 500 }
            - { type: 'null' }
    ChannelsResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [smtp, sms, otpDummy]
          properties:
            smtp:
              type: object
              required: [host, port, secure, from, loginSet]
              properties:
                host: { type: string }
                port: { type: integer }
                secure: { type: boolean }
                from: { type: string }
                loginSet: { type: boolean }
            sms:
              type: object
              required: [mode, keyPresent, config, updatedAt]
              properties:
                mode: { type: string, enum: [logging, dry_run] }
                keyPresent: { type: boolean }
                config: { $ref: '#/components/schemas/SmsProviderSetting' }
                updatedAt: { type: [string, 'null'], format: date-time }
            otpDummy: { type: boolean }
        meta: { $ref: '#/components/schemas/Meta' }
    StorageFigure:
      type: object
      required: [count, bytes]
      properties:
        count: { type: integer }
        bytes: { type: integer }
    SystemHealthResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [ready, checks, version, environment, otpDummy, auditPartitionsUntil, storage]
          properties:
            ready: { type: boolean }
            checks:
              type: object
              required: [database, storage, queue]
              properties:
                database: { type: string, enum: [up, down] }
                storage: { type: string, enum: [up, down] }
                queue: { type: string, enum: [up, down] }
            version: { type: string }
            environment: { type: string }
            otpDummy: { type: boolean }
            auditPartitionsUntil: { type: [string, 'null'], pattern: '^[0-9]{4}-[0-9]{2}$' }
            storage:
              description: Null when the database did not answer in time (the checks then show it down)
              type: [object, 'null']
              required: [total, byKind, byBucket, byMonth, measuredAt]
              properties:
                total: { $ref: '#/components/schemas/StorageFigure' }
                byBucket:
                  type: array
                  description: Each bucket now, and its growth in bytes since the nightly snapshot of at least 30 days ago (null until one exists)
                  items:
                    allOf:
                      - { $ref: '#/components/schemas/StorageFigure' }
                      - type: object
                        required: [bucket, monthGrowth]
                        properties:
                          bucket: { type: string }
                          monthGrowth: { type: [integer, 'null'] }
                byKind:
                  type: array
                  items:
                    allOf:
                      - { $ref: '#/components/schemas/StorageFigure' }
                      - { type: object, required: [kind], properties: { kind: { type: string } } }
                byMonth:
                  type: array
                  items:
                    allOf:
                      - { $ref: '#/components/schemas/StorageFigure' }
                      - { type: object, required: [month], properties: { month: { type: string } } }
                measuredAt: { type: string, format: date-time }
        meta: { $ref: '#/components/schemas/Meta' }
    AuditEntry:
      type: object
      required: [id, createdAt, action, entityType, entityId, actor, actorRole, reason, ip, deviceSessionId, old, new]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: [string, 'null'], format: uuid }
        actor:
          anyOf:
            - { $ref: '#/components/schemas/PersonRef' }
            - { type: 'null' }
        actorRole: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        ip: { type: [string, 'null'] }
        deviceSessionId: { type: [string, 'null'], format: uuid }
        old: { description: 'Snapshot before the change, secrets dropped' }
        new: { description: 'Snapshot after the change, secrets dropped' }
    AuditEntryList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        meta:
          allOf:
            - { $ref: '#/components/schemas/ListMeta' }
            - type: object
              required: [from, to]
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
    ActiveSession:
      type: object
      required: [id, person, deviceName, platform, appVersion, createdAt, lastSeenAt]
      properties:
        id: { type: string, format: uuid }
        person:
          type: object
          required: [id, name, kind, systemOwner]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            kind: { type: string, enum: [staff, volunteer] }
            systemOwner: { type: boolean }
        deviceName: { type: [string, 'null'] }
        platform: { type: [string, 'null'] }
        appVersion: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
    ActiveSessionList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ActiveSession' } }
        meta: { $ref: '#/components/schemas/ListMeta' }

    # ---------------- sync ----------------
    SyncRecord:
      type: object
      required: [clientUuid, kind, payload, clientCreatedAt]
      properties:
        clientUuid: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [application_draft, application_submit, application_update, field_update, activity, stock_receive, stock_reconcile, expense_claim, voucher_submit, consent_accept, edit_request, profile_contact_update] }
        target: { type: [string, 'null'], format: uuid }
        projectId: { $ref: '#/components/schemas/Uuid' }
        formVersionId: { $ref: '#/components/schemas/Uuid' }
        templateVersion: { type: integer }
        payload: { type: object, description: Validated with the shared schema of the record kind }
        clientCreatedAt: { type: string, format: date-time }
        clientUpdatedAt: { type: string, format: date-time }
        dependencies: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
    SyncBatchRequest:
      type: object
      required: [deviceTime, records]
      properties:
        deviceTime: { type: string, format: date-time }
        records: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/SyncRecord' } }
    SyncBatchResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [serverTime, results]
          properties:
            serverTime: { type: string, format: date-time }
            results: { type: array, items: { $ref: '#/components/schemas/RowResult' } }
        meta: { $ref: '#/components/schemas/Meta' }
    SnapshotResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [serverTime]
          properties:
            serverTime: { type: string, format: date-time }
            projects: { type: array, items: { $ref: '#/components/schemas/Project' } }
            formVersions: { type: array, items: { $ref: '#/components/schemas/FormVersion' } }
            applications: { type: array, items: { $ref: '#/components/schemas/ApplicationSummary' } }
            beneficiaries: { type: array, items: { $ref: '#/components/schemas/BeneficiarySummary' } }
            locationsVersion: { type: integer }
            removedIds: { type: array, items: { $ref: '#/components/schemas/Uuid' }, description: Records no longer in the caller's scope }
        meta: { $ref: '#/components/schemas/Meta' }

paths:
  # ======================= auth =======================
  /auth/invitations/check:
    post:
      tags: [auth]
      operationId: auth.invitation.check
      summary: The name and job ID of an open set-password link (404 unknown, 410 used or expired)
      description: >-
        DECISION_LOG D-097, BR-262. The token comes from the fragment of the link and travels in
        the body, never in a URL. 404 auth.invitation_invalid; 410 auth.invitation_expired.
      security: []
      x-permission: public
      x-scope: self
      x-audit: none
      x-idempotency: none
      x-rate-limit: public-form
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationCheckRequest' }
      responses:
        '200':
          description: The open link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationViewResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/invitations/accept:
    post:
      tags: [auth]
      operationId: auth.invitation.accept
      summary: Set the first password through the link; the account becomes active and logs in with the job ID
      description: >-
        BR-262. The password follows the rules of the role (12 characters for a global role); the
        link is used once.
      security: []
      x-permission: public
      x-scope: self
      x-audit: auth.invitation_accepted
      x-idempotency: none
      x-rate-limit: public-form
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationAcceptRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/register/start:
    post:
      tags: [auth]
      operationId: auth.registration.start
      summary: Start a registration draft of a kind; nothing is sent, each contact is verified on its own (D-090)
      security: []
      x-permission: public
      x-scope: self
      x-audit: auth.register_started
      x-idempotency: none
      x-rate-limit: registration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationStartRequest' }
      responses:
        '201':
          description: Draft started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationStartResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/register/otp/send:
    post:
      tags: [auth]
      operationId: auth.registration.resendOtp
      summary: Send an OTP to one contact of the draft; a changed address clears that channel (D-090; dummy code in dev/test)
      security: []
      x-permission: public
      x-scope: self
      x-audit: auth.otp_sent
      x-idempotency: none
      x-rate-limit: otp-request
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpSendRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/register/otp/verify:
    post:
      tags: [auth]
      operationId: auth.registration.verifyOtp
      summary: Verify the OTP of one channel; once both are verified returns the draft token once (BR-023, D-082, D-090); a contact of an existing account answers registration.account_exists only then (D-086)
      security: []
      x-permission: public
      x-scope: self
      x-audit: auth.otp_verified
      x-idempotency: none
      x-rate-limit: otp-verify
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
      responses:
        '200':
          description: The channel is verified; with both, the draft token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationVerifiedResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/register/photos/{slot}:
    parameters:
      - name: slot
        in: path
        required: true
        schema: { type: string, enum: [photo, nid_photo, nid_photo_back] }
    post:
      tags: [auth]
      operationId: auth.registration.uploadPhoto
      summary: Upload the photo or the NID photo of a verified draft (JPEG or PNG, at most 2 MB; metadata stripped; replaces the slot's earlier upload; D-087)
      security: []
      x-permission: public
      x-scope: self
      x-audit: file.uploaded
      x-idempotency: none
      x-rate-limit: public-form
      x-sensitive-fields: [volunteer.identity]
      parameters:
        - $ref: '#/components/parameters/RegistrationToken'
        - name: registrationId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: source
          in: query
          schema: { type: string, enum: [camera, gallery] }
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadedPhotoResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '413': { $ref: '#/components/responses/Unprocessable' }
        '415': { $ref: '#/components/responses/Unprocessable' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/register/submit:
    post:
      tags: [auth]
      operationId: auth.registration.submit
      summary: Submit the registration form of the draft's kind; the account is created in state pending, or a rejected never-approved account returns to pending (D-086)
      security: []
      x-permission: public
      x-scope: self
      x-audit: auth.registered
      x-idempotency: none
      x-rate-limit: registration
      x-sensitive-fields: [volunteer.identity, volunteer.bank]
      parameters:
        - $ref: '#/components/parameters/RegistrationToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationSubmitRequest' }
      responses:
        '201':
          description: Registered; awaiting approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/login:
    post:
      tags: [auth]
      operationId: auth.session.login
      summary: Log in with job ID, mobile or email and password; no OTP at login (O-05, D-097)
      security: []
      x-permission: public
      x-scope: self
      x-audit: auth.login
      x-idempotency: none
      x-rate-limit: login
      parameters:
        - $ref: '#/components/parameters/ClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Tokens issued; the refresh cookie is set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '423': { $ref: '#/components/responses/Locked' }
