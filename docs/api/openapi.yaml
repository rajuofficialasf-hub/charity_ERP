  # ======================= files =======================
  /upload-sessions:
    post:
      tags: [files]
      operationId: files.uploadSession.create
      summary: Start a resumable upload (256 KB parts, O-29, D-108); checks the record's scope, the kind, the declared size and type, and the open sessions (at most 20)
      x-permission: file.upload
      x-scope: project
      x-audit: none
      x-idempotency: clientUuid
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadSessionCreate' }
      responses:
        '200':
          description: 'The session an earlier create with the same clientUuid made (Idempotent-Replay: true)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSessionResponse' }
        '201':
          description: Upload session; the parts are sent to the part route
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSessionResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /upload-sessions/{uploadSessionId}:
    parameters:
      - $ref: '#/components/parameters/UploadSessionId'
    get:
      tags: [files]
      operationId: files.uploadSession.get
      summary: Upload session status for resuming after a dropped connection
      x-permission: file.upload
      x-scope: self
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: Session with the parts the server holds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSessionResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
  /upload-sessions/{uploadSessionId}/parts/{partNumber}:
    parameters:
      - $ref: '#/components/parameters/UploadSessionId'
      - $ref: '#/components/parameters/PartNumber'
    put:
      tags: [files]
      operationId: files.uploadSession.putPart
      summary: Store one part of at most 256 KB as raw bytes; a part sent again replaces nothing and answers the same (D-108)
      x-permission: file.upload
      x-scope: self
      x-audit: none
      x-idempotency: none
      x-rate-limit: upload
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 262144 }
      responses:
        '200':
          description: Session with the parts the server holds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSessionResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /upload-sessions/{uploadSessionId}/finalize:
    parameters:
      - $ref: '#/components/parameters/UploadSessionId'
    post:
      tags: [files]
      operationId: files.uploadSession.finalize
      summary: Complete the upload after the record's scope is checked again; the size, SHA-256 and the type by magic bytes are verified, an identical file in the project is refused; the file stays quarantined until the scan clears it (O-30)
      x-permission: file.upload
      x-scope: project
      x-audit: file.uploaded
      x-idempotency: clientUuid
      x-rate-limit: default
      responses:
        '200':
          description: 'The file an earlier finalize of the session made (Idempotent-Replay: true)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileInfoResponse' }
        '201':
          description: File created (virusScan pending)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileInfoResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /files/{fileId}:
    parameters:
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [files]
      operationId: files.file.get
      summary: File metadata, scan state and data-quality flags; the GPS position under file.location
      x-permission: entity
      x-scope: file
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      x-sensitive-fields: [file.location]
      responses:
        '200':
          description: File
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileInfoResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /files/{fileId}/content:
    parameters:
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [files]
      operationId: files.file.content
      summary: Stream a file or its thumbnail to its owner and to the officials whose scope reaches its record, once the scan cleared it; the NID photo only with the identity class (Cache-Control no-store, nosniff, the type from the stored bytes, inline only for images and PDF; D-074, D-087, D-108)
      x-permission: entity
      x-scope: file
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      parameters:
        - name: variant
          in: query
          required: false
          description: 'A thumbnail instead of the file: small (320 px) or medium (1,024 px), JPEG; 404 when the file has none'
          schema: { type: string, enum: [small, medium] }
      responses:
        '200':
          description: The file or its thumbnail (thumbnails are JPEG)
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '423': { $ref: '#/components/responses/Locked' }
  /files:
    get:
      tags: [files]
      operationId: files.file.list
      summary: The files of one record, for a caller whose scope reaches the record; as CSV (at most 5,000 rows, no free text) with format=csv; every export is audited, a list with NID photos as file.nid_viewed (D-108)
      x-permission: entity
      x-scope: file
      x-audit: none
      x-idempotency: none
      x-rate-limit: list
      parameters:
        - { name: entityType, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 40 } }
        - { name: entityId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [json, csv], default: json } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The files of the record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileListResponse' }
            text/csv:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ======================= notifications =======================
  /notifications:
    get:
      tags: [notifications]
      operationId: notifications.inbox.list
      summary: Own in-app notifications, newest first, with the unread count
      description: >-
        Each entry is rendered in the reader's language from the template version stored on it
        (D-099), so an edited template never changes old entries; an entry that cannot be rendered
        shows a plain fallback. It never names another person (R16); link is a fixed route of the
        PWA filled with the record id, and the record checks access again when opened.
      x-permission: notification.read_own
      x-scope: self
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: unread
          in: query
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /notifications/unread-count:
    get:
      tags: [notifications]
      operationId: notifications.inbox.unreadCount
      summary: The number of own unread notifications (the badge of the top bar)
      x-permission: notification.read_own
      x-scope: self
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [count]
                    properties:
                      count: { type: integer, minimum: 0 }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications/read:
    post:
      tags: [notifications]
      operationId: notifications.inbox.markRead
      summary: Mark own notifications as read, some or all; another user’s entry is not found
      description: >-
        Either ids (1 to 100 of the caller's own entries) or all: true. An id that is not the
        caller's answers 404 and nothing is marked.
      x-permission: notification.read_own
      x-scope: self
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkReadRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /me/language:
    put:
      tags: [auth]
      operationId: auth.me.language.set
      summary: >-
        Set own interface language (users.language, I18N 2); the PWA also keeps it in the css_locale
        cookie and device storage. Live with login in T1.7 (O-56)
      x-permission: authenticated
      x-scope: self
      x-audit: user.language_changed
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [language]
              properties:
                language: { type: string, enum: [bn, en] }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /me/attention:
    get:
      tags: [auth]
      operationId: auth.me.attention
      summary: What needs the caller now, counted per kind for their own work and the records their roles reach
      description: >-
        The "needs your attention" list of the My Work home (D-100): unread notifications (once the account is active), project
        consent waiting, corrections asked, an edit request answered in the last 7 days, and for
        officials the volunteer and official registrations and the edit requests waiting, draft
        projects, application windows ending within 7 days and open handovers. An item for
        officials' work is counted only when the caller holds its permission, in its scope, and
        links to the list that holds those records with the same filter where that list has one
        (project items also stay inside the scope of the project list); items with nothing waiting
        are left out. A pending registrant may call it.
      x-permission: authenticated
      x-scope: self
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: Attention items
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [kind, count, href]
                      properties:
                        kind:
                          type: string
                          enum: [unread_notifications, consent_pending, corrections, edit_answered, registrations_pending, staff_registrations_pending, edit_requests_pending, projects_draft, deadlines_soon, handovers_open, unlocks_to_fill, unlocks_to_verify, verifications_pending, media_referrals_new, media_review_waiting, media_sent_back, media_on_hold, sync_failed, sync_verifying, photos_pending]
                        count: { type: integer, minimum: 1 }
                        href: { type: string, description: A fixed route of the PWA }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/profile:
    get:
      tags: [auth]
      operationId: auth.me.profile
      summary: "An official's own profile: identity, workplace, contact and account"
      description: >-
        The caller's own record as an official (D-147, BR-288): name, job ID, designation, roles,
        affiliation and unit, program, division, supervisor, mobile, email, state, last login and
        photo. A volunteer has no official profile (404; their own profile is GET /volunteers/me).
      x-permission: authenticated
      x-scope: self
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: The official's own profile
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/OwnStaffProfile' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/projects-work:
    get:
      tags: [auth]
      operationId: auth.me.projectsWork
      summary: "An official's own projects by year with the figures of their work there"
      description: >-
        The projects the caller works on as an official (a PM through the program, an RPM through
        the areas, any other official through an active project access), cancelled ones left out,
        with the applications in their area and their own decisions (D-147, BR-291, BR-292). A
        volunteer gets 404.
      x-permission: authenticated
      x-scope: self
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: The official's projects and figures
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/ProjectsWork' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServerError' }
  /me/preferences:
    get:
      tags: [notifications]
      operationId: notifications.preferences.get
      summary: 'Own preferences: the email mode and digest time of an official; none for a volunteer'
      x-permission: notification.read_own
      x-scope: self
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreferencesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [notifications]
      operationId: notifications.preferences.update
      summary: Update own preferences; a volunteer has no email setting
      description: >-
        The email mode applies to digest-eligible events, which start in Phase 2; security and
        work-assigned emails are always sent at once (D-099). A volunteer answers 422 with the
        detail notification.no_email_for_volunteers.
      x-permission: notification.read_own
      x-scope: self
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreferencesUpdate' }
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreferencesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

