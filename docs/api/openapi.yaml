            schema: { $ref: '#/components/schemas/HandoverRequest' }
      responses:
        '200':
          description: Handover updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoverResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /users/{userId}/handover/complete:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [users]
      operationId: users.handover.complete
      summary: Complete the handover once every item is reassigned; deactivation stays the account-state change
      x-permission: user.handover
      x-scope: user
      x-audit: auth.handover_completed
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: Handover completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoverResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
