      x-permission: location.manage
      x-scope: global
      x-audit: location.update
      x-idempotency: none
      x-rate-limit: default
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /openapi.json:
    get:
      tags: [reference]
      operationId: reference.openapi.get
      summary: The OpenAPI document of every route, for the web app’s contract test
      security: []
      description: >-
        Built from the route registry: shapes only, never data. Open to everyone in development,
        tests and staging, where the web app's contract test reads it; in production it needs a
        signed-in session (no permission), so a stranger does not get the map of the routes
        (DECISION_LOG D-168).
      x-permission: public
      x-scope: system
      x-audit: none
      x-idempotency: none
      x-rate-limit: reference-read
      responses:
        '200':
          description: The OpenAPI 3.1 document of the running API
          content:
            application/json:
              schema: { type: object, required: [openapi, paths], properties: { openapi: { type: string }, paths: { type: object } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /public/settings:
    get:
      tags: [reference]
      operationId: reference.setting.public
      summary: The default language and the organisation details, for every visitor
      security: []
      description: >-
        No session needed (DECISION_LOG D-098). Carries only the default language and the
        organisation's public names, address and contact; never the thresholds or the SMS
        configuration.
      x-permission: public
      x-scope: system
      x-audit: none
      x-idempotency: none
      x-rate-limit: reference-read
      responses:
        '200':
          description: Public settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicSettingsResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /reference-lists/{listKey}:
    parameters:
      - $ref: '#/components/parameters/ListKey'
    get:
      tags: [reference]
      operationId: reference.list.get
      summary: Items of a system-wide reference list, inactive ones marked; not paginated
      x-permission: authenticated
      x-scope: system
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: Items in their order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [reference]
      operationId: reference.list.addItem
      summary: Add an item to the expense category or issue type list
      description: >-
        Only expense_category_default and issue_type_default are kept here (404 for any other
        list; DECISION_LOG D-098). The item goes to the end unless sortOrder is given. Errors 409
        reference.code_taken; 422 validation.list_code.
      x-permission: settings.manage
      x-scope: global
      x-audit: settings.change
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferenceItemCreate' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceItemResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /reference-lists/{listKey}/items/{code}:
    parameters:
      - $ref: '#/components/parameters/ListKey'
      - name: code
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z0-9_]{1,64}$' }
    patch:
      tags: [reference]
      operationId: reference.list.updateItem
      summary: Relabel, reorder, deactivate or activate an item; its code never changes
      description: >-
        Old rows keep their code and stay valid; nothing is deleted (DECISION_LOG D-098).
      x-permission: settings.manage
      x-scope: global
      x-audit: settings.change
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferenceItemUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceItemResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /name-variants:
    get:
      tags: [reference]
      operationId: reference.nameVariants.list
      summary: The groups of spelling variants of names, switched off ones included; not paginated
      description: >-
        Each group is one spelling the name keys use (canonical) and its other spellings
        (DECISION_LOG D-174, BR-301). The settings page reads it.
      x-permission: settings.manage
      x-scope: global
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: Every group, by its canonical
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NameVariantGroupList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [reference]
      operationId: reference.nameVariants.add
      summary: Add a group of spellings of one name; the name keys are computed again
      description: >-
        Each spelling is one word of Bengali or Latin letters with at least one letter, and not a
        title the key drops (422 validation.name_variant_one_word, validation.name_variant_letters,
        validation.name_variant_no_letter, validation.name_variant_title,
        validation.name_variant_repeated on the field). A spelling
        another group holds, switched on or off, is refused (422 validation.name_variant_taken),
        and so is one that would chain two groups: the canonical held as another group's spelling
        or another group's canonical given as a spelling (422 validation.name_variant_chain).
        Audited; raises the version of the list and queues the key job in the same transaction.
      x-permission: settings.manage
      x-scope: global
      x-audit: name_variants.change
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NameVariantGroupCreate' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NameVariantGroupResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /name-variants/{groupId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [reference]
      operationId: reference.nameVariants.update
      summary: Change a group's spellings, or switch it off or on; nothing is deleted
      description: >-
        canonical and variants together give the group's spellings as they are to be: a spelling
        left out stays stored, no longer active, and is free for another group. The rules of the
        addition apply (422). A group switched off keeps its spellings and the keys ignore it.
        Audited with the group before and after; when the change alters what the keys read, the
        version of the list is raised and the key job queued in the same transaction. If-Match
        carries the group's etag from the read; a group changed since that read answers 412
        conflict.stale_version, so a second save from the same read never drops the first.
      x-permission: settings.manage
      x-scope: global
      x-audit: name_variants.change
      x-idempotency: none
      x-rate-limit: default
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NameVariantGroupUpdate' }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NameVariantGroupResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /settings:
    get:
      tags: [reference]
      operationId: reference.setting.list
      summary: 'The settings page: organisation, language defaults and alert thresholds'
      description: >-
        Keys organisation, localization and monitoring.thresholds, each with its default while
        unchanged (updatedAt null). The SMS adapter configuration is read through the channels page;
        provider secrets are never returned (DECISION_LOG D-098).
      x-permission: settings.manage
      x-scope: global
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /settings/{settingKey}:
    parameters:
      - $ref: '#/components/parameters/SettingKey'
    patch:
      tags: [reference]
      operationId: reference.setting.update
      summary: Change a setting (validated per key; audited)
      description: >-
        The whole value of one of the keys of GET /settings, validated by the key's schema (422
        names the field as value.<field>); any other key is 404.
      x-permission: settings.manage
      x-scope: global
      x-audit: settings.change
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /nisab-versions:
    get:
      tags: [reference]
      operationId: reference.nisab.list
      summary: Nisab versions, newest first, the one in force today marked; not paginated (O-15)
      x-permission: authenticated
      x-scope: system
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: Nisab versions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NisabList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [reference]
      operationId: reference.nisab.add
      summary: Add a nisab version (PM or above); never edits old versions
      description: >-
        BR-211, DECISION_LOG D-098. The effective date is today (Dhaka) or later, at most one year
        ahead and after the latest version not withdrawn (422 with detail nisab.effective_date on
        effectiveFrom); the amount is above zero and at most 10000000 Taka.
      x-permission: nisab.set
      x-scope: global
      x-audit: nisab.change
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NisabAddRequest' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NisabResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /nisab-versions/in-force:
    get:
      tags: [reference]
      operationId: reference.nisab.inForce
      summary: The nisab version in force on a date (today when omitted)
      description: >-
        The latest version not withdrawn whose effective date is on or before the date; zakat
        verification stores it on the application (BR-211). 404 before the first version.
      x-permission: authenticated
      x-scope: system
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: The version in force
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NisabResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /nisab-versions/{nisabVersionId}/withdraw:
    parameters:
      - name: nisabVersionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [reference]
      operationId: reference.nisab.withdraw
      summary: Withdraw a nisab version that has not taken effect, with a reason
      description: >-
        DECISION_LOG D-098. The version stays listed as withdrawn and frees its date. Errors 409
        nisab.in_effect (it has taken effect), nisab.withdrawn (already withdrawn).
      x-permission: nisab.set
      x-scope: global
      x-audit: nisab.change
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Withdrawn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NisabResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ======================= admin =======================
  /admin/channels:
    get:
      tags: [admin]
      operationId: admin.channels.get
      summary: SMTP read-only, the SMS adapter configuration and the dummy OTP state
      description: >-
        DECISION_LOG D-098. SMTP comes from the server's environment (host, port, secure, sender,
        whether a login is set), never its password; sms.keyPresent says whether SMS_API_KEY is set,
        never the key; otpDummy true means the fixed development code is on (BD-44, BD-49).
      x-permission: provider.settings.manage
      x-scope: global
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: Channels
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/channels/sms:
    put:
      tags: [admin]
      operationId: admin.channels.setSms
      summary: Replace the SMS adapter configuration (the key stays in the environment)
      description: >-
        Stored as the sms.provider setting, audited as settings.change. The endpoint is an https
        address on a public host without user info or a query string (422
        validation.https_public_url); enabled needs a provider (422 validation.required on provider).
        Answers the channels view.
      x-permission: provider.settings.manage
      x-scope: global
      x-audit: settings.change
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SmsProviderSetting' }
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /admin/health:
    get:
      tags: [admin]
      operationId: admin.health.get
      summary: Database, storage and queue, version, dummy OTP, audit partitions and storage growth
      description: >-
        DECISION_LOG D-098, BD-46. Storage figures count the file records not deleted, in total, by
        kind and by Dhaka month for the last twelve months; they are reused for 60 seconds.
        auditPartitionsUntil is the last month that has an audit log partition.
      x-permission: system.health.view
      x-scope: global
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: System health
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemHealthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ======================= audit =======================
  /audit-log:
    get:
      tags: [audit]
      operationId: audit.entry.list
      summary: The audit log newest first, by actor, entity, action and a date range of at most a year
      description: >-
        For the Department Head and the Monitoring Team only for now (audit.view at global scope;
        DECISION_LOG D-098). from and to are Dhaka dates, inclusive; without them the last 30 days
        (the last 365 days when entityId is given, the drill-down of one entity);
        a range over 366 days or reversed is 422 with the detail audit.range_required on from. The
        drill-down of an entity is this list filtered by entityType and entityId. Keys that look like
        secrets (password, hash, token, secret, otp) are dropped from old and new. meta carries the
        range used.
      x-permission: audit.view
      x-scope: global
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: actorUserId
          in: query
          schema: { type: string, format: uuid }
        - name: entityType
          in: query
          schema: { type: string, pattern: '^[a-z_]{2,64}$' }
        - name: entityId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string, pattern: '^[a-z_.]{2,100}$' }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEntryList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServerError' }

  # ======================= sync =======================
  /sync/batch:
    post:
      tags: [sync]
      operationId: sync.batch.submit
      summary: Submit up to 50 offline text records; each is processed through its normal service with the originating user as actor; per-record results
      x-permission: sync.batch
      x-scope: self
      x-audit: sync.batch
      x-idempotency: header
      x-rate-limit: sync
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncBatchRequest' }
      responses:
        '200':
          description: Per-record results
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncBatchResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /locations/all:
    get:
      tags: [reference]
      operationId: reference.location.listAll
      summary: Every active location of the four levels in one answer, with an ETag, for the phone's offline copy
      security: []
      x-permission: public
      x-scope: system
      x-audit: none
      x-idempotency: none
      x-rate-limit: reference-read
      responses:
        '200':
          description: Every active location
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationList' }
        '304':
          description: Not modified
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /sync/snapshot:
    get:
      tags: [sync]
      operationId: sync.snapshot.get
      summary: Offline data set deltas since a timestamp, masked like every other read
      x-permission: sync.batch
      x-scope: self
      x-audit: none
      x-idempotency: none
      x-rate-limit: sync
      parameters:
        - $ref: '#/components/parameters/ClientVersion'
        - name: since
          in: query
          schema: { type: string, format: date-time }
          description: The nextSince of the last pull; absent on the first pull
        - name: afterId
          in: query
          schema: { type: string, format: uuid }
          description: The nextAfterId of the page before, while hasMore was on
      responses:
        '200':
          description: Snapshot delta
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotResponse' }
        '304':
          description: Not modified
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
