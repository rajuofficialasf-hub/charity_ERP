          required: [version, rules]
          properties:
            version: { type: integer, minimum: 0, description: 0 while no rules are saved }
            rules: { $ref: '#/components/schemas/ProjectRules' }
    ConsentRequest:
      type: object
      additionalProperties: false
      required: [rulesVersion, decision]
      properties:
        rulesVersion: { type: integer, minimum: 1, maximum: 9007199254740991 }
        decision: { type: string, enum: [accepted, refused] }
        parts:
          type: array
          maxItems: 4
          default: []
          description: The parts accepted, each once; an acceptance names every required part.
          items: { type: string, enum: [volunteer_duties, implementation_process, daee_duties, misconduct] }
    MyProject:
      type: object
      required: [projectId, code, year, name, status, applyFrom, applyTo, perVolunteerLimit, dawahEnabled, via, permissionSet, isPaid, consentStatus, rulesVersion, applicationsCounted, applicationsLeft, leadsTeam, identityRules]
      properties:
        projectId: { $ref: '#/components/schemas/Uuid' }
        code: { type: string }
        year: { type: integer }
        name: { $ref: '#/components/schemas/Bilingual' }
        status: { type: string, enum: [active, closing] }
        applyFrom: { type: [string, 'null'], format: date }
        applyTo: { type: [string, 'null'], format: date }
        perVolunteerLimit: { type: [integer, 'null'] }
        dawahEnabled: { type: boolean }
        via: { type: string, enum: [assignment, team], description: "Own assignment, or a membership of a main volunteer's team" }
        permissionSet: { type: [string, 'null'], description: Null for a team member }
        isPaid: { type: boolean }
        consentStatus: { type: string, enum: [pending, accepted], description: The project opens for work only when accepted }
        rulesVersion: { type: integer, minimum: 0 }
        applicationsCounted: { type: integer, minimum: 0, description: The main volunteer's count for a team member (BR-059) }
        applicationsLeft: { type: [integer, 'null'], minimum: 0 }
        leadsTeam: { type: boolean, description: An assigned General or দাঈ-স্বেচ্ছাসেবক volunteer may build a team }
        identityRules: { $ref: '#/components/schemas/IdentityRules' }
    IdentityRules:
      type: object
      description: >-
        What an application of the project asks about identity and contact, and what a second appearance of the same
        person or family does at review (D-172, BR-297). Read from the settings of the project's application form
        component; a project that says nothing answers required, required, hold, hold.
      required: [document, mobile, repeatPerson, repeatFamily]
      properties:
        document: { type: string, enum: [required, optional], description: The NID or the birth registration number }
        mobile: { type: string, enum: [required, optional], description: The mobile number }
        repeatPerson: { type: string, enum: [tell, hold], description: "The same person again: only told, or the approval held for a written reason" }
        repeatFamily: { type: string, enum: [tell, hold], description: "Someone of the same family again: only told, or held the same way" }
    MyProjectList:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/MyProject' } }
    MyProjectResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/MyProject' }
    MyProjectDetail:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/MyProject'
            - type: object
              required: [rules]
              properties:
                rules:
                  type: object
                  required: [version, parts]
                  properties:
                    version: { type: integer }
                    parts:
                      type: array
                      items:
                        type: object
                        required: [part, text]
                        properties:
                          part: { $ref: '#/components/schemas/RulesPart' }
                          text: { $ref: '#/components/schemas/Bilingual' }
    TeamMember:
      type: object
      required: [volunteerId, displayName, type, consentStatus, addedAt]
      properties:
        volunteerId: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string }
        type: { type: string }
        consentStatus: { type: string, enum: [pending, accepted] }
        addedAt: { type: string, format: date-time }
    TeamCandidate:
      type: object
      required: [volunteerId, displayName, type]
      properties:
        volunteerId: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string }
        type: { type: string }
    TeamResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [members, candidates]
          properties:
            members: { type: array, items: { $ref: '#/components/schemas/TeamMember' } }
            candidates: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/TeamCandidate' } }
    TeamAddRequest:
      type: object
      additionalProperties: false
      required: [memberVolunteerIds]
      properties:
        memberVolunteerIds:
          type: array
          minItems: 1
          maxItems: 50
          description: Each volunteer once.
          items: { type: string, format: uuid }
    CategoryRequest:
      type: object
      required: [comment]
      properties:
        category: { type: [string, 'null'], enum: [A, B, C, D, null] }
        inactiveFlag: { type: boolean }
        comment: { type: string, minLength: 3, description: Mandatory (BR-045) }
    BlocklistRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 1000 }
    BlocklistEntry:
      type: object
      required: [id, subjectType, subjectId, active, blockedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        subjectType: { type: string, enum: [volunteer, beneficiary] }
        subjectId: { $ref: '#/components/schemas/Uuid' }
        reason: { type: string, x-sensitive-class: blocklist.reason }
        active: { type: boolean }
        blockedAt: { type: string, format: date-time }
        releasedAt: { type: [string, 'null'], format: date-time }
    BlocklistResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/BlocklistEntry' }
        meta: { $ref: '#/components/schemas/Meta' }
    TransferRequest:
      type: object
      additionalProperties: false
      required: [fromVolunteerId, toVolunteerId, reason]
      properties:
        fromVolunteerId: { $ref: '#/components/schemas/Uuid' }
        toVolunteerId: { $ref: '#/components/schemas/Uuid' }
        applicationIds:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/Uuid' }
          description: Omit to transfer every application of the volunteer on the project
        reason: { type: string, minLength: 3, maxLength: 1000 }
        moveTeam: { type: boolean, default: false, description: "The old volunteer's team members on the project move under the new volunteer (volunteer.team.transfer, BR-050)" }
        assign: { type: boolean, default: false, description: The new volunteer is assigned to the project in the same request (volunteer.assign_project and the assignment's own checks) }
    TransferResult:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [batchId, moved, teamMoved, overLimit]
          properties:
            batchId: { $ref: '#/components/schemas/Uuid' }
            moved: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
            teamMoved: { type: integer }
            overLimit: { type: boolean, description: "The new volunteer now holds more applications than the project's limit; a warning, never a refusal (D-132)" }
        meta: { $ref: '#/components/schemas/Meta' }
    TransferCandidateList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
            required: [id, appNo, beneficiaryName, status]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              appNo: { type: [string, 'null'] }
              beneficiaryName:
                type: [string, 'null']
                description: The profile's name; while the entry waits for verification, the name typed on the application.
              status: { type: string }
        meta: { $ref: '#/components/schemas/Meta' }

    # ---------------- beneficiaries ----------------
    BenNo:
      type: integer
      minimum: 1
      description: The short BEN number of a profile, shown as BEN- and 7 digits (D-112); given once, never changed
    BeneficiarySummary:
      type: object
      description: One row of the beneficiary tab (O-67)
      required: [id, benNo, name, status, divisionId, districtId, upazilaId]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        benNo: { $ref: '#/components/schemas/BenNo' }
        name: { type: string }
        fatherOrHusbandName: { type: string, x-sensitive-class: beneficiary.profile_detail }
        classCode: { type: [string, 'null'], x-sensitive-class: beneficiary.profile_detail }
        status: { type: string }
        divisionId: { $ref: '#/components/schemas/Uuid' }
        districtId: { $ref: '#/components/schemas/Uuid' }
        upazilaId: { $ref: '#/components/schemas/Uuid' }
        unionId: { type: string, format: uuid, x-sensitive-class: beneficiary.address_detail }
        village: { type: string, x-sensitive-class: beneficiary.address_detail }
        mobile: { type: [string, 'null'], x-sensitive-class: beneficiary.contact, description: 'Null for a person without a number of their own, who is reached through the volunteer (D-172)' }
        hasDocument: { type: boolean, x-sensitive-class: beneficiary.nid, description: 'Whether an NID or a birth registration number is on file; never the number (D-172)' }
        isBlocked: { type: boolean, x-sensitive-class: beneficiary.care }
        photoFileId: { type: [string, 'null'], format: uuid, x-sensitive-class: beneficiary.profile_detail }
    BeneficiaryStatistics:
      type: object
      required: [total, assistedThisYear]
      properties:
        total: { type: integer, minimum: 0 }
        assistedThisYear: { type: integer, minimum: 0 }
        blocked: { type: integer, minimum: 0, x-sensitive-class: beneficiary.care }
        male: { type: integer, minimum: 0, x-sensitive-class: beneficiary.profile_detail }
        female: { type: integer, minimum: 0, x-sensitive-class: beneficiary.profile_detail }
    BeneficiaryStatisticsResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/BeneficiaryStatistics' }
        meta: { $ref: '#/components/schemas/Meta' }
    Beneficiary:
      type: object
      description: The 360° profile shell (SCR-045, O-67, D-094); each section an empty array when nothing exists
      required: [id, benNo, name, status, divisionId, districtId, upazilaId, projectsByYear, distributions, mergedInto, actions, corrections, merges]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        benNo: { $ref: '#/components/schemas/BenNo' }
        mergedInto:
          description: The kept profile a retired one leads to; null for a live profile
          type: [object, 'null']
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            benNo: { $ref: '#/components/schemas/BenNo' }
        actions:
          type: object
          description: What the caller may do to this person; each true only where the action's own permission and scope reach the person (the routes check again)
          properties:
            block: { type: boolean }
            unblock: { type: boolean }
            editContact: { type: boolean }
            requestCorrection: { type: boolean }
            decideCorrection: { type: boolean }
            proposeMerge: { type: boolean }
            merge: { type: boolean }
            revertMerge: { type: boolean }
        contactLog:
          type: array
          x-sensitive-class: beneficiary.contact
          description: The latest mobile and address changes (old and new value, who, when)
          items:
            type: object
            properties:
              field: { type: string }
              oldValue: { type: [string, 'null'] }
              newValue: { type: [string, 'null'] }
              by: { type: [string, 'null'], format: uuid }
              at: { type: string, format: date-time }
        corrections:
          type: array
          description: Correction requests, to every caller who holds either correction permission on the person; identity values null outside the NID scope
          items: { $ref: '#/components/schemas/CorrectionRequest' }
        blocks:
          type: array
          x-sensitive-class: blocklist.reason
          description: The block history with reasons, for officials only
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              reason: { type: string }
              active: { type: boolean }
              blockedAt: { type: string, format: date-time }
              releasedAt: { type: [string, 'null'], format: date-time }
              releaseReason: { type: [string, 'null'] }
        merges:
          type: array
          description: The merges this profile took part in, as the kept or the retired one
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              role: { type: string, enum: [kept, merged] }
              otherId: { type: [string, 'null'], format: uuid, description: null when the other profile lies outside the caller scope }
              otherBenNo: { $ref: '#/components/schemas/BenNo' }
              status: { type: string, enum: [merged, reverted] }
              mergedAt: { type: [string, 'null'], format: date-time }
              revertedAt: { type: [string, 'null'], format: date-time }
              leftBehind: { type: integer, minimum: 0 }
        files:
          type: array
          x-sensitive-class: beneficiary.profile_detail
          description: The files linked to the person (an NID photo only inside the NID scope)
          items:
            type: object
            properties:
              fileId: { $ref: '#/components/schemas/Uuid' }
              slot: { type: string }
              kind: { type: string }
        name: { type: string }
        fatherOrHusbandName: { type: string, x-sensitive-class: beneficiary.profile_detail }
        guardianRelationCode: { type: [string, 'null'], x-sensitive-class: beneficiary.profile_detail, description: "Whether fatherOrHusbandName is the father's or the husband's: a code of the reference list guardian_relation (father, husband), or null where it is not known; given by an application to a profile that holds none, never changed by one (D-174, BR-310)" }
        motherName: { type: [string, 'null'], x-sensitive-class: beneficiary.profile_detail }
        genderCode: { type: string, x-sensitive-class: beneficiary.profile_detail }
        ageYears: { type: [integer, 'null'], x-sensitive-class: beneficiary.profile_detail }
        classCode: { type: [string, 'null'], x-sensitive-class: beneficiary.profile_detail }
        classOtherText: { type: [string, 'null'], x-sensitive-class: beneficiary.profile_detail }
        occupationCode: { type: [string, 'null'], x-sensitive-class: beneficiary.profile_detail }
        status: { type: string }
        photoFileId: { type: [string, 'null'], format: uuid, x-sensitive-class: beneficiary.profile_detail }
        divisionId: { $ref: '#/components/schemas/Uuid' }
        districtId: { $ref: '#/components/schemas/Uuid' }
        upazilaId: { $ref: '#/components/schemas/Uuid' }
        unionId: { type: string, format: uuid, x-sensitive-class: beneficiary.address_detail }
        village: { type: string, x-sensitive-class: beneficiary.address_detail }
        postOffice: { type: [string, 'null'], x-sensitive-class: beneficiary.address_detail }
        postCode: { type: [string, 'null'], x-sensitive-class: beneficiary.address_detail }
        landmark: { type: [string, 'null'], x-sensitive-class: beneficiary.address_detail }
        mobile: { type: [string, 'null'], x-sensitive-class: beneficiary.contact, description: 'Null for a person without a number of their own, who is reached through the volunteer (D-172)' }
        mobileOwnerCode: { type: [string, 'null'], x-sensitive-class: beneficiary.contact, description: 'Whose number the mobile is: a code of the reference list mobile_owner (own, family, neighbour, other), or null when nothing says; never kept without a mobile (D-172, BR-300)' }
        mobileOwnerName: { type: [string, 'null'], x-sensitive-class: beneficiary.contact, description: "The name of the number's owner, kept only when that is someone else than the person (D-172, BR-300)" }
        hasDocument: { type: boolean, x-sensitive-class: beneficiary.nid, description: 'Whether an NID or a birth registration number is on file, told with the identity class wherever the profile lives; the numbers themselves stay inside the beneficiary.view_nid scope (D-172)' }
        familyMembers:
          type: array
          x-sensitive-class: beneficiary.contact
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              name: { type: string }
              relationshipCode: { type: [string, 'null'] }
              ageYears: { type: [integer, 'null'], x-sensitive-class: beneficiary.profile_detail }
        nid: { type: [string, 'null'], x-sensitive-class: beneficiary.nid, description: Only inside the beneficiary.view_nid scope }
        birthReg: { type: [string, 'null'], x-sensitive-class: beneficiary.nid, description: Only inside the beneficiary.view_nid scope }
        isBlocked: { type: boolean, x-sensitive-class: beneficiary.care }
        projectsByYear:
          type: array
          items:
            type: object
            properties:
              year: { type: integer }
              projects:
                type: array
                items:
                  type: object
                  properties:
                    id: { $ref: '#/components/schemas/Uuid' }
                    code: { type: string }
                    nameBn: { type: string }
                    nameEn: { type: string }
                    status: { type: string, description: The status of the beneficiary's application }
        applications:
          type: array
          x-sensitive-class: beneficiary.application_history
          description: Application history, latest 20 (for a project-scoped caller only its projects)
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              appNo: { type: [string, 'null'] }
              projectId: { $ref: '#/components/schemas/Uuid' }
              status: { type: string }
              submittedAt: { type: [string, 'null'], format: date-time }
              reviewedAt: { type: [string, 'null'], format: date-time }
              approvedAt: { type: [string, 'null'], format: date-time }
              throughMerge: { type: boolean, description: 'An application left on a retired profile at a merge, shown on the kept one' }
        distributions:
          type: array
          description: Distribution and implementation activities, latest 20
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              applicationId: { type: [string, 'null'], format: uuid }
              projectId: { $ref: '#/components/schemas/Uuid' }
              status: { type: string }
              doneAt: { type: string, format: date-time }
        dawah:
          type: object
          x-sensitive-class: beneficiary.care
          description: Class attendance, learning progress and exams, latest 20 each
        followUps:
          type: object
          x-sensitive-class: beneficiary.care
          description: Calls and follow-up evaluations, latest 20 each
        activities:
          type: array
          x-sensitive-class: beneficiary.care
          description: Activity history, latest 20
          items: { type: object }
        media:
          type: array
          description: The published and done media works about the person (D-101 (8)), for everyone who reads the profile
          items: { $ref: '#/components/schemas/MediaPublishedWork' }
    BeneficiaryResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Beneficiary' }
        meta: { $ref: '#/components/schemas/Meta' }
    BeneficiaryList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/BeneficiarySummary' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    LookupRequest:
      type: object
      additionalProperties: false
      description: Exactly one of nid and birthReg (422 `beneficiary.identity_missing` without one, `validation.malformed` with both)
      required: [projectId]
      properties:
        nid: { type: string, pattern: '^([0-9]{10}|[0-9]{13}|[0-9]{17})$' }
        birthReg: { type: string, pattern: '^[0-9]{17}$' }
        projectId: { $ref: '#/components/schemas/Uuid' }
    LookupResult:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [found]
          properties:
            found: { type: boolean }
            blocked: { type: boolean, description: true means a new application is refused (BR-010); the answer then carries nothing else }
            alreadyAppliedInProject: { type: boolean }
            mobileIsCallerOwn:
              type: boolean
              description: The profile's mobile is the caller's own, so the form asks for another (BD-03)
            mergedInto:
              description: The number led to a retired profile; the auto-fill is the kept one's
              type: object
              required: [benNo]
              properties:
                benNo: { $ref: '#/components/schemas/BenNo' }
            autofill:
              description: The auto-fill fields (BR-005); locked fields are marked
              type: object
              required:
                [beneficiaryId, benNo, name, fatherOrHusbandName, mobile, genderCode, divisionId, districtId, upazilaId, unionId, village, lockedFields]
              properties:
                beneficiaryId: { $ref: '#/components/schemas/Uuid' }
                benNo: { $ref: '#/components/schemas/BenNo' }
                name: { type: string }
                fatherOrHusbandName: { type: string }
                motherName: { type: [string, 'null'] }
                mobile: { type: [string, 'null'], description: 'Null for a person without a number of their own' }
                genderCode: { type: string }
                dob: { type: [string, 'null'], format: date }
                ageYears: { type: [integer, 'null'] }
                divisionId: { $ref: '#/components/schemas/Uuid' }
                districtId: { $ref: '#/components/schemas/Uuid' }
                upazilaId: { $ref: '#/components/schemas/Uuid' }
                unionId: { $ref: '#/components/schemas/Uuid' }
                village: { type: string }
                postOffice: { type: [string, 'null'] }
                postCode: { type: [string, 'null'] }
                landmark: { type: [string, 'null'] }
                members14Plus: { type: [integer, 'null'] }
                childrenUnder14: { type: [integer, 'null'] }
                lockedFields:
                  type: array
                  items: { type: string, enum: [name, father_or_husband_name, nid, birth_reg] }
        meta: { $ref: '#/components/schemas/Meta' }
    FamilyMember:
      type: object
      required: [id, name, isEarner, active]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        relationshipCode: { type: [string, 'null'] }
        genderCode: { type: [string, 'null'] }
        dob: { type: [string, 'null'], format: date }
        ageYears: { type: [integer, 'null'] }
        occupationCode: { type: [string, 'null'] }
        monthlyIncome: { $ref: '#/components/schemas/Money' }
        isEarner: { type: boolean }
        active: { type: boolean }
    FamilyMemberList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/FamilyMember' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    CorrectionRequestCreate:
      type: object
      additionalProperties: false
      description: A new NID has 10, 13 or 17 digits and a new birth registration 17 (validation.nid_format, validation.birth_reg_format)
      required: [field, newValue, reason]
      properties:
        field: { type: string, enum: [name, father_or_husband_name, nid, birth_reg] }
        newValue: { type: string, minLength: 1, maxLength: 200 }
        reason: { type: string, minLength: 3, maxLength: 1000 }
    CorrectionRequest:
      type: object
      description: The values of an identity number are null outside the caller's beneficiary.view_nid scope
      required: [id, beneficiaryId, field, oldValue, newValue, reason, status, requestedBy, requestedAt, decidedBy, decidedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        beneficiaryId: { $ref: '#/components/schemas/Uuid' }
        field: { type: string, enum: [name, father_or_husband_name, nid, birth_reg] }
        oldValue: { type: [string, 'null'] }
        newValue: { type: [string, 'null'] }
        reason: { type: string }
        status: { type: string, enum: [submitted, approved, rejected] }
        requestedBy: { $ref: '#/components/schemas/Uuid' }
        requestedAt: { type: string, format: date-time }
        decidedBy: { type: [string, 'null'], format: uuid }
        decidedAt: { type: [string, 'null'], format: date-time }
    ContactUpdate:
      type: object
      additionalProperties: false
      description: At least one field; divisionId, districtId, upazilaId and unionId together; name, fatherOrHusbandName, nid and birthReg are refused with beneficiary.locked_field
      properties:
        mobile: { type: string, pattern: '^01[3-9][0-9]{8}$' }
        divisionId: { $ref: '#/components/schemas/Uuid' }
        districtId: { $ref: '#/components/schemas/Uuid' }
        upazilaId: { $ref: '#/components/schemas/Uuid' }
        unionId: { $ref: '#/components/schemas/Uuid' }
        village: { type: string, minLength: 1, maxLength: 200 }
        postOffice: { type: string, minLength: 1, maxLength: 100 }
        postCode: { type: string, pattern: '^[0-9]{4}$' }
        landmark: { type: string, minLength: 1, maxLength: 200 }
        name: { not: {} }
        fatherOrHusbandName: { not: {} }
        nid: { not: {} }
        birthReg: { not: {} }
    ContactResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [id, mobile, mobileOwnerCode, mobileOwnerName, divisionId, districtId, upazilaId, unionId, village, postOffice, postCode, landmark, warnings]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            mobile: { type: [string, 'null'], description: 'Null for a person without a number of their own' }
            mobileOwnerCode: { type: [string, 'null'], description: 'Whose number the mobile is; emptied when the edit changes the number, since the request names no owner (BR-300)' }
            mobileOwnerName: { type: [string, 'null'], description: "The name of the number's owner; emptied with the owner" }
            divisionId: { $ref: '#/components/schemas/Uuid' }
            districtId: { $ref: '#/components/schemas/Uuid' }
            upazilaId: { $ref: '#/components/schemas/Uuid' }
            unionId: { $ref: '#/components/schemas/Uuid' }
            village: { type: string }
            postOffice: { type: [string, 'null'] }
            postCode: { type: [string, 'null'] }
            landmark: { type: [string, 'null'] }
            warnings:
              type: array
              items:
                type: object
                required: [code, count, benNos]
                properties:
                  code: { type: string, enum: [beneficiary.mobile_shared] }
                  count: { type: integer, minimum: 1 }
                  benNos: { type: array, items: { type: string } }
        meta: { $ref: '#/components/schemas/Meta' }
    CorrectionRequestResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/CorrectionRequest' }
        meta: { $ref: '#/components/schemas/Meta' }
    MergeCandidate:
      type: object
      description: The pair with the lower id first; every rule the pair meets
      required: [beneficiaryId, otherBeneficiaryId, benNo, otherBenNo, name, otherName, matchedOn]
      properties:
        beneficiaryId: { $ref: '#/components/schemas/Uuid' }
        otherBeneficiaryId: { $ref: '#/components/schemas/Uuid' }
        benNo: { type: string }
        otherBenNo: { type: string }
        name: { type: string }
        otherName: { type: string }
        matchedOn:
          type: array
          items: { type: string, enum: [name_dob_union, name_father_mobile, same_mobile] }
    MergeDismissalRequest:
      type: object
      additionalProperties: false
      required: [beneficiaryId, otherBeneficiaryId, reason]
      properties:
        beneficiaryId: { $ref: '#/components/schemas/Uuid' }
        otherBeneficiaryId: { $ref: '#/components/schemas/Uuid' }
        reason: { type: string, minLength: 3, maxLength: 1000 }
    MergeDismissal:
      type: object
      required: [id, beneficiaryId, otherBeneficiaryId, benNo, otherBenNo, name, otherName, reason, dismissedBy, dismissedAt, liftedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        beneficiaryId: { $ref: '#/components/schemas/Uuid' }
        otherBeneficiaryId: { $ref: '#/components/schemas/Uuid' }
        benNo: { type: string }
        otherBenNo: { type: string }
        name: { type: string }
        otherName: { type: string }
        reason: { type: string }
        dismissedBy: { $ref: '#/components/schemas/Uuid' }
        dismissedAt: { type: string, format: date-time }
        liftedAt: { type: [string, 'null'], format: date-time }
    MergeDismissalResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/MergeDismissal' }
        meta: { $ref: '#/components/schemas/Meta' }
    MergeCandidateList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/MergeCandidate' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    MergeRequest:
      type: object
      additionalProperties: false
      required: [keptId, mergedId, reason]
      properties:
        keptId: { $ref: '#/components/schemas/Uuid' }
        mergedId: { $ref: '#/components/schemas/Uuid' }
        reason: { type: string, minLength: 3, maxLength: 1000 }
    MergeExecuteRequest:
      type: object
      additionalProperties: false
      description: keptId, when given, must be one of the pair; the other profile is retired
      properties:
        keptId: { $ref: '#/components/schemas/Uuid' }
    Merge:
      type: object
      required: [id, keptId, mergedId, keptBenNo, mergedBenNo, keptName, mergedName, status, reason, proposedBy, proposedAt, mergedBy, mergedAt, revertedBy, revertedAt, moved, leftBehind]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        keptId: { $ref: '#/components/schemas/Uuid' }
        mergedId: { $ref: '#/components/schemas/Uuid' }
        keptBenNo: { type: string }
        mergedBenNo: { type: string }
        keptName: { type: string }
        mergedName: { type: string }
        status: { type: string, enum: [proposed, merged, reverted] }
        reason: { type: string }
        proposedBy: { $ref: '#/components/schemas/Uuid' }
        proposedAt: { type: string, format: date-time }
        mergedBy: { type: [string, 'null'], format: uuid }
        mergedAt: { type: [string, 'null'], format: date-time }
        revertedBy: { type: [string, 'null'], format: uuid }
        revertedAt: { type: [string, 'null'], format: date-time }
        moved:
          type: object
          description: How many rows moved per kind (the ids stay in the snapshot, never returned)
          additionalProperties: { type: integer, minimum: 0 }
        leftBehind: { type: integer, minimum: 0, description: Applications past pending left on the retired profile }
    MergeResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Merge' }
        meta: { $ref: '#/components/schemas/Meta' }
    BeneficiaryStatusRequest:
      type: object
      required: [status, reason]
      properties:
        status: { type: string, enum: [active, deceased, relocated] }
        reason: { type: string, minLength: 3 }
    MediaConsentRequest:
      type: object
      required: [granted, channels]
      properties:
        granted: { type: boolean }
        channels: { type: array, items: { type: string }, description: reference list consent_channel (O-17) }
        evidenceFileId: { $ref: '#/components/schemas/Uuid' }
    MediaConsent:
      type: [object, 'null']
      properties:
        granted: { type: boolean }
        channels: { type: array, items: { type: string } }
        recordedAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
    MediaConsentResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/MediaConsent' }
        meta: { $ref: '#/components/schemas/Meta' }

    # ---------------- programs and projects ----------------
    BoundedLabel:
      type: object
      description: A bilingual configuration label of at most 200 characters per language
      additionalProperties: false
      required: [bn, en]
      properties:
        bn: { type: string, maxLength: 200 }
        en: { type: string, maxLength: 200 }
    ProgramCreate:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: { type: string, pattern: '^[A-Z]{2,12}$' }
        name: { $ref: '#/components/schemas/BoundedLabel' }
        pmUserId: { type: string, format: uuid }
    ProgramUpdate:
      type: object
      description: At least one of name and active
      additionalProperties: false
      properties:
        name: { $ref: '#/components/schemas/BoundedLabel' }
        active: { type: boolean }
    Program:
      type: object
      required: [id, code, name, pmUserId, pmName, active]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string }
        name: { $ref: '#/components/schemas/Bilingual' }
        pmUserId: { type: [string, 'null'], format: uuid }
        pmName: { type: [string, 'null'] }
        active: { type: boolean }
    ProgramResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Program' }
        meta: { $ref: '#/components/schemas/Meta' }
    ProgramList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Program' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    ProjectCreate:
      type: object
      additionalProperties: false
      required: [programId, code, year, name, source]
      properties:
        programId: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z]{2,8}$', description: Unique project code (O-03) }
        year: { type: integer, minimum: 2020, maximum: 2100 }
        name: { $ref: '#/components/schemas/BoundedLabel' }
        description: { type: string, maxLength: 2000 }
        source:
          description: >-
            Where the project starts (BD-10, D-096): a workflow's starting setup, an active master
            template, or a copy of a project the caller may view. A template or a copy brings the
            components with their settings, the syllabus and the rules texts, and nothing else.
          oneOf:
            - type: object
              additionalProperties: false
              required: [kind, workflowKey]
              properties:
                kind: { type: string, const: workflow }
                workflowKey: { type: string, enum: [distribution, construction, advance_voucher, implementation_evidence, open_application_visit, qurbani] }
            - type: object
              additionalProperties: false
              required: [kind, templateId]
              properties:
                kind: { type: string, const: template }
                templateId: { type: string, format: uuid }
            - type: object
              additionalProperties: false
              required: [kind, projectId]
              properties:
                kind: { type: string, const: copy }
                projectId: { type: string, format: uuid }
    ProjectUpdate:
      type: object
      description: Setup fields of the project row; at least one. Which may change depends on the project state.
      additionalProperties: false
      properties:
        name: { $ref: '#/components/schemas/BoundedLabel' }
        description:
          anyOf:
            - { type: string, maxLength: 2000 }
            - { type: 'null' }
        programId: { type: string, format: uuid }
        year: { type: integer, minimum: 2020, maximum: 2100 }
        workflowKey:
          type: string
          enum:
            [
              distribution,
              construction,
              advance_voucher,
              implementation_evidence,
              open_application_visit,
              qurbani,
            ]
        applyFrom:
          anyOf:
            - { type: string, format: date }
            - { type: 'null' }
        applyTo:
          anyOf:
            - { type: string, format: date }
            - { type: 'null' }
        perVolunteerLimit:
          anyOf:
            - { type: integer, minimum: 1, maximum: 100000 }
            - { type: 'null' }
        costPerBeneficiary:
          anyOf:
            - { type: string, pattern: '^\d{1,12}(\.\d{1,2})?$' }
            - { type: 'null' }
        targetBeneficiaries:
          anyOf:
            - { type: integer, minimum: 1, maximum: 10000000 }
            - { type: 'null' }
    Project:
      type: object
      description: The official view; a volunteer receives only id, code, year, name, status, workflowKey, the window, the limit and dawahEnabled
      required: [id, code, year, name, status, workflowKey, applyFrom, applyTo, perVolunteerLimit, dawahEnabled]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string }
        year: { type: integer }
        name: { $ref: '#/components/schemas/Bilingual' }
        status: { type: string, enum: [draft, active, closing, closed, cancelled] }
        workflowKey: { type: string }
        applyFrom: { type: [string, 'null'], format: date }
        applyTo: { type: [string, 'null'], format: date }
        perVolunteerLimit: { type: [integer, 'null'] }
        dawahEnabled: { type: boolean }
        programId: { $ref: '#/components/schemas/Uuid' }
        description: { type: [string, 'null'] }
        workflowVersion: { type: integer }
        costPerBeneficiary: { type: [string, 'null'] }
        targetBeneficiaries: { type: [integer, 'null'] }
        budgetPlanned: { type: [string, 'null'] }
        activatedAt: { type: [string, 'null'], format: date-time }
        closedAt: { type: [string, 'null'], format: date-time }
        cancelledAt: { type: [string, 'null'], format: date-time }
    ProjectResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Project' }
        meta: { $ref: '#/components/schemas/Meta' }
    ProjectList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Project' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    ExtendDeadlineRequest:
      type: object
      additionalProperties: false
      required: [newApplyTo, reason]
      properties:
        newApplyTo: { type: string, format: date }
        reason: { type: string, minLength: 3, maxLength: 1000 }
    Component:
      type: object
      description: A volunteer receives only the enabled components, with the settings of the photo rule only
      required: [componentKey, enabled]
      properties:
        componentKey: { type: string }
        enabled: { type: boolean }
        settings: { $ref: '../database/json-schemas/project-component-settings.schema.json' }
        etag: { type: string, description: "The component's own version, for If-Match" }
    ComponentPatch:
      type: object
      description: At least one of enabled and settings; settings are checked against the component's schema
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        settings: { type: object, additionalProperties: {}, propertyNames: { type: string } }
    ComponentResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Component' }
        meta: { $ref: '#/components/schemas/Meta' }
    ComponentList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Component' } }
        meta: { $ref: '#/components/schemas/Meta' }
    Area:
      type: object
      required: [id, locationId, level, locationName, rpmUserId, rpmName]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        locationId: { $ref: '#/components/schemas/Uuid' }
        level: { type: string, enum: [division, district] }
        locationName: { $ref: '#/components/schemas/Bilingual' }
        rpmUserId: { $ref: '#/components/schemas/Uuid' }
        rpmName: { type: string }
    AreaCreate:
      type: object
      additionalProperties: false
      required: [locationId, rpmUserId]
      properties:
        locationId: { type: string, format: uuid }
        rpmUserId: { type: string, format: uuid }
    AreaList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Area' } }
        meta: { $ref: '#/components/schemas/Meta' }
    StaffAssignmentCreate:
      type: object
      additionalProperties: false
      required: [userId, roleKey]
      properties:
        userId: { type: string, format: uuid }
        roleKey: { type: string, enum: [project_executive, official_daee] }
        areaLocationId: { type: string, format: uuid }
        canView: { type: boolean, default: true }
        canEdit: { type: boolean, default: false }
        canDelete: { type: boolean, default: false }
    StaffAssignment:
      type: object
      required: [id, userId, displayName, roleKey, areaLocationId, canView, canEdit, canDelete, extraPermissions, endedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        userId: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string }
        roleKey: { type: string }
        areaLocationId: { type: [string, 'null'], format: uuid }
        canView: { type: boolean }
        canEdit: { type: boolean }
        canDelete: { type: boolean }
        extraPermissions: { type: array, items: { type: string } }
        endedAt: { type: [string, 'null'], format: date-time }
    Candidate:
      type: object
      required: [id, displayName, designation]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string }
        designation: { type: [string, 'null'] }
    CandidateList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Candidate' } }
        meta: { $ref: '#/components/schemas/Meta' }
    StaffAssignmentList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/StaffAssignment' } }
        meta: { $ref: '#/components/schemas/Meta' }
    SyllabusTopic:
      type: object
      required: [id, title]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { $ref: '#/components/schemas/Bilingual' }
    SyllabusList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/SyllabusTopic' } }
        meta: { $ref: '#/components/schemas/Meta' }
    SyllabusReplace:
      type: object
      additionalProperties: false
      required: [topics]
      properties:
        topics:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [title]
            properties:
              id: { type: string, format: uuid }
              title: { $ref: '#/components/schemas/BoundedLabel' }
    FundSource:
      type: object
      required: [source, label, amount]
      properties:
        source: { type: string, enum: [zakat, sadaqah, general, donor] }
        label: { type: [string, 'null'], description: The donor's name for a specific donor }
        amount: { $ref: '#/components/schemas/Money' }
    FundSourceReplace:
      type: object
      additionalProperties: false
      required: [fundSources]
      properties:
        costPerBeneficiary: { type: string, pattern: '^\d{1,12}(\.\d{1,2})?$' }
        targetBeneficiaries: { type: integer, minimum: 1, maximum: 10000000 }
        fundSources:
          type: array
          maxItems: 10
          items:
            type: object
            description: A specific donor (source donor) needs its label
            additionalProperties: false
            required: [source, amount]
            properties:
              source: { type: string, enum: [zakat, sadaqah, general, donor] }
              label: { type: string, minLength: 1, maxLength: 200 }
              amount: { type: string, pattern: '^\d{1,12}(\.\d{1,2})?$' }
    QuotaProgress:
      type: object
      required: [level, locationId, locationName, target, received, approved, full]
      properties:
        level: { type: string, enum: [district, union] }
        locationId: { $ref: '#/components/schemas/Uuid' }
        locationName: { $ref: '#/components/schemas/Bilingual' }
        target: { type: integer, minimum: 0 }
        received: { type: integer, minimum: 0, description: 'Applications of the area that reached the office (not draft, deleted or waiting for verification)' }
        approved: { type: integer, minimum: 0, description: Applications of the area with an approval }
        full: { type: boolean, description: 'The approvals reached the target; an approval there asks for a comment, it is never refused (D-132)' }
    QuotaList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/QuotaProgress' } }
        meta: { $ref: '#/components/schemas/Meta' }
    QuotaReplace:
      type: object
      additionalProperties: false
      required: [quotas]
      properties:
        quotas:
          type: array
          maxItems: 500
          description: The targets replacing the stored list, each place at most once; an empty list takes every quota away
          items:
            type: object
            additionalProperties: false
            required: [level, locationId, target]
            properties:
              level: { type: string, enum: [district, union] }
              locationId: { $ref: '#/components/schemas/Uuid' }
              target: { type: integer, minimum: 1, maximum: 1000000 }
    FundSourceList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/FundSource' } }
        meta: { $ref: '#/components/schemas/Meta' }
    Template:
      type: object
      required: [id, name, description, workflowKey, active, version, sourceProjectId, updatedAt, updatedByName]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { $ref: '#/components/schemas/Bilingual' }
        description: { type: [string, 'null'] }
        workflowKey: { type: string }
        active: { type: boolean }
        version: { type: integer, minimum: 1, description: Raised each time a project's setup replaces the contents }
        sourceProjectId: { type: [string, 'null'], format: uuid }
        updatedAt: { type: string, format: date-time }
        updatedByName: { type: [string, 'null'] }
    TemplateDetail:
      allOf:
        - $ref: '#/components/schemas/Template'
        - type: object
          required: [definition]
          properties:
            definition: { type: object, description: 'The copied parts: workflowKey, components with settings, syllabus, rules' }
    TemplateResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Template' }
    TemplateDetailResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/TemplateDetail' }
    TemplateList:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Template' } }
    SaveAsTemplateRequest:
      description: A new template with its name, or the replacement of an existing template's contents.
      anyOf:
        - type: object
          additionalProperties: false
          required: [name]
          properties:
            name: { $ref: '#/components/schemas/BoundedLabel' }
            description: { type: string, maxLength: 2000 }
        - type: object
          additionalProperties: false
          required: [templateId]
          properties:
            templateId: { type: string, format: uuid }
    TemplateUpdate:
      type: object
      additionalProperties: false
      description: At least one field.
      properties:
        name: { $ref: '#/components/schemas/BoundedLabel' }
        description:
          anyOf:
            - { type: string, maxLength: 2000 }
            - { type: 'null' }
        active: { type: boolean }

    # ---------------- forms ----------------
    Form:
      type: object
      required: [id, projectId, key, title, kind, sourceFormId, sourceVersionNo, newerVersionNo]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        projectId: { $ref: '#/components/schemas/Uuid' }
        key: { type: string }
        title: { $ref: '#/components/schemas/Bilingual' }
        kind: { type: string, enum: [beneficiary_application, other], description: "What the form is for; the identity questions and the public link apply to a beneficiary application only (D-126, D-129)" }
        publishedVersionId: { type: [string, 'null'], format: uuid }
        draftVersionId: { type: [string, 'null'], format: uuid, description: The one open draft (T2.3) }
        sourceFormId: { type: [string, 'null'], format: uuid, description: The ready form this form was placed from (D-129) }
        sourceVersionNo: { type: [integer, 'null'], description: The ready form's version this form holds now }
        newerVersionNo: { type: [integer, 'null'], description: "The ready form's published version when it is newer than the one placed; the PM takes it on demand" }
    ReadyForm:
      type: object
      required: [id, key, kind, title, publishedVersionId, publishedVersionNo, draftVersionId]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        key: { type: string }
        kind: { type: string, enum: [beneficiary_application, other] }
        title: { $ref: '#/components/schemas/Bilingual' }
        publishedVersionId: { type: [string, 'null'], format: uuid }
        publishedVersionNo: { type: [integer, 'null'] }
        draftVersionId: { type: [string, 'null'], format: uuid, description: The open draft; shown to the builders only }
    ReadyFormList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ReadyForm' } }
        meta: { $ref: '#/components/schemas/Meta' }
    ReadyFormResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/ReadyForm' }
        meta: { $ref: '#/components/schemas/Meta' }
    ReadyFormCreate:
      type: object
      additionalProperties: false
      required: [key, title, kind, source]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_]*$', maxLength: 40, description: Unique among the forms outside the projects }
        title: { $ref: '#/components/schemas/Bilingual' }
        kind: { type: string, enum: [beneficiary_application, other] }
        source:
          description: An empty form (one section), or a copy of another ready form's published version
          oneOf:
            - type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind: { type: string, const: blank }
            - type: object
              additionalProperties: false
              required: [kind, formId]
              properties:
                kind: { type: string, const: copy }
                formId: { $ref: '#/components/schemas/Uuid' }
    FormPlace:
      type: object
      additionalProperties: false
      required: [readyFormId]
      properties:
        readyFormId: { $ref: '#/components/schemas/Uuid' }
        key: { type: string, pattern: '^[a-z][a-z0-9_]*$', maxLength: 40, description: The key on the project; the ready form's key when absent }
    FormList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Form' } }
        meta: { $ref: '#/components/schemas/Meta' }
    FormResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Form' }
        meta: { $ref: '#/components/schemas/Meta' }
    FormCreate:
      type: object
      additionalProperties: false
      required: [key, title, source]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_]*$', maxLength: 40, description: The application type of the form; `default` for the one form of a project }
        title: { $ref: '#/components/schemas/Bilingual' }
        source:
          description: Where the first draft comes from
          oneOf:
            - type: object
              additionalProperties: false
              required: [kind, templateKey]
              properties:
                kind: { type: string, const: template }
                templateKey: { type: string, minLength: 1, maxLength: 80, description: A form template of the library (the seeded appendix খ forms) }
            - type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind: { type: string, const: blank }
            - type: object
              additionalProperties: false
              required: [kind, formId]
              properties:
                kind: { type: string, const: copy }
                formId: { $ref: '#/components/schemas/Uuid' }
    FormLibrary:
      type: object
      required: [libraryFormId, sections, fields]
      properties:
        libraryFormId: { $ref: '#/components/schemas/Uuid', description: The library form the builders edit; its published version is this library (D-129) }
        sections:
          type: array
          items:
            type: object
            required: [key, title, defaultVisibility, fieldKeys]
            properties:
              key: { type: string }
              title: { $ref: '#/components/schemas/Bilingual' }
              defaultVisibility: { type: string, enum: [volunteer, official_only] }
              fieldKeys: { type: array, items: { type: string } }
        fields:
          type: array
          items:
            type: object
            required: [key, type, label, standardColumn, defaultSettings, formFields]
            properties:
              key: { type: string }
              type: { type: string }
              label: { $ref: '#/components/schemas/Bilingual' }
              standardColumn: { type: [string, 'null'] }
              defaultSettings: { type: object }
              formFields:
                type: array
                description: The field as the builder places it in a form (options from the reference list, the calculation, a repeat group's members after it)
                items: { $ref: '#/components/schemas/FormField' }
        templates:
          type: array
          description: Kept for the response's shape; empty since the library is a form (D-127)
          items:
            type: object
            required: [key, name, projectType]
            properties:
              key: { type: string }
              name: { $ref: '#/components/schemas/Bilingual' }
              projectType: { type: string }
    FormLibraryResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/FormLibrary' }
        meta: { $ref: '#/components/schemas/Meta' }
    FieldOption:
      type: object
      required: [code, label]
      properties:
        code: { type: string }
        label: { $ref: '#/components/schemas/Bilingual' }
        dependsOnOptionCode: { type: [string, 'null'] }
        allowsOtherText: { type: boolean }
    FormField:
      type: object
      required: [fieldKey, type, label, required]
      properties:
        fieldKey: { type: string, pattern: '^[a-z][a-z0-9_]*$' }
        libraryFieldKey: { type: [string, 'null'] }
        type: { type: string, enum: [short_text, long_text, number, decimal, money, phone, email, date, time, datetime, single_select, multi_select, radio, checkbox, photo, file, signature, gps, bd_address, repeat_group, calculation, note, number_table] }
        label: { $ref: '#/components/schemas/Bilingual' }
        required: { type: boolean }
        standardColumn: { type: [string, 'null'] }
        settings: { $ref: '../database/json-schemas/form-field-logic.schema.json#/$defs/settings' }
        logic: { $ref: '../database/json-schemas/form-field-logic.schema.json' }
        calculation: { $ref: '../database/json-schemas/form-field-logic.schema.json#/$defs/calculation' }
        options: { type: array, items: { $ref: '#/components/schemas/FieldOption' } }
    FormSection:
      type: object
      required: [key, title, visibility, fields]
      properties:
        key: { type: string }
        librarySectionKey: { type: [string, 'null'] }
        title: { $ref: '#/components/schemas/Bilingual' }
        visibility: { type: string, enum: [volunteer, official_only] }
        condition: { type: [object, 'null'] }
        fields: { type: array, items: { $ref: '#/components/schemas/FormField' } }
    FormVersion:
      type: object
      required: [id, formId, versionNo, status, sections]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        formId: { $ref: '#/components/schemas/Uuid' }
        versionNo: { type: integer }
        status: { type: string, enum: [draft, published, retired] }
        publishedAt: { type: [string, 'null'], format: date-time }
        sections:
          type: array
          description: Official-only sections are absent for callers without application.view_official_section
          items: { $ref: '#/components/schemas/FormSection' }
        scoring:
          type: object
          description: The form-level points of the priority score (D-132); present for the office only, like the points of each question
          properties:
            not_previously_assisted: { type: integer, minimum: 0, maximum: 100 }
    FormVersionResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/FormVersion' }
        meta: { $ref: '#/components/schemas/Meta' }
    FormVersionListItem:
      description: A version as the builder's version list shows it, with who published it and who changed it last (D-121 item 10); only this list names officials
      allOf:
        - { $ref: '#/components/schemas/FormVersion' }
        - type: object
          required: [publishedBy, updatedBy, updatedAt]
          properties:
            publishedBy:
              anyOf:
                - { $ref: '#/components/schemas/PersonRef' }
                - type: 'null'
            updatedBy:
              anyOf:
                - { $ref: '#/components/schemas/PersonRef' }
                - type: 'null'
            updatedAt: { type: string, format: date-time }
    FormVersionList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/FormVersionListItem' } }
        meta: { $ref: '#/components/schemas/Meta' }
    FormDraftUpdate:
      type: object
      additionalProperties: false
      required: [sections]
      properties:
        sections:
          type: array
          description: The sections of the draft in the FormSection shape; the engine checks them inside the service and names the field of each problem in the 422 details (the body stays open here so the drift test matches the route). A text is a `Bilingual` pair of strings, either of which may be empty in a draft
          items: {}
        scoring:
          description: The form-level points of the priority score (D-132), checked inside the service like the sections
    FormFieldMapResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
            required: [fieldKey, type, label, standardColumn, versions]
            properties:
              fieldKey: { type: string }
              type: { type: string }
              label: { $ref: '#/components/schemas/Bilingual' }
              standardColumn: { type: [string, 'null'] }
              versions: { type: array, items: { type: integer }, description: The version numbers the field appears in }
        meta: { $ref: '#/components/schemas/Meta' }
    PublicLinkConfig:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
        formId:
          type: string
          format: uuid
          description: 'The one form the link opens: required while enabled; a form of this project with a published version and no file or signature field'
    PublicLinkView:
      type: object
      required: [enabled, formId, url]
      properties:
        enabled: { type: boolean }
        formId: { type: [string, 'null'], format: uuid }
        url: { type: [string, 'null'], description: The link to hand out while enabled }
    PublicFormResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [project, form]
          properties:
            project:
              type: object
              required: [name, applyTo, identityDocument]
              properties:
                name: { $ref: '#/components/schemas/Bilingual' }
                applyTo: { type: [string, 'null'], format: date, description: The last day applications are taken }
                identityDocument:
                  type: string
                  enum: [required, optional]
                  description: >-
                    Whether an application of the project must carry the NID or the birth registration number, or
                    carries it only when the person has one (D-172, BR-297); the page marks the question by it. The
                    mobile number is always asked on the public link (BR-299).
            form: { $ref: '#/components/schemas/FormVersion' }
        meta: { $ref: '#/components/schemas/Meta' }
    PublicApplicationCreate:
      type: object
      additionalProperties: false
      required: [clientUuid, answers]
      properties:
        clientUuid: { $ref: '#/components/schemas/Uuid' }
        clientCreatedAt: { type: string, format: date-time }
        answers:
          type: array
          maxItems: 2000
          description: Answers in the shape of Answer; the engine checks each one and names the field it refuses
          items: {}

    # ---------------- applications ----------------
    ApplicationSummary:
      type: object
      required: [id, projectId, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        appNo: { type: [string, 'null'] }
        projectId: { $ref: '#/components/schemas/Uuid' }
        beneficiaryId: { type: [string, 'null'], format: uuid }
        beneficiaryName:
          type: [string, 'null']
          description: The profile's name; while the entry waits for verification, the name typed on the application.
        hasDocument:
          type: [boolean, 'null']
          description: >-
            Whether the person's profile holds an identity document (D-172); null before a profile is
            bound and for a caller who may not know: in a list a holder of the class beneficiary.nid
            is told, on the record also the volunteer who brought the application
        hasMobile:
          type: [boolean, 'null']
          description: >-
            Whether the person's profile holds a mobile of their own; false reads "contact through the
            volunteer" (D-172). Null before a profile is bound and for a caller who may not know: in a
            list a holder of the class beneficiary.contact is told, on the record also the volunteer
            who brought the application
        ownerVolunteerId: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [draft, needs_verification, submitted, under_review, reviewed, waitlisted, approved, rejected, implementation, completed, closed, deleted] }
        stage: { type: [string, 'null'] }
        outcome: { type: [string, 'null'] }
        flags:
          type: array
          items: { type: string }
          description: >-
            The reasons an entry waits for verification. blocked_name_match (a new person, with an
            identity number or without, whose name, father's or husband's name and village match a
            blocked profile) is answered to the office only; a volunteer neither receives it nor
            filters by it
        totalScore: { type: [number, 'null'], x-sensitive-class: application.official_section }
        districtId: { $ref: '#/components/schemas/Uuid' }
        unionId: { $ref: '#/components/schemas/Uuid' }
        submittedAt: { type: [string, 'null'], format: date-time }
        waitingDays: { type: [integer, 'null'], description: Days in the current state (UX-07 stuck approvals) }
        pendingPhotos: { type: integer, minimum: 0, description: Photo slots an offline record still waits for; the office sees the record without them }
        etag: { type: string, description: "The version of the row, carried back by a bulk action's row as its If-Match" }
    Answer:
      type: object
      required: [fieldKey, value]
      properties:
        fieldKey: { type: string }
        repeatIndex: { type: integer, minimum: 0, default: 0 }
        value: { $ref: '../database/json-schemas/application-answer-value.schema.json' }
    ApplicationCreate:
      type: object
      additionalProperties: false
      required: [clientUuid, projectId, formVersionId, answers]
      properties:
        clientUuid: { $ref: '#/components/schemas/Uuid' }
        clientCreatedAt: { type: string, format: date-time }
        projectId: { $ref: '#/components/schemas/Uuid' }
        formVersionId: { $ref: '#/components/schemas/Uuid' }
        beneficiaryId:
          type: string
          format: uuid
          description: >-
            From the lookup, for the client's own use; the server binds the person from the number
            in the identity answer and never from this id
        answers:
          type: array
          maxItems: 2000
          description: Answers in the shape of Answer; the engine checks each one and names the field it refuses
          items: {}
    ApplicationUpdate:
      type: object
      additionalProperties: false
      required: [answers]
      properties:
        answers:
          type: array
          maxItems: 2000
          description: Answers in the shape of Answer; the engine checks each one and names the field it refuses
          items: {}
    Application:
      allOf:
        - $ref: '#/components/schemas/ApplicationSummary'
        - type: object
          properties:
            formVersionId: { $ref: '#/components/schemas/Uuid' }
            candidateBeneficiaryId: { type: [string, 'null'], format: uuid, description: "The profile the entry is compared with at its verification; the candidate of a blocked_name_match is answered to the office only" }
            clientCreatedAt: { type: [string, 'null'], format: date-time, description: "The device time the record was made, when it came from a phone; its late_sync, stale_form_version or existing_identity flag says why it waits" }
            createdByUserId: { type: [string, 'null'], format: uuid, description: The account that created it (a team member's own records) }
            identityKind: { type: [string, 'null'], enum: [nid, birth_reg, none, null], description: "Which number identifies the person; none for an application without an identity document (D-172), told only to a caller who may know whether the profile has a document" }
            guardianRelationCode: { type: [string, 'null'], x-sensitive-class: beneficiary.profile_detail, description: "Whether the father's or husband's name is the father's or the husband's (father, husband): the bound profile's, else the application's own answer; null where neither says (D-174, BR-310)" }
            rejectionMessage: { type: [string, 'null'], description: The words written for the volunteer at a rejection; the office's reason stays in decisionComment }
            answers:
              type: array
              description: Official-section answers are absent for callers without application.view_official_section
              items: { $ref: '#/components/schemas/Answer' }
            reviewedAt: { type: [string, 'null'], format: date-time }
            approvedAt: { type: [string, 'null'], format: date-time }
            decisionComment: { type: [string, 'null'], x-sensitive-class: application.official_section, description: The office's reason of a decision }
            scoreItems:
              type: [array, 'null']
              x-sensitive-class: application.official_section
              description: The priority score's breakdown (D-132), one item per scored question and one for "not previously assisted"; null for a form without points; frozen with the score at the decision
              items:
                type: object
                required: [key, input, max_points, points]
                properties:
                  key: { type: string }
                  label: { $ref: '#/components/schemas/Bilingual' }
                  input: { description: 'The answer read, or whether the person was not assisted before' }
                  max_points: { type: number }
                  points: { type: number }
            zakat:
              type: [object, 'null']
              x-sensitive-class: application.official_section
              properties:
                nisabValue: { $ref: '#/components/schemas/Money' }
                decision: { type: [string, 'null'], enum: [eligible, not_eligible, null] }
            familyDuplicateWarnings:
              type: array
              description: >-
                BR-011 family-duplicate warnings shown at review (D-116): another applicant of the
                project with the same mobile, or the same union, village and father's or husband's
                name; never a refusal
              items:
                type: object
                required: [beneficiaryId, benNo, name, matchedOn]
                properties:
                  beneficiaryId: { $ref: '#/components/schemas/Uuid' }
                  benNo: { type: string, description: 'BEN- and 7 digits' }
                  name: { type: string }
                  matchedOn:
                    type: array
                    items: { type: string, enum: [mobile, union_village_father] }
            availableActions: { type: array, items: { type: string }, description: Actions the caller may perform now }
            decisionHints:
              type: object
              description: 'For the office, the comments each decision would ask for now, by action (D-132): against_score when it goes against the score order of the quota area, quota_full when the area''s quota is full, family_match when an approval meets a family match in the project (D-157); empty for a volunteer and when nothing would be asked'
              additionalProperties:
                type: array
                items: { type: string, enum: [against_score, quota_full, family_match] }
            unlocks:
              type: array
              description: The unlocks of the application waiting for a step, as the caller may see them (a volunteer never sees the office's reasons nor an answer of the official section)
              items: { $ref: '#/components/schemas/ApplicationUnlock' }
            mayUnlock: { type: boolean, description: Whether the caller may open an answer of this application for correction now }
            media:
              description: Its referral to the Media Team (D-136), for the referrer's program or region and the directors; null otherwise. It never moves the workflow state.
              oneOf:
                - $ref: '#/components/schemas/ApplicationMedia'
                - type: 'null'
            mayReferToMedia: { type: boolean, description: 'Whether the caller may refer it to the Media Team now, or send a returned referral again' }
            form: { $ref: '#/components/schemas/FormVersion', description: The form version the answers belong to, as the caller's audience sees it }
    ApplicationResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Application' }
        meta: { $ref: '#/components/schemas/Meta' }
    ApplicationList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ApplicationSummary' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    MediaPerson:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
    MediaPlace:
      type: object
      required: [program, project]
      properties:
        program:
          type: object
          required: [id, name]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            name: { $ref: '#/components/schemas/Bilingual' }
        project:
          type: object
          required: [id, name, year]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            name: { $ref: '#/components/schemas/Bilingual' }
            year: { type: integer }
    MediaReferralSummary:
      allOf:
        - $ref: '#/components/schemas/MediaPlace'
        - type: object
          required: [id, applicationId, appNo, state, priority, beneficiaryName, referredBy, referredAt, decidedAt]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            applicationId: { $ref: '#/components/schemas/Uuid' }
            appNo: { type: [string, 'null'] }
            state: { type: string, enum: [pending, accepted, sent_back, rejected] }
            priority: { type: string, enum: [high, normal, low] }
            beneficiaryName: { type: string }
            referredBy: { $ref: '#/components/schemas/MediaPerson' }
            referredAt: { type: string, format: date-time }
            decidedAt: { type: [string, 'null'], format: date-time }
    MediaEvent:
      type: object
      required: [id, kind, fromValue, toValue, comment, actor, at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, description: 'referred, resent, accepted, sent_back, rejected, or a step of the work' }
        fromValue: { type: [string, 'null'] }
        toValue: { type: [string, 'null'] }
        comment: { type: [string, 'null'] }
        actor: { $ref: '#/components/schemas/MediaPerson' }
        at: { type: string, format: date-time }
    MediaBeneficiary:
      type: object
      description: What the Media Team may know of the person (BR-265); never the identity numbers, whether the person has an identity document, ratings, categories or scores
      required: [name, fatherOrHusbandName, ageYears, mobile, address, occupation, monthlyIncome]
      properties:
        name: { type: string }
        fatherOrHusbandName: { type: string }
        ageYears: { type: [integer, 'null'] }
        mobile: { type: [string, 'null'], description: 'Null for a person without a number of their own, who is reached through the volunteer' }
        address:
          type: object
          required: [divisionId, districtId, upazilaId, unionId, village, postOffice]
          properties:
            divisionId: { $ref: '#/components/schemas/Uuid' }
            districtId: { $ref: '#/components/schemas/Uuid' }
            upazilaId: { $ref: '#/components/schemas/Uuid' }
            unionId: { $ref: '#/components/schemas/Uuid' }
            village: { type: string }
            postOffice: { type: [string, 'null'] }
        occupation:
          oneOf:
            - $ref: '#/components/schemas/Bilingual'
            - type: 'null'
        monthlyIncome: { type: [string, 'null'], description: Taka with two decimals }
    MediaReferral:
      allOf:
        - $ref: '#/components/schemas/MediaReferralSummary'
        - type: object
          required: [note, story, decidedBy, decisionComment, beneficiary, officialComment, work, history, mayDecide, mayResend]
          properties:
            note: { type: string }
            story: { type: [string, 'null'] }
            decidedBy:
              oneOf:
                - $ref: '#/components/schemas/MediaPerson'
                - type: 'null'
            decisionComment: { type: [string, 'null'], description: The comment of a send-back or the reason of a rejection }
            beneficiary: { $ref: '#/components/schemas/MediaBeneficiary' }
            officialComment: { type: [string, 'null'], description: "The official's comment on the application; nothing else of the official section" }
            work:
              oneOf:
                - $ref: '#/components/schemas/MediaWork'
                - type: 'null'
            history: { type: array, items: { $ref: '#/components/schemas/MediaEvent' } }
            mayDecide: { type: boolean }
            mayResend: { type: boolean }
    MediaWork:
      type: object
      required: [id, title, stageCode, heldStageCode, contentType, script, scriptState, reviewApprovedBy, reviewApprovedAt, version, members, publications, comments, nextStages, mayManage, mayEditScript, mayDirect, mayReview]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        stageCode: { type: string }
        heldStageCode: { type: [string, 'null'], description: The stage a work on hold returns to }
        contentType: { type: string, enum: [video, photo, both] }
        script:
          description: Null for a caller without story.view or story.manage on the work
          oneOf:
            - $ref: '#/components/schemas/MediaScript'
            - type: 'null'
        scriptState: { type: string, enum: [draft, in_review, final] }
        reviewApprovedBy:
          oneOf:
            - $ref: '#/components/schemas/MediaPerson'
            - type: 'null'
        reviewApprovedAt: { type: [string, 'null'], format: date-time }
        version: { type: string, description: The ETag the next change of the work carries in If-Match }
        members:
          type: array
          items:
            type: object
            required: [userId, name, roles]
            properties:
              userId: { $ref: '#/components/schemas/Uuid' }
              name: { type: string }
              roles: { type: array, items: { type: string } }
        publications:
          type: array
          items:
            type: object
            required: [id, platformCode, state, publishedOn, link, note, youtubeId]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              platformCode: { type: string }
              state: { type: string, enum: [waiting, published, taken_down] }
              publishedOn: { type: [string, 'null'], format: date }
              link: { type: [string, 'null'] }
              note: { type: [string, 'null'] }
              youtubeId: { type: [string, 'null'], description: 'The video id of a YouTube link, from which alone the thumbnail is built' }
        comments:
          type: array
          items:
            type: object
            required: [id, author, body, at]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              author: { $ref: '#/components/schemas/MediaPerson' }
              body: { type: string }
              at: { type: string, format: date-time }
        nextStages: { type: array, items: { type: string }, description: The stages the caller may move it to now }
        mayManage: { type: boolean }
        mayEditScript: { type: boolean }
        mayDirect: { type: boolean, description: 'Members, title, hold and close: the directors' }
        mayReview: { type: boolean }
    MediaScript:
      type: object
      additionalProperties: false
      description: The parts of a work's script, each at most 20000 characters
      properties:
        summary: { type: string }
        questions: { type: string }
        scenes: { type: string }
        voiceOver: { type: string }
        notes: { type: string }
    MediaWorkUpdateRequest:
      type: object
      additionalProperties: false
      description: At least one field
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        stageCode: { type: string, pattern: '^[a-z][a-z0-9_]{0,49}$' }
        contentType: { type: string, enum: [video, photo, both] }
        script: { $ref: '#/components/schemas/MediaScript' }
        scriptState: { type: string, enum: [draft, in_review, final] }
    MediaMembersRequest:
      type: object
      additionalProperties: false
      required: [members]
      properties:
        members:
          type: array
          maxItems: 50
          description: Each person at most once
          items:
            type: object
            additionalProperties: false
            required: [userId, roles]
            properties:
              userId: { $ref: '#/components/schemas/Uuid' }
              roles:
                type: array
                minItems: 1
                maxItems: 10
                items: { type: string, pattern: '^[a-z][a-z0-9_]{0,49}$' }
    MediaPublicationRequest:
      type: object
      additionalProperties: false
      required: [platformCode, state]
      properties:
        platformCode: { type: string, pattern: '^[a-z][a-z0-9_]{0,49}$' }
        state: { type: string, enum: [waiting, published, taken_down] }
        publishedOn: { type: string, format: date, description: Required when published }
        link: { type: string, minLength: 1, maxLength: 500, description: Required when published }
        note: { type: string, minLength: 1, maxLength: 2000 }
    MediaPublicationUpdateRequest:
      type: object
      additionalProperties: false
      description: At least one field
      properties:
        state: { type: string, enum: [waiting, published, taken_down] }
        publishedOn: { type: string, format: date }
        link:
          description: Null clears the link of a post that is not published
          anyOf:
            - { type: string, minLength: 1, maxLength: 500 }
            - { type: 'null' }
        note:
          description: Null clears the note
          anyOf:
            - { type: string, minLength: 1, maxLength: 2000 }
            - { type: 'null' }
    MediaReviewRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, send_back] }
        comment: { type: string, minLength: 1, maxLength: 2000, description: Required to send back }
    MediaCommentRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
    MediaCounts:
      type: object
      description: >-
        The home's counts (D-101 (8)): every referral; new (waiting for a decision); in review (works
        in review and referrals sent back); in progress (accepted, planning, script, internal review
        and any stage added in settings); waiting for shooting; in editing (shooting done, editing);
        published (ready to publish, published); done; rejected
      required: [referrals, new, inReview, inProgress, waitingForShooting, inEditing, published, done, rejected]
      properties:
        referrals: { type: integer }
        new: { type: integer }
        inReview: { type: integer }
        inProgress: { type: integer }
        waitingForShooting: { type: integer }
        inEditing: { type: integer }
        published: { type: integer }
        done: { type: integer }
        rejected: { type: integer }
    MediaWorkRow:
      allOf:
        - $ref: '#/components/schemas/MediaPlace'
        - type: object
          required: [referralId, workId, title, beneficiaryName, members, state, stageCode, priority, referredAt, updatedAt]
          properties:
            referralId: { $ref: '#/components/schemas/Uuid' }
            workId: { type: [string, 'null'], format: uuid }
            title: { type: [string, 'null'] }
            beneficiaryName: { type: string }
            members:
              type: array
              items:
                type: object
                required: [userId, name]
                properties:
                  userId: { $ref: '#/components/schemas/Uuid' }
                  name: { type: string }
            state: { type: string, enum: [pending, accepted, sent_back, rejected] }
            stageCode: { type: [string, 'null'] }
            priority: { type: string, enum: [high, normal, low] }
            referredAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    MediaPublishedWork:
      allOf:
        - $ref: '#/components/schemas/MediaPlace'
        - type: object
          required: [referralId, workId, title, stageCode, contentType, summary, publishedOn, publications, members]
          properties:
            referralId: { $ref: '#/components/schemas/Uuid' }
            workId: { $ref: '#/components/schemas/Uuid' }
            title: { type: string }
            stageCode: { type: string, enum: [published, done] }
            contentType: { type: string, enum: [video, photo, both] }
            summary: { type: [string, 'null'], description: "The script's summary" }
            publishedOn: { type: [string, 'null'], format: date, description: The date of the first publication }
            publications:
              type: array
              description: The published posts only
              items:
                type: object
                required: [platformCode, link, publishedOn, youtubeId]
                properties:
                  platformCode: { type: string }
                  link: { type: string }
                  publishedOn: { type: [string, 'null'], format: date }
                  youtubeId: { type: [string, 'null'] }
            members:
              type: array
              items:
                type: object
                required: [userId, name, roles]
                properties:
                  userId: { $ref: '#/components/schemas/Uuid' }
                  name: { type: string }
                  roles: { type: array, items: { type: string } }
    MediaReferralResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/MediaReferral' }
        meta: { $ref: '#/components/schemas/Meta' }
    MediaReferralList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/MediaReferralSummary' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    MediaReferralRequest:
      type: object
      additionalProperties: false
      required: [priority, note]
      properties:
        priority: { type: string, enum: [high, normal, low] }
        note: { type: string, minLength: 1, maxLength: 2000 }
        story: { type: string, minLength: 1, maxLength: 10000, description: The story or first text the referrer writes (BR-284) }
    MediaReferralDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [accept, send_back, reject] }
        comment: { type: string, minLength: 1, maxLength: 2000, description: Required to send back or reject }
    ApplicationMedia:
      type: object
      required: [referralId, state, priority, decisionComment, decidedAt, workStageCode]
      properties:
        referralId: { $ref: '#/components/schemas/Uuid' }
        state: { type: string, enum: [pending, accepted, sent_back, rejected] }
        priority: { type: string, enum: [high, normal, low] }
        decisionComment: { type: [string, 'null'] }
        decidedAt: { type: [string, 'null'], format: date-time }
        workStageCode: { type: [string, 'null'] }
    ApplicationActionRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 2000, description: 'Required for reject, waitlist and reject_unverified; the office reason, never shown to a volunteer' }
        message: { type: string, maxLength: 2000, description: 'Required for reject: the words written for the volunteer' }
        comment: { type: string, maxLength: 2000, description: Required when deciding against the score order (BR-099) }
        linkBeneficiaryId: { type: string, format: uuid, description: "verify_link only: the live profile behind the entry's identity number, reached through the caller's identity scope" }
        ownerVolunteerId: { type: string, format: uuid, description: "verify_link and verify_create only: an active, unblocked volunteer of the project who owns the application from then on; without one it stays the office's" }
        zakatDecision: { type: string, enum: [eligible, not_eligible], description: Official দায়ী when the project uses zakat }
    Score:
      type: object
      required: [applicationId, totalScore, criteria]
      properties:
        applicationId: { $ref: '#/components/schemas/Uuid' }
        totalScore: { type: number, minimum: 0, maximum: 100 }
        criteria: { $ref: '../database/json-schemas/application-score-criteria.schema.json' }
        snapshotAt: { type: [string, 'null'], format: date-time }
    ScoreResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Score' }
        meta: { $ref: '#/components/schemas/Meta' }
    ApplicationUnlock:
      type: object
      description: 'One field unlock (BD-18): opened by an official with a reason, filled by the owner volunteer (or an official when the application has no volunteer or the answer is the official section''s), decided by an official who did not fill it'
      required: [id, applicationId, fieldKey, repeatIndex, state, oldValue, newValue, reason, openedBy, openedAt, enteredBy, enteredAt, decidedBy, decidedAt, decision, decisionReason, mayFill, mayDecide, mayCancel]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        applicationId: { $ref: '#/components/schemas/Uuid' }
        fieldKey: { type: string }
        repeatIndex: { type: integer }
        state: { type: string, enum: [open, updated, relocked] }
        oldValue: {}
        newValue: {}
        reason: { type: [string, 'null'], description: The office's reason for opening; null for a volunteer }
        openedBy: { type: [string, 'null'], format: uuid }
        openedAt: { type: string, format: date-time }
        enteredBy: { type: [string, 'null'], format: uuid }
        enteredAt: { type: [string, 'null'], format: date-time }
        decidedBy: { type: [string, 'null'], format: uuid }
        decidedAt: { type: [string, 'null'], format: date-time }
        decision: { type: [string, 'null'], enum: [accepted, refused, cancelled, null] }
        decisionReason: { type: [string, 'null'], description: Why it was refused or cancelled; null for a volunteer }
        mayFill: { type: boolean }
        mayDecide: { type: boolean }
        mayCancel: { type: boolean }
    ApplicationUnlockResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/ApplicationUnlock' }
        meta: { $ref: '#/components/schemas/Meta' }
    FieldChange:
      type: object
      required: [id, field, kind, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        field: { type: string }
        kind: { type: string, enum: [unlock, contact_update, correction, sync_conflict, review_edit] }
        unlockState: { type: [string, 'null'], enum: [open, updated, relocked, null] }
        oldValue: {}
        newValue: {}
        reason: { type: [string, 'null'] }
        requestedBy: { type: [string, 'null'], format: uuid }
        approvedBy: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        enteredBy: { type: [string, 'null'], format: uuid, description: Who entered the new value of an unlock }
        enteredAt: { type: [string, 'null'], format: date-time }
        decidedBy: { type: [string, 'null'], format: uuid, description: 'Who accepted, refused or cancelled an unlock' }
        decidedAt: { type: [string, 'null'], format: date-time }
        decision: { type: [string, 'null'], enum: [accepted, refused, cancelled, null] }
        decisionReason: { type: [string, 'null'] }
    FieldChangeList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/FieldChange' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    TimelineEntry:
      type: object
      description: >-
        One step of the application, read from its audit entry; the office reads the actor, its
        reason and the comment, a volunteer the state, the time and the message written for them
      required: [id, at, action, from, to, automatic, message]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        at: { type: string, format: date-time }
        action: { type: string, description: 'The audit action of the step, such as application.submit' }
        from: { type: [string, 'null'] }
        to: { type: string }
        automatic: { type: boolean, description: A move the engine made on its own after the step before }
        actor:
          type: [object, 'null']
          x-sensitive-class: application.official_section
          required: [id, name]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            name: { type: string }
        reason: { type: [string, 'null'], x-sensitive-class: application.official_section }
        comment: { type: [string, 'null'], x-sensitive-class: application.official_section }
        message: { type: [string, 'null'], description: The words written for the volunteer at a rejection }
    TimelineList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/TimelineEntry' } }
        meta: { $ref: '#/components/schemas/Meta' }
    Transfer:
      type: object
      required: [id, applicationId, fromVolunteerId, toVolunteerId, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        applicationId: { $ref: '#/components/schemas/Uuid' }
        fromVolunteerId: { $ref: '#/components/schemas/Uuid' }
        toVolunteerId: { $ref: '#/components/schemas/Uuid' }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
    TransferList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Transfer' } }
        meta: { $ref: '#/components/schemas/ListMeta' }

    # ---------------- activities ----------------
    ActivityCreate:
      type: object
      required: [clientUuid, applicationId, type]
      properties:
        clientUuid: { $ref: '#/components/schemas/Uuid' }
        clientCreatedAt: { type: string, format: date-time }
        applicationId: { $ref: '#/components/schemas/Uuid' }
        type: { type: string, enum: [distribution, construction, purchase, training, visit, payment, voucher, expense, issue, inspection, follow_up] }
        stage: { type: string }
        outcome: { type: string }
        comment: { type: string }
        photoFileIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
    Activity:
      allOf:
        - $ref: '#/components/schemas/ActivityCreate'
        - type: object
          required: [id, projectId, status, doneBy, doneAt]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            projectId: { $ref: '#/components/schemas/Uuid' }
            status: { type: string, enum: [planned, done, failed] }
            doneBy: { $ref: '#/components/schemas/Uuid' }
            doneAt: { type: string, format: date-time }
    ActivityResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Activity' }
        meta: { $ref: '#/components/schemas/Meta' }
    ActivityList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Activity' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    BulkRow:
      type: object
      required: [clientUuid, applicationId]
      properties:
        clientUuid: { $ref: '#/components/schemas/Uuid' }
        applicationId: { $ref: '#/components/schemas/Uuid' }
        outcome: { type: string }
        stage: { type: string }
        present: { type: boolean, description: class screen }
        familyMemberId: { type: string, format: uuid, description: 'class screen - family attendance (O-11)' }
        absenceReason: { type: string }
        topicUpdates:
          type: array
          description: class screen
          items:
            type: object
            properties:
              topicId: { $ref: '#/components/schemas/Uuid' }
              status: { type: string, enum: [in_progress, learned] }
        method: { type: string, enum: [visit, phone], description: followup screen }
        answers: { type: object, description: followup screen answers (followup-answers schema) }
        photoFileIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        comment: { type: string }
    BulkReviewRequest:
      type: object
      additionalProperties: false
      required: [action, rows]
      description: >-
        The review screen's bulk action: one action for every row, each row with the version the
        list showed, so a row that changed since fails on its own
      properties:
        action: { type: string, enum: [review, approve] }
        rows:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [clientUuid, applicationId, ifMatch]
            properties:
              clientUuid: { $ref: '#/components/schemas/Uuid' }
              applicationId: { $ref: '#/components/schemas/Uuid' }
              ifMatch: { type: string, maxLength: 64 }
    BulkRequest:
      type: object
      required: [rows]
      properties:
        rows: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/BulkRow' } }
    RowResult:
      type: object
      required: [clientUuid, result]
      properties:
        clientUuid: { $ref: '#/components/schemas/Uuid' }
        result: { type: string, enum: [done, failed, pending_photos, needs_verification, synced] }
        code: { type: [string, 'null'], description: Error code when failed }
        params:
          type: object
          additionalProperties: { type: string }
          description: The values the refusal's message names, for the codes whose values are public (the question of an answer no longer in its list)
        serverId: { type: [string, 'null'], format: uuid }
        status: { type: [string, 'null'] }
        stage: { type: [string, 'null'] }
        pendingPhotos: { type: integer, minimum: 0, description: Photo slots the server still waits for after this record (sync) }
        conflict:
          type: object
          additionalProperties: false
          required: [kept]
          description: What the server kept when the record met a change made elsewhere (sync)
          properties:
            kept: { type: string, enum: [server, client] }
            serverValue: { description: "The server's value of a locked field, only when the caller may see that field" }
    BulkResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [results]
          properties:
            results: { type: array, items: { $ref: '#/components/schemas/RowResult' } }
        meta: { $ref: '#/components/schemas/Meta' }

    # ---------------- files ----------------
    UploadSessionCreate:
      type: object
      additionalProperties: false
      required: [clientUuid, kind, entityType, entityId, slot, mime, sizeBytes, sha256, source]
      properties:
        clientUuid: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [distribution_proof, construction_proof, evidence, voucher, payment_copy, document, animal_photo, profile_photo, nid_photo, media_asset, issue_photo, form_photo] }
        entityType: { type: string, minLength: 1, maxLength: 40, description: 'The record type the file links to: application, activity, issue, voucher, expense_claim, payment, animal or document; each takes its own kinds (D-108)' }
        entityId: { type: string, format: uuid, description: The record the file links to; its scope is checked at create and at finalize }
        slot: { type: string, pattern: '^[a-z][a-z0-9_]{0,39}$' }
        mime: { type: string, minLength: 1, maxLength: 100 }
        sizeBytes: { type: integer, minimum: 1, maximum: 20971520 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        capturedAt: { type: string, format: date-time }
        recordCreatedAt: { type: string, format: date-time }
        gps: { $ref: '#/components/schemas/Gps' }
        source: { type: string, enum: [camera, gallery, scan] }
    UploadSession:
      type: object
      required: [id, chunkSize, partCount, partsReceived, bytesReceived, expiresAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        chunkSize: { type: integer, const: 262144 }
        partCount: { type: integer, minimum: 1, description: The parts the declared size needs }
        partsReceived: { type: array, items: { type: integer, minimum: 1 }, description: 'The parts the server holds, for a resume after a dropped connection' }
        bytesReceived: { type: integer, minimum: 0 }
        expiresAt: { type: string, format: date-time }
        fileId: { type: [string, 'null'], format: uuid, description: Set once the session is finalized }
    UploadSessionResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/UploadSession' }
        meta: { $ref: '#/components/schemas/Meta' }
    FileInfo:
      type: object
      required: [id, kind, mime, sizeBytes, virusScan, flags]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string }
        mime: { type: string }
        sizeBytes: { type: integer }
        capturedAt: { type: [string, 'null'], format: date-time }
        uploadedAt: { type: string, format: date-time }
        gps:
          type: [object, 'null']
          x-sensitive-class: file.location
          required: [lat, lng]
          properties:
            lat: { type: number }
            lng: { type: number }
            accuracyM: { type: [number, 'null'] }
        virusScan: { type: string, enum: [pending, clean, infected, failed, skipped] }
        flags: { type: array, items: { type: string, enum: [no_capture_time, no_gps, gallery_under_camera_only, stale_capture, duplicate_suspect] } }
        duplicateOf: { type: [string, 'null'], format: uuid, description: 'The near or exact duplicate, named only to a caller whose scope reaches it' }
    FileListRow:
      type: object
      required: [id, kind, slot, mime, sizeBytes, capturedAt, uploadedAt, gps, virusScan, flags]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string }
        slot: { type: [string, 'null'] }
        mime: { type: string }
        sizeBytes: { type: integer }
        capturedAt: { type: [string, 'null'], format: date-time }
        uploadedAt: { type: string, format: date-time }
        gps:
          type: [object, 'null']
          x-sensitive-class: file.location
          description: 'Null for a caller without file.location, except on the caller''s own uploads'
          required: [lat, lng]
          properties:
            lat: { type: number }
            lng: { type: number }
            accuracyM: { type: [number, 'null'] }
        virusScan: { type: string, enum: [pending, clean, infected, failed, skipped] }
        flags: { type: array, items: { type: string } }
    FileListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/FileListRow' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    FileInfoResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/FileInfo' }
        meta: { $ref: '#/components/schemas/Meta' }

    # ---------------- notifications and exports ----------------
    Notification:
      type: object
      required: [id, templateKey, title, body, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        templateKey: { type: string }
        title: { type: string }
        body: { type: string }
        link: { type: [string, 'null'], description: In-app route of the related record }
        count: { type: integer, description: Coalesced events (O-35) }
        readAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    NotificationList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        meta:
          allOf:
            - $ref: '#/components/schemas/ListMeta'
            - type: object
              properties:
                unreadCount: { type: integer }
    MarkReadRequest:
      type: object
      additionalProperties: false
      description: Exactly one of ids and all.
      properties:
        ids: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/Uuid' } }
        all: { type: boolean, const: true }
    PreferencesUpdate:
      type: object
      additionalProperties: false
      description: At least one field; officials only (a volunteer has no email setting).
      properties:
        email_mode: { type: string, enum: [digest, immediate] }
        digest_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
    NotificationTemplateText:
      type: object
      additionalProperties: false
      required: [body]
      description: >-
        Plain text without links and without < or >; an email has a subject and no title, an in-app
        entry a title and no subject; a {{placeholder}} must be declared for the key
        (notification.placeholder_unknown), and an in-app text may not use a person's name
        (notification.person_in_app).
      properties:
        subject: { type: string, minLength: 1, maxLength: 200 }
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 2000 }
    NotificationTemplateEdit:
      type: object
      additionalProperties: false
      required: [bn, en]
      properties:
        bn: { $ref: '#/components/schemas/NotificationTemplateText' }
        en: { $ref: '#/components/schemas/NotificationTemplateText' }
    NotificationTemplate:
      type: object
      required: [key, category, variables, channels]
      properties:
        key: { type: string }
        category: { type: string, enum: [security, work, info, alert] }
        variables: { type: array, items: { type: string } }
        channels:
          type: object
          properties:
            in_app: { $ref: '#/components/schemas/NotificationTemplateChannel' }
            email: { $ref: '#/components/schemas/NotificationTemplateChannel' }
    NotificationTemplateChannel:
      type: object
      required: [version, bn, en]
      properties:
        version: { type: integer, minimum: 1 }
        bn: { $ref: '#/components/schemas/StoredTemplateText' }
        en: { $ref: '#/components/schemas/StoredTemplateText' }
    StoredTemplateText:
      type: object
      required: [subject, title, body]
      properties:
        subject: { type: [string, 'null'] }
        title: { type: [string, 'null'] }
        body: { type: string }
    RenderedNotification:
      type: object
      required: [body]
      properties:
        subject: { type: string }
        title: { type: string }
        body: { type: string }
    Delivery:
      type: object
      required: [id, createdAt, channel, templateKey, status, recipient, address, attempts]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        createdAt: { type: string, format: date-time }
        channel: { type: string, enum: [email, sms, push] }
        templateKey: { type: string }
        status: { type: string, enum: [queued, sending, sent, failed, dry_run, suppressed] }
        recipient:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, name]
              properties:
                id: { $ref: '#/components/schemas/Uuid' }
                name: { type: string }
        address: { type: string, description: 'Partly hidden: the first letter and the domain, or 3 and 2 digits' }
        attempts: { type: integer, minimum: 0 }
        lastError: { type: [string, 'null'], description: 'Cleaned: no address or number' }
        nextAttemptAt: { type: [string, 'null'], format: date-time }
        sentAt: { type: [string, 'null'], format: date-time }
    PreferencesResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '../database/json-schemas/user-preferences.schema.json' }
        meta: { $ref: '#/components/schemas/Meta' }
    ExportCreate:
      type: object
      additionalProperties: false
      description: >-
        A list's export: the columns chosen (the list's column ids, and on a project's application
        list `q:` and a question's field key) and the list's own filters as its page sends them; an
        application list names its project, the other lists name none.
      required: [kind, format, columns, filters]
      properties:
        kind: { type: string, enum: [volunteers, beneficiaries, applications] }
        format: { type: string, enum: [xlsx, csv, pdf] }
        columns:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string, minLength: 1, maxLength: 120 }
          description: Each id once; the file orders them itself (the list's columns, the details, then the questions)
        filters: { type: object, propertyNames: { type: string }, additionalProperties: {}, description: "The list's filters, checked with that list's own filter schema" }
        projectId: { type: string, format: uuid }
    ExportJob:
      type: object
      required:
        [id, kind, format, status, columns, rowsDone, rowsTotal, rowCount, fileId, sensitive, errorCode, createdAt, finishedAt, expired]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [volunteers, beneficiaries, applications, beneficiary_profile, application] }
        format: { type: string, enum: [xlsx, csv, pdf] }
        status: { type: string, enum: [queued, running, done, failed] }
        columns: { type: array, items: { type: string } }
        rowsDone: { type: integer, minimum: 0, description: The rows written so far }
        rowsTotal: { type: [integer, 'null'], minimum: 0, description: The rows the list held at the request }
        rowCount: { type: [integer, 'null'], minimum: 0, description: The rows the finished file holds }
        fileId: { type: [string, 'null'], format: uuid, description: 'Set when done; the file streams from GET /files/{fileId}/content to its requester only' }
        sensitive: { type: boolean, description: 'The file holds identity numbers, bank details or the official section' }
        errorCode: { type: [string, 'null'], description: 'Why a failed job failed: export.failed, export.pdf_unavailable, export.pdf_failed or export.timed_out' }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        expired: { type: boolean, description: 'The file was deleted after its 30 days; the job stays' }
    ExportJobResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/ExportJob' }
        meta: { $ref: '#/components/schemas/Meta' }
    ExportJobListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ExportJob' } }
        meta: { $ref: '#/components/schemas/Meta' }
    ExportColumn:
      type: object
      required: [id, label, group, protected, onScreen, kind, section]
      properties:
        id: { type: string }
        label: { $ref: '#/components/schemas/Bilingual' }
        group: { type: string, enum: [list, detail, question], description: "The list's own columns, further facts of the record, or a form question" }
        protected: { type: boolean, description: 'An identity number, a bank detail or an official-section answer' }
        onScreen: { type: boolean, description: 'The list shows it, so the dialog ticks it first' }
        kind: { type: string, description: 'text, number, money, date, datetime, coded or flag' }
        section:
          oneOf:
            - type: object
              required: [key, title]
              properties:
                key: { type: string }
                title: { $ref: '#/components/schemas/Bilingual' }
            - type: 'null'
    ExportColumnsResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [columns]
          properties:
            columns: { type: array, items: { $ref: '#/components/schemas/ExportColumn' } }
        meta: { $ref: '#/components/schemas/Meta' }

    # ---------------- reference data ----------------
    Location:
      type: object
      required: [id, level, code, name, postCode, active]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        parentId: { type: [string, 'null'], format: uuid }
        level: { type: string, enum: [division, district, upazila, union] }
        code: { type: string }
        name: { $ref: '#/components/schemas/Bilingual' }
        postCode:
          type: [string, 'null']
          pattern: '^[0-9]{4}$'
          description: The post code of an upazila, a thana or a union-level place; null above them (D-160)
        active: { type: boolean }
    LocationCreate:
      type: object
      required: [parentId, level, code, name]
      properties:
        parentId: { $ref: '#/components/schemas/Uuid' }
        level: { type: string, enum: [district, upazila, union] }
        code: { type: string }
        name: { $ref: '#/components/schemas/Bilingual' }
    LocationUpdate:
      type: object
      properties:
        name: { $ref: '#/components/schemas/Bilingual' }
        active: { type: boolean, description: Deactivate instead of delete (O-09) }
    LocationResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Location' }
        meta: { $ref: '#/components/schemas/Meta' }
    LocationList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Location' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    ReferenceItem:
      type: object
      required: [code, label, active, sortOrder, system, kind]
      properties:
        code: { type: string, pattern: '^[a-z0-9_]{1,64}$' }
        label: { $ref: '#/components/schemas/Bilingual' }
        active: { type: boolean }
        sortOrder: { type: integer }
        system: { type: boolean, description: 'An entry the rules need (a media stage): it stays active and its code is fixed' }
        kind: { type: [string, 'null'], enum: [youtube, facebook, other, null], description: "A media platform's kind, which decides the host of its links; null on the other lists" }
    ReferenceItemCreate:
      description: >-
        A new item of an editable list (DECISION_LOG D-098). The code is small English letters,
        digits and _, starting with a letter, and never changes; each label at most 200 characters.
      type: object
      additionalProperties: false
      required: [code, label]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9_]{1,63}$' }
        label: { $ref: '#/components/schemas/BilingualInput' }
        active: { type: boolean }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
        kind: { type: string, enum: [youtube, facebook, other], description: 'Required on the media platforms, refused on the other lists (422)' }
    ReferenceItemUpdate:
      description: At least one of label, active, sortOrder and kind. A system entry cannot be deactivated (409 reference.system_entry).
      type: object
      additionalProperties: false
      properties:
        label: { $ref: '#/components/schemas/BilingualInput' }
        active: { type: boolean }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
        kind: { type: string, enum: [youtube, facebook, other] }
    BilingualInput:
      description: A configuration text in both languages, both required (BR-245).
      type: object
      additionalProperties: false
      required: [bn, en]
      properties:
        bn: { type: string }
        en: { type: string }
    ReferenceList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ReferenceItem' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    NameVariantSpelling:
      description: >-
        One word of Bengali or Latin letters with at least one letter (marks alone are refused),
        trimmed; not a title the name key drops.
      type: string
      minLength: 1
      maxLength: 100
    NameVariantGroupCreate:
      description: A new group of spelling variants (D-174); a spelling given twice is refused.
      type: object
      additionalProperties: false
      required: [canonical, variants]
      properties:
        canonical: { $ref: '#/components/schemas/NameVariantSpelling' }
        variants:
          type: array
          minItems: 1
          maxItems: 30
          items: { $ref: '#/components/schemas/NameVariantSpelling' }
    NameVariantGroupUpdate:
      description: >-
        canonical and variants together (the group's spellings as they are to be), active, or both;
        at least one of them.
      type: object
      additionalProperties: false
      properties:
        canonical: { $ref: '#/components/schemas/NameVariantSpelling' }
        variants:
          type: array
          minItems: 1
          maxItems: 30
          items: { $ref: '#/components/schemas/NameVariantSpelling' }
        active: { type: boolean }
    NameVariantGroup:
      type: object
      additionalProperties: false
      required: [id, canonical, variants, active, etag]
      properties:
        id: { type: string, format: uuid }
        canonical: { type: string }
        variants: { type: array, items: { type: string } }
        active: { type: boolean }
        etag: { type: string, description: "The group's version, for the If-Match of its change" }
    NameVariantGroupList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/NameVariantGroup' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    NameVariantGroupResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/NameVariantGroup' }
        meta: { $ref: '#/components/schemas/Meta' }
    ReferenceItemResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/ReferenceItem' }
        meta: { $ref: '#/components/schemas/Meta' }
    Setting:
      description: >-
        One setting key with its whole value; updatedAt is null while the default is in force.
        Keys and value shapes are in @css/shared/settings (organisation, localization,
        monitoring.thresholds; sms.provider through the channels page).
      type: object
      required: [key, value, updatedAt]
      properties:
        key: { type: string }
        value: {}
        updatedAt:
          anyOf:
            - { type: string, format: date-time }
            - { type: 'null' }
    SettingResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Setting' }
        meta: { $ref: '#/components/schemas/Meta' }
    SettingList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Setting' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    SettingUpdate:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: {}
    PublicSettingsResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [defaultLanguage, organisation]
          properties:
            defaultLanguage: { type: string, enum: [bn, en] }
            organisation:
              type: object
              required: [foundationName, departmentName, address, phone, email]
              properties:
                foundationName: { $ref: '#/components/schemas/Bilingual' }
                departmentName: { $ref: '#/components/schemas/Bilingual' }
                address: { $ref: '#/components/schemas/Bilingual' }
                phone: { type: string }
                email: { type: string }
        meta: { $ref: '#/components/schemas/Meta' }
    NisabAddRequest:
      type: object
      additionalProperties: false
      required: [value, effectiveFrom]
      properties:
        value: { $ref: '#/components/schemas/Money' }
        effectiveFrom: { type: string, format: date }
        basisNote: { type: string, maxLength: 500 }
    NisabVersion:
      type: object
      required: [id, value, effectiveFrom, basisNote, setBy, createdAt, inForce, withdrawn]
      properties:
        id: { type: string, format: uuid }
        value: { $ref: '#/components/schemas/Money' }
        effectiveFrom: { type: string, format: date }
        basisNote: { type: [string, 'null'] }
        setBy: { $ref: '#/components/schemas/PersonRef' }
        createdAt: { type: string, format: date-time }
        inForce: { type: boolean, description: In force today (Dhaka date) }
        withdrawn:
          anyOf:
            - type: object
              required: [at, by, reason]
              properties:
                at: { type: string, format: date-time }
                by: { $ref: '#/components/schemas/PersonRef' }
                reason: { type: string }
            - { type: 'null' }
    PersonRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    NisabResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/NisabVersion' }
        meta: { $ref: '#/components/schemas/Meta' }
    NisabList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/NisabVersion' } }
        meta: { $ref: '#/components/schemas/ListMeta' }

    SmsProviderSetting:
      type: object
      additionalProperties: false
      required: [provider, senderId, enabled, endpoint]
      properties:
        provider:
          anyOf:
            - { type: string, pattern: '^[a-z][a-z0-9_]{1,39}$' }
            - { type: 'null' }
        senderId:
          anyOf:
            - { type: string, minLength: 1, maxLength: 20 }
            - { type: 'null' }
        enabled: { type: boolean }
        endpoint:
          anyOf:
            - { type: string, maxLength: 500 }
            - { type: 'null' }
    ChannelsResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [smtp, sms, otpDummy]
          properties:
            smtp:
              type: object
              required: [host, port, secure, from, loginSet]
              properties:
                host: { type: string }
                port: { type: integer }
                secure: { type: boolean }
                from: { type: string }
                loginSet: { type: boolean }
            sms:
              type: object
              required: [mode, keyPresent, config, updatedAt]
              properties:
                mode: { type: string, enum: [logging, dry_run] }
                keyPresent: { type: boolean }
                config: { $ref: '#/components/schemas/SmsProviderSetting' }
                updatedAt: { type: [string, 'null'], format: date-time }
            otpDummy: { type: boolean }
        meta: { $ref: '#/components/schemas/Meta' }
    StorageFigure:
      type: object
      required: [count, bytes]
      properties:
        count: { type: integer }
        bytes: { type: integer }
    SystemHealthResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [ready, checks, version, environment, otpDummy, auditPartitionsUntil, storage]
          properties:
            ready: { type: boolean }
            checks:
              type: object
              required: [database, storage, queue]
              properties:
                database: { type: string, enum: [up, down] }
                storage: { type: string, enum: [up, down] }
                queue: { type: string, enum: [up, down] }
            version: { type: string }
            environment: { type: string }
            otpDummy: { type: boolean }
            auditPartitionsUntil: { type: [string, 'null'], pattern: '^[0-9]{4}-[0-9]{2}$' }
            storage:
              description: Null when the database did not answer in time (the checks then show it down)
              type: [object, 'null']
              required: [total, byKind, byBucket, byMonth, measuredAt]
              properties:
                total: { $ref: '#/components/schemas/StorageFigure' }
                byBucket:
                  type: array
                  description: Each bucket now, and its growth in bytes since the nightly snapshot of at least 30 days ago (null until one exists)
                  items:
                    allOf:
                      - { $ref: '#/components/schemas/StorageFigure' }
                      - type: object
                        required: [bucket, monthGrowth]
                        properties:
                          bucket: { type: string }
                          monthGrowth: { type: [integer, 'null'] }
                byKind:
                  type: array
                  items:
                    allOf:
                      - { $ref: '#/components/schemas/StorageFigure' }
                      - { type: object, required: [kind], properties: { kind: { type: string } } }
                byMonth:
                  type: array
                  items:
                    allOf:
                      - { $ref: '#/components/schemas/StorageFigure' }
                      - { type: object, required: [month], properties: { month: { type: string } } }
                measuredAt: { type: string, format: date-time }
        meta: { $ref: '#/components/schemas/Meta' }
    AuditEntry:
      type: object
      required: [id, createdAt, action, entityType, entityId, actor, actorRole, reason, ip, deviceSessionId, old, new]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: [string, 'null'], format: uuid }
        actor:
          anyOf:
            - { $ref: '#/components/schemas/PersonRef' }
            - { type: 'null' }
        actorRole: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        ip: { type: [string, 'null'] }
        deviceSessionId: { type: [string, 'null'], format: uuid }
        old: { description: 'Snapshot before the change, secrets dropped' }
        new: { description: 'Snapshot after the change, secrets dropped' }
    AuditEntryList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        meta:
          allOf:
            - { $ref: '#/components/schemas/ListMeta' }
            - type: object
              required: [from, to]
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
    ActiveSession:
      type: object
      required: [id, person, deviceName, platform, appVersion, createdAt, lastSeenAt]
      properties:
        id: { type: string, format: uuid }
        person:
          type: object
          required: [id, name, kind, systemOwner]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            kind: { type: string, enum: [staff, volunteer] }
            systemOwner: { type: boolean }
        deviceName: { type: [string, 'null'] }
        platform: { type: [string, 'null'] }
        appVersion: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
    ActiveSessionList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ActiveSession' } }
        meta: { $ref: '#/components/schemas/ListMeta' }

    # ---------------- sync ----------------
    SyncRecord:
      type: object
      additionalProperties: false
      required: [clientUuid, kind, projectId, formVersionId, payload, clientCreatedAt, clientUpdatedAt]
      description: "One offline write; the kinds of the other modules (activities, stock, expenses, vouchers, consent, edit requests, contact updates) join with those modules"
      properties:
        clientUuid: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [application_draft, application_update, application_submit, field_update] }
        target:
          anyOf:
            - { type: string, format: uuid }
            - { type: 'null' }
          description: "The application or unlock the record acts on; absent for a new draft, which the dependency names"
        projectId: { $ref: '#/components/schemas/Uuid' }
        formVersionId: { $ref: '#/components/schemas/Uuid' }
        baseVersion:
          anyOf:
            - { type: string, maxLength: 64 }
            - { type: 'null' }
          description: "The ETag the edit started from; the current one is taken when absent"
        payload:
          type: object
          propertyNames: { type: string }
          additionalProperties: {}
          description: "Validated by the service of the record kind: { answers } for a draft and an update (a photo still on the phone travels as { pendingPhoto: true, slot }), {} for a submit, { unlockId, value } for a field update"
        clientCreatedAt: { type: string, format: date-time }
        clientUpdatedAt: { type: string, format: date-time }
        dependencies: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/Uuid' }, description: "Client ids this record needs synced first; a failed one fails this record" }
    SyncBatchRequest:
      type: object
      additionalProperties: false
      required: [deviceTime, records]
      properties:
        deviceTime: { type: string, format: date-time, description: "The phone's clock, so the server can move the records' times onto its own" }
        records: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/SyncRecord' } }
        pendingAfter: { type: integer, minimum: 0, maximum: 100000, description: "Records still waiting on the device after this batch, shown on the sessions screens" }
    SyncBatchResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [serverTime, results]
          properties:
            serverTime: { type: string, format: date-time }
            results: { type: array, items: { $ref: '#/components/schemas/RowResult' } }
        meta: { $ref: '#/components/schemas/Meta' }
    SnapshotResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [serverTime, nextSince, nextAfterId, hasMore, projects, formVersions, applications, applicationIds, locationsVersion]
          properties:
            serverTime: { type: string, format: date-time, description: The database clock when the answer was built }
            nextSince: { type: string, format: date-time, description: "What the phone asks since next: the same window while more wait, else a minute before now (a repeated row is harmless)" }
            nextAfterId: { type: [string, 'null'], format: uuid, description: "While more wait, the last row of this page, carried as afterId by the next ask" }
            hasMore: { type: boolean, description: More changed applications wait beyond this page }
            projects: { type: array, items: { $ref: '#/components/schemas/MyProject' }, description: "The volunteer's consented projects; empty for an official" }
            formVersions:
              type: array
              description: "The published application form of each project, as the caller's audience sees it, each with the project it belongs to"
              items:
                allOf:
                  - $ref: '#/components/schemas/FormVersion'
                  - type: object
                    required: [projectId]
                    properties:
                      projectId: { $ref: '#/components/schemas/Uuid' }
            applications: { type: array, items: { $ref: '#/components/schemas/ApplicationSummary' }, description: "The own applications changed at or after the given time, oldest change first, at most 500 per page" }
            applicationIds: { type: array, items: { $ref: '#/components/schemas/Uuid' }, description: "Every own application the server still lists; the phone drops what is missing" }
            locationsVersion: { type: string, description: "Changes with any location row; the phone pulls /locations/all again when it differs" }
        meta: { $ref: '#/components/schemas/Meta' }

paths:
  # ======================= health =======================
  /healthz:
    get:
      tags: [health]
      operationId: health.live
      summary: Liveness probe
      security: []
      description: >-
        Liveness: pass whenever the process can answer. Never checks a dependency, so an outage elsewhere never gets a healthy API restarted. Not rate-limited and not in the request log.
      x-permission: public
      x-scope: system
      x-audit: none
      x-idempotency: none
      x-rate-limit: probe
      responses:
        '200':
          description: The status alone; Cache-Control no-store; HEAD answers the same without a body
          content:
            application/health+json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
  /livez:
    get:
      tags: [health]
      operationId: health.live.alias
      summary: Liveness probe under the name Kubernetes uses
      security: []
      description: >-
        Liveness: pass whenever the process can answer. Never checks a dependency, so an outage elsewhere never gets a healthy API restarted. Not rate-limited and not in the request log.
      x-permission: public
      x-scope: system
      x-audit: none
      x-idempotency: none
      x-rate-limit: probe
      responses:
        '200':
          description: The status alone; Cache-Control no-store; HEAD answers the same without a body
          content:
            application/health+json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
  /readyz:
    get:
      tags: [health]
      operationId: health.ready
      summary: Readiness probe
      security: []
      description: >-
        Readiness: the database and the job queue (critical) and the file store (not critical) checked side by side, each within 2 seconds; a finished result is reused for 2 seconds. warn when only the file store is down; fail with 503 when a critical check is down or the API is shutting down. Which check failed goes to the log only. Not rate-limited and not in the request log.
      x-permission: public
      x-scope: system
      x-audit: none
      x-idempotency: none
      x-rate-limit: probe
      responses:
        '200':
          description: The status alone; Cache-Control no-store; HEAD answers the same without a body
          content:
            application/health+json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '503':
          description: fail, a critical check is down or the API is shutting down
          content:
            application/health+json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
  # ======================= auth =======================
  /auth/invitations/check:
    post:
      tags: [auth]
      operationId: auth.invitation.check
      summary: The name and job ID of an open set-password link (404 unknown, 410 used or expired)
      description: >-
        DECISION_LOG D-097, BR-262. The token comes from the fragment of the link and travels in
        the body, never in a URL. 404 auth.invitation_invalid; 410 auth.invitation_expired.
      security: []
      x-permission: public
      x-scope: self
      x-audit: none
      x-idempotency: none
      x-rate-limit: public-form
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationCheckRequest' }
      responses:
        '200':
          description: The open link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationViewResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/invitations/accept:
    post:
      tags: [auth]
      operationId: auth.invitation.accept
      summary: Set the first password through the link; the account becomes active and logs in with the job ID
      description: >-
        BR-262. The password follows the rules of the role (12 characters for a global role); the
        link is used once.
      security: []
      x-permission: public
      x-scope: self
      x-audit: auth.invitation_accepted
      x-idempotency: none
      x-rate-limit: public-form
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationAcceptRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/register/start:
    post:
      tags: [auth]
      operationId: auth.registration.start
      summary: Start a registration draft of a kind; nothing is sent, each contact is verified on its own (D-090)
      security: []
      x-permission: public
      x-scope: self
      x-audit: auth.register_started
      x-idempotency: none
      x-rate-limit: registration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationStartRequest' }
      responses:
        '201':
          description: Draft started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationStartResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/register/otp/send:
    post:
      tags: [auth]
      operationId: auth.registration.resendOtp
      summary: Send an OTP to one contact of the draft; a changed address clears that channel (D-090; dummy code in dev/test)
      security: []
      x-permission: public
      x-scope: self
      x-audit: auth.otp_sent
      x-idempotency: none
      x-rate-limit: otp-request
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpSendRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/register/otp/verify:
    post:
      tags: [auth]
      operationId: auth.registration.verifyOtp
      summary: Verify the OTP of one channel; once both are verified returns the draft token once (BR-023, D-082, D-090); a contact of an existing account answers registration.account_exists only then (D-086)
      security: []
      x-permission: public
      x-scope: self
      x-audit: auth.otp_verified
      x-idempotency: none
      x-rate-limit: otp-verify
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
      responses:
        '200':
          description: The channel is verified; with both, the draft token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationVerifiedResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/register/photos/{slot}:
    parameters:
      - name: slot
        in: path
        required: true
        schema: { type: string, enum: [photo, nid_photo, nid_photo_back] }
    post:
      tags: [auth]
      operationId: auth.registration.uploadPhoto
      summary: Upload the photo or the NID photo of a verified draft (JPEG or PNG, at most 2 MB; metadata stripped; replaces the slot's earlier upload; D-087)
      security: []
      x-permission: public
      x-scope: self
      x-audit: file.uploaded
      x-idempotency: none
      x-rate-limit: public-form
      x-sensitive-fields: [volunteer.identity]
      parameters:
        - $ref: '#/components/parameters/RegistrationToken'
        - name: registrationId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: source
          in: query
          schema: { type: string, enum: [camera, gallery] }
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadedPhotoResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '413': { $ref: '#/components/responses/Unprocessable' }
        '415': { $ref: '#/components/responses/Unprocessable' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/register/submit:
    post:
      tags: [auth]
      operationId: auth.registration.submit
      summary: Submit the registration form of the draft's kind; the account is created in state pending, or a rejected never-approved account returns to pending (D-086)
      security: []
      x-permission: public
      x-scope: self
      x-audit: auth.registered
      x-idempotency: none
      x-rate-limit: registration
      x-sensitive-fields: [volunteer.identity, volunteer.bank]
      parameters:
        - $ref: '#/components/parameters/RegistrationToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationSubmitRequest' }
      responses:
        '201':
          description: Registered; awaiting approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/login:
    post:
      tags: [auth]
      operationId: auth.session.login
      summary: Log in with job ID, mobile or email and password; no OTP at login (O-05, D-097)
      security: []
      x-permission: public
      x-scope: self
      x-audit: auth.login
      x-idempotency: none
      x-rate-limit: login
      parameters:
        - $ref: '#/components/parameters/ClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Tokens issued; the refresh cookie is set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '423': { $ref: '#/components/responses/Locked' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/refresh:
    post:
      tags: [auth]
      operationId: auth.session.refresh
      summary: Rotate the refresh token and issue a new access token
      security:
        - refreshCookie: []
      x-permission: public
      x-scope: self
      x-audit: none
      x-idempotency: none
      x-rate-limit: refresh
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: auth.session.logout
      summary: Revoke the current device session; the PWA wipes local data
      x-permission: authenticated
      x-scope: self
      x-audit: auth.logout
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /auth/me:
    get:
      tags: [auth]
      operationId: auth.me.get
      summary: Current user, roles, language and state (block message when blocked)
      x-permission: authenticated
      x-scope: self
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password/change:
    post:
      tags: [auth]
      operationId: auth.password.change
      summary: Change own password; revokes the user's other device sessions
      x-permission: authenticated
      x-scope: self
      x-audit: auth.password_changed
      x-idempotency: none
      x-rate-limit: password-reset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/password/reset/start:
    post:
      tags: [auth]
      operationId: auth.password.resetStart
      summary: Send a password-reset OTP; the response is the same whether or not the id exists
      security: []
      x-permission: public
      x-scope: self
      x-audit: auth.password_reset_started
      x-idempotency: none
      x-rate-limit: password-reset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetStartRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/password/reset/complete:
    post:
      tags: [auth]
      operationId: auth.password.resetComplete
      summary: Set a new password with the OTP; revokes all device sessions
      security: []
      x-permission: public
      x-scope: self
      x-audit: auth.password_reset_completed
      x-idempotency: none
      x-rate-limit: otp-verify
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetCompleteRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ======================= sessions =======================
  /sessions:
    get:
      tags: [sessions]
      operationId: sessions.own.list
      summary: List own device sessions
      x-permission: session.revoke_own
      x-scope: self
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: Own sessions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceSessionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /sessions/active:
    get:
      tags: [sessions]
      operationId: sessions.active.list
      summary: Every active device session, newest started first, with a search by person
      description: >-
        For the Department Head and the Monitoring Team (session.revoke_user at global scope;
        DECISION_LOG D-098). Active means not revoked and not past its expiry (as the own session
        list; an idle session that can no longer refresh still shows); the system actor is never
        listed. A row carries the session id, the person, the device name, platform, app version,
        start and last seen; never a token hash or an IP address. Ending a session uses
        POST /users/{userId}/sessions/{sessionId}/revoke, which keeps the Main Admin's sessions for
        the Main Admin.
      x-permission: session.revoke_user
      x-scope: global
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - name: kind
          in: query
          schema: { type: string, enum: [staff, volunteer] }
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveSessionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServerError' }
  /sessions/{sessionId}/revoke:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [sessions]
      operationId: sessions.own.revoke
      summary: Revoke one of own device sessions (not the current one; use logout)
      x-permission: session.revoke_own
      x-scope: self
      x-audit: auth.session_revoked
      x-idempotency: none
      x-rate-limit: default
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{userId}/sessions:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [sessions]
      operationId: sessions.user.list
      summary: List a user's device sessions (lost phone)
      x-permission: session.revoke_user
      x-scope: user
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: The user's sessions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceSessionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{userId}/sessions/{sessionId}/revoke:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [sessions]
      operationId: sessions.user.revoke
      summary: Revoke a user's device session with a reason; the device wipes local data
      x-permission: session.revoke_user
      x-scope: user
      x-audit: auth.session_revoked_by_official
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ======================= users =======================
  /users:
    get:
      tags: [users]
      operationId: users.user.list
      summary: List users within scope (assignee pickers, permission panel)
      x-permission: permission.view
      x-scope: user
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IncludeTotal'
        - $ref: '#/components/parameters/Search'
        - name: role
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string, enum: [pending, active, blocked, deactivated] }
        - name: kind
          in: query
          schema: { type: string, enum: [staff, volunteer] }
        - name: affiliation
          in: query
          description: Department staff, another department of the Foundation or an outside partner (D-097)
          schema: { type: string, enum: [department, foundation, external] }
        - name: programId
          in: query
          description: The official's home program
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    post:
      tags: [users]
      operationId: users.user.create
      summary: Create an official with job ID, role and place; the set-password link is emailed and returned once
      description: >-
        DECISION_LOG D-097, BR-261. The account is pending without a password until the link is
        used. A failed email keeps the account (emailed false); the admin copies the link. Errors
        409 user.job_id_taken, registration.account_exists; 422 validation.option_unknown (roleKey,
        homeProgramId, homeDivisionId), user.supervisor_invalid (supervisorUserId).
      x-permission: user.create
      x-scope: global
      x-audit: user.created
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffCreateRequest' }
      responses:
        '201':
          description: Created; the link is shown once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationIssuedResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /users/{userId}/invitation:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [users]
      operationId: users.user.invite
      summary: A new set-password link for an official without a password, to a corrected email if given; the open link is revoked
      description: >-
        BR-262. A corrected email replaces the stored one first (audited as user.email_corrected),
        so a link sent to a mistyped address dies. 409 user.invitation_not_needed once a password is
        set; 409 user.not_staff for a volunteer; 409 registration.account_exists for an email of
        another account. Held at GLOBAL scope only.
      x-permission: user.create
      x-scope: global
      x-audit: user.invited
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationRenewRequest' }
      responses:
        '201':
          description: The new link, shown once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationIssuedResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      operationId: users.user.get
      summary: Get a user
      x-permission: permission.view
      x-scope: user
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: User
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{userId}/projects-work:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      operationId: users.user.projectsWork
      summary: "An official's projects by year with the figures of their work there"
      description: >-
        Another official's projects and figures (D-147, BR-293): every project for the Department
        Head and the Monitoring Team, the projects of the caller's own programs for a Program
        Manager; an official outside the caller's programs is not found.
      x-permission: staff.work.view
      x-scope: user
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: The official's projects and figures
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/ProjectsWork' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServerError' }
  /users/{userId}/profile:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [users]
      operationId: users.user.updateProfile
      summary: Replace an official's job ID, name, designation, affiliation, program, division and supervisor
      description: >-
        DECISION_LOG D-097, BR-261; existing officials too. Audited with the before and after
        values. 409 user.job_id_taken, user.not_staff; 422 user.supervisor_invalid.
      x-permission: user.profile.manage
      x-scope: global
      x-audit: user.profile_changed
      x-idempotency: none
      x-rate-limit: default
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffProfileRequest' }
      responses:
        '200':
          description: Updated user
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
