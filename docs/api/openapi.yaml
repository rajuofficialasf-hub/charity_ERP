  # ======================= exports =======================
  /exports/columns:
    get:
      tags: [exports]
      operationId: exports.column.list
      summary: >-
        The columns of a list the caller may export, in the file's order; a project's application
        list adds its form questions by section (a project out of the caller's reach answers 404)
      x-permission: export.list
      x-scope: self
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      parameters:
        - { name: list, in: query, required: true, schema: { type: string, enum: [volunteers, beneficiaries, applications] } }
        - { name: projectId, in: query, required: false, schema: { type: string, format: uuid }, description: Required for the application list only }
      responses:
        '200':
          description: The columns
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportColumnsResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /exports:
    post:
      tags: [exports]
      operationId: exports.job.create
      summary: >-
        Start an export job with the list's rows, the caller's scope and field masks frozen;
        protected columns need export.beneficiaries, export.volunteers or export.forms
      description: >-
        Needs the list's own read permission beside export.list. A column the caller may not
        export answers 403; over 100,000 rows, or 1,000 for a PDF, answers 422 before any job
        exists; a fourth waiting or running export of the caller answers 409 (a job older than 30
        minutes no longer counts). Every request writes export.requested with the list, filters,
        columns, format, row count and whether the file is sensitive.
      x-permission: export.list
      x-scope: self
      x-audit: export.requested
      x-idempotency: none
      x-rate-limit: export
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportCreate' }
      responses:
        '202':
          description: Job queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportJobResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [exports]
      operationId: exports.job.list
      summary: "The caller's own export jobs of the last 30 days, the newest first"
      x-permission: authenticated
      x-scope: self
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportJobListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /exports/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [exports]
      operationId: exports.job.get
      summary: "One of the caller's own export jobs with its progress; anyone else's answers 404"
      x-permission: authenticated
      x-scope: self
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportJobResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /beneficiaries/{beneficiaryId}/pdf:
    parameters:
      - $ref: '#/components/parameters/BeneficiaryId'
    post:
      tags: [exports]
      operationId: exports.beneficiaryProfile.create
      summary: >-
        Start the PDF of a beneficiary's 360° profile as the caller may read it; the NID only with
        export.beneficiaries
      description: >-
        Needs report.beneficiary_journey reaching the profile beside its own read. The profile is read
        now through the profile route's schema and mask, with the classes the caller may export for
        this record, and the job prints exactly that; the job keeps no copy of the record once it
        ends. A profile out of reach answers 404 before any job exists.
      x-permission: report.beneficiary_journey
      x-scope: beneficiary
      x-audit: export.requested
      x-idempotency: none
      x-rate-limit: export
      responses:
        '202':
          description: Job queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportJobResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /applications/{applicationId}/pdf:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    post:
      tags: [exports]
      operationId: exports.application.create
      summary: >-
        Start the PDF of one application as the caller may read it; the official section only with
        export.forms
      description: >-
        Needs export.list beside the application's own read. The record is read now through the
        record route's schema and mask; the official section and the identity answer stay only where
        the caller's export permissions reach the record. An application out of reach answers 404.
      x-permission: export.list
      x-scope: application
      x-audit: export.requested
      x-idempotency: none
      x-rate-limit: export
      responses:
        '202':
          description: Job queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportJobResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ======================= reference =======================
  /locations:
    get:
