      x-rate-limit: otp-verify
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetCompleteRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ======================= sessions =======================
  /sessions:
    get:
      tags: [sessions]
      operationId: sessions.own.list
      summary: List own device sessions
      x-permission: session.revoke_own
      x-scope: self
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: Own sessions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceSessionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /sessions/active:
    get:
      tags: [sessions]
      operationId: sessions.active.list
      summary: Every active device session, newest started first, with a search by person
      description: >-
        For the Department Head and the Monitoring Team (session.revoke_user at global scope;
        DECISION_LOG D-098). Active means not revoked and not past its expiry (as the own session
        list; an idle session that can no longer refresh still shows); the system actor is never
        listed. A row carries the session id, the person, the device name, platform, app version,
        start and last seen; never a token hash or an IP address. Ending a session uses
        POST /users/{userId}/sessions/{sessionId}/revoke, which keeps the Main Admin's sessions for
        the Main Admin.
      x-permission: session.revoke_user
      x-scope: global
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - name: kind
          in: query
          schema: { type: string, enum: [staff, volunteer] }
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveSessionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServerError' }
  /sessions/{sessionId}/revoke:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [sessions]
      operationId: sessions.own.revoke
      summary: Revoke one of own device sessions (not the current one; use logout)
      x-permission: session.revoke_own
      x-scope: self
      x-audit: auth.session_revoked
      x-idempotency: none
      x-rate-limit: default
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{userId}/sessions:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [sessions]
      operationId: sessions.user.list
      summary: List a user's device sessions (lost phone)
      x-permission: session.revoke_user
      x-scope: user
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: The user's sessions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceSessionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{userId}/sessions/{sessionId}/revoke:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [sessions]
      operationId: sessions.user.revoke
      summary: Revoke a user's device session with a reason; the device wipes local data
      x-permission: session.revoke_user
      x-scope: user
      x-audit: auth.session_revoked_by_official
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ======================= users =======================
  /users:
    get:
      tags: [users]
      operationId: users.user.list
      summary: List users within scope (assignee pickers, permission panel)
      x-permission: permission.view
      x-scope: user
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IncludeTotal'
        - $ref: '#/components/parameters/Search'
        - name: role
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string, enum: [pending, active, blocked, deactivated] }
        - name: kind
          in: query
          schema: { type: string, enum: [staff, volunteer] }
        - name: affiliation
          in: query
          description: Department staff, another department of the Foundation or an outside partner (D-097)
          schema: { type: string, enum: [department, foundation, external] }
        - name: programId
          in: query
          description: The official's home program
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    post:
      tags: [users]
      operationId: users.user.create
      summary: Create an official with job ID, role and place; the set-password link is emailed and returned once
      description: >-
        DECISION_LOG D-097, BR-261. The account is pending without a password until the link is
        used. A failed email keeps the account (emailed false); the admin copies the link. Errors
        409 user.job_id_taken, registration.account_exists; 422 validation.option_unknown (roleKey,
        homeProgramId, homeDivisionId), user.supervisor_invalid (supervisorUserId).
      x-permission: user.create
      x-scope: global
      x-audit: user.created
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffCreateRequest' }
      responses:
        '201':
          description: Created; the link is shown once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationIssuedResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /users/{userId}/invitation:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [users]
      operationId: users.user.invite
      summary: A new set-password link for an official without a password, to a corrected email if given; the open link is revoked
      description: >-
        BR-262. A corrected email replaces the stored one first (audited as user.email_corrected),
        so a link sent to a mistyped address dies. 409 user.invitation_not_needed once a password is
        set; 409 user.not_staff for a volunteer; 409 registration.account_exists for an email of
        another account. Held at GLOBAL scope only.
      x-permission: user.create
      x-scope: global
      x-audit: user.invited
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationRenewRequest' }
      responses:
        '201':
          description: The new link, shown once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationIssuedResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      operationId: users.user.get
      summary: Get a user
      x-permission: permission.view
      x-scope: user
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: User
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{userId}/profile:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [users]
      operationId: users.user.updateProfile
      summary: Replace an official's job ID, name, designation, affiliation, program, division and supervisor
      description: >-
        DECISION_LOG D-097, BR-261; existing officials too. Audited with the before and after
        values. 409 user.job_id_taken, user.not_staff; 422 user.supervisor_invalid.
      x-permission: user.profile.manage
      x-scope: global
      x-audit: user.profile_changed
      x-idempotency: none
      x-rate-limit: default
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffProfileRequest' }
      responses:
        '200':
          description: Updated user
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /organogram:
    get:
      tags: [users]
      operationId: users.organogram.get
      summary: The department's own staff by program and supervisor; other departments and partners are left out
      description: >-
        DECISION_LOG D-097, BR-263. Computed from the roles, the home program, the programs' PMs
        and the supervisor line: the global roles under leadership, each program with its
        officials nested under their supervisor, and the officials without a place under
        unplaced. Deactivated officials are left out; the caller sees the officials of their scope.
      x-permission: permission.view
      x-scope: user
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: Organogram
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganogramResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/{userId}/state:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [users]
      operationId: users.user.changeState
      summary: Change account state with a reason; deactivation requires a completed handover
      x-permission: user.state.change
      x-scope: user
      x-audit: auth.state_changed
      x-idempotency: none
      x-rate-limit: default
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserStateRequest' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /users/{userId}/unlock:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [users]
      operationId: users.user.unlock
      summary: Clear a login lock with a reason (O-59; AUTH.md 6)
      x-permission: user.lock.clear
      x-scope: user
      x-audit: auth.lock_cleared
      x-idempotency: none
      x-rate-limit: default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /users/{userId}/handover:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      operationId: users.handover.get
      summary: Pending work of an official by category, and the handover state (BD-08, BR-034)
      x-permission: user.handover
      x-scope: user
      x-audit: none
      x-idempotency: none
      x-rate-limit: default
      responses:
        '200':
          description: Handover state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoverResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [users]
      operationId: users.handover.assign
