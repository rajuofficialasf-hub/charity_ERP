# permissions.yaml - single source of truth for permission names, default grants and scopes.
# Status: complete, task T0.10 (2026-10-10). Loaded by the implementation (T1.8) and used to generate the
# authorization-matrix test. The matrix in docs/security/RBAC.md is verified against this file.
#
# Schema
#   version            integer, bumped on any structural change
#   scopes             scope names from broad to narrow (blueprint B4)
#   conditions         named conditions used in default grants; the implementation maps each to a check
#   roles              role key -> name_en, name_bn, kind (official | volunteer), global_scope (true = holds
#                      every permission at GLOBAL unless a permission lists `global_roles_excluded`)
#   permission_sets    the three project-level sets of blueprint A5, assigned to volunteers per project
#   sensitive_fields   protected field classes (constitution s5, s13; BR-183) and the roles that may see them;
#                      serializers and exports apply the same list
#   permissions        list of { name, name_en, name_bn (the short names the panel shows), description, module,
#                      sensitive, default: [ { role, scope, condition? } ],
#                      global_roles_excluded? }
# Naming: resource.action[.qualifier], lower-case, dotted. Module ids are those of docs/MODULE_CATALOG.md.
# Default deny: a permission not granted by role default, permission set, project grant or panel override is denied.
version: 1

scopes: [GLOBAL, PROGRAM, PROJECT, REGION, DISTRICT, UPAZILA, UNION, ASSIGNED, SELF]

conditions:
  if_rpm_grants: "Not held by default; the RPM may grant it per project (blueprint A4 'RM দিলে')"
  house_construction_only: "Only on projects whose workflow template is Construction (BD-24)"
  safe_water_only: "Only on projects whose workflow template is Advance + construction + voucher (A8.4)"
  house_construction_project: "Only on house-construction projects the team is attached to (Q-46)"
  own_created: "Only records the user created (team members, BR-041)"
  own_or_paid_volunteer_issues: "Only issues raised by the Procurement Team itself or by paid volunteers (Q-46)"
  own_region: "Limited to the user's region inside the project (A4 'নিজ রিজিওন')"
  own_part: "Only the team's own data (Media: stories and media; Procurement: issues) (A4 second table)"
  type_both_only: "Only Local দায়ীs of type Both (A4 'উভয় ধরন হলে')"
  tree_planting_only: "Only on projects whose workflow template is Open application + visit (A8.5)"
  no_open_applications: "Only when the target volunteer has no open applications (O-25)"

roles:
  admin: { name_en: Admin, name_bn: "অ্যাডমিন", kind: official, global_scope: true }
  department_head: { name_en: Department Head, name_bn: "ডিপার্টমেন্ট হেড", kind: official, global_scope: true }
  monitoring_team: { name_en: Monitoring Team, name_bn: "মনিটরিং টিম", kind: official, global_scope: true }
  program_manager: { name_en: Program Manager, name_bn: "প্রোগ্রাম ম্যানেজার", kind: official, global_scope: false }
  regional_program_manager: { name_en: Regional Program Manager, name_bn: "রিজিওনাল প্রোগ্রাম ম্যানেজার", kind: official, global_scope: false }
  project_executive: { name_en: Project Executive, name_bn: "প্রজেক্ট এক্সিকিউটিভ", kind: official, global_scope: false }
  official_daee: { name_en: "Official দায়ী", name_bn: "অফিসিয়াল দায়ী", kind: official, global_scope: false }
  procurement_team: { name_en: Procurement Team, name_bn: "প্রকিউরমেন্ট টিম", kind: official, global_scope: false }
  media_team: { name_en: Media Team, name_bn: "মিডিয়া টিম", kind: official, global_scope: false }
  media_director: { name_en: Media Director, name_bn: "মিডিয়া ডিরেক্টর", kind: official, global_scope: false }
  media_assistant_director: { name_en: Media Assistant Director, name_bn: "মিডিয়া অ্যাসিস্ট্যান্ট ডিরেক্টর", kind: official, global_scope: false }
  finance_team: { name_en: Finance Team, name_bn: "ফাইন্যান্স টিম", kind: official, global_scope: false }
  volunteer_general: { name_en: General Volunteer, name_bn: "জেনারেল স্বেচ্ছাসেবক", kind: volunteer, global_scope: false }
  volunteer_local_daee: { name_en: "Local দায়ী", name_bn: "স্থানীয় দায়ী", kind: volunteer, global_scope: false }
  volunteer_both: { name_en: "দাঈ-স্বেচ্ছাসেবক (both)", name_bn: "দাঈ-স্বেচ্ছাসেবক", kind: volunteer, global_scope: false }
  volunteer_team_member: { name_en: Team Member, name_bn: "টিম মেম্বার", kind: volunteer, global_scope: false }
  volunteer_paid: { name_en: Paid Volunteer, name_bn: "পেইড ভলান্টিয়ার", kind: volunteer, global_scope: false }

# Project-level permission sets (blueprint A5). Assigned on project_volunteers.permission_set; scope SELF unless noted.
permission_sets:
  application_distribution:
    for: [volunteer_general, volunteer_both]
    permissions:
      - application.create
      - application.submit
      - application.edit_draft
      - application.edit_pending
      - application.delete_pending
      - application.view
      - application.update_unlocked_field
      - beneficiary.lookup
      - beneficiary.match
      - stock.receive
      - distribution.update
      - site_verification.record
      - voucher.submit
      - expense.claim.submit
      - issue.raise
      - volunteer.team.manage
      - file.upload
      - sync.batch
      - session.revoke_own
  application_distribution_dawah:
    for: [volunteer_local_daee, volunteer_both]
    extends: application_distribution
    permissions:
      - class.record
      - exam.record            # condition if_rpm_grants (A4 'স্থানীয় দায়ী RM দিলে')
  work_progress:
    for: [volunteer_paid]
    permissions:
      - application.view        # scope PROJECT, read only (A8.2)
      - progress.update         # scope ASSIGNED
      - issue.raise
      - expense.claim.submit
      - file.upload
      - sync.batch
      - session.revoke_own

# Protected field classes. visible_to lists the roles that may receive the field on screens and in exports.
# global_scope roles (admin, department_head, monitoring_team) are always included.
sensitive_fields:
  - key: beneficiary.nid
    fields: [beneficiaries.nid, beneficiaries.birth_reg, "files where kind = nid_photo (beneficiary)", "hasDocument (whether an NID or a birth registration number is on file; told with the class alone, the numbers themselves only inside the beneficiary.view_nid scope; D-172)"]
    visible_to: [program_manager, regional_program_manager, project_executive, official_daee]
    source: "B8: NID number and photo visible to all official staff who do project work, never to volunteers, Media, Finance, Procurement"
  - key: beneficiary.contact
    fields: [beneficiaries.mobile, beneficiaries.mobile_owner_code, beneficiaries.mobile_owner_name, beneficiary_family_members.*]
    visible_to: [program_manager, regional_program_manager, project_executive, official_daee]
    source: "O-67, D-094: not to the Media or Procurement Team, in lists, profiles, search and filters. D-172: whose number the mobile is and that person's name are hidden wherever the mobile is (the profile, its contact history, the export of the list, the two answers on an application's record). A question of an application's form that fills one of these columns is withheld like the column: its answer is hidden on the record and neither offered nor written in an export of the application list or the application's PDF for a reader without this class. The household's members on a profile, each one's link to the profile it probably is and the family that holds the person go with this class. The family section of a profile is accepted to tell a viewer whose reach is narrower than the family one thing beyond it: how many of the family's members chose a profile the viewer cannot open that was helped, as a bare number, never who, when, where or how much"
  - key: beneficiary.address_detail
    fields: [beneficiaries.union_id, beneficiaries.village, beneficiaries.post_office, beneficiaries.post_code, beneficiaries.landmark, beneficiaries.latitude, beneficiaries.longitude]
    visible_to: [program_manager, regional_program_manager, project_executive, official_daee, procurement_team]
    source: "O-67, D-094: the Media Team sees the area down to the upazila only"
  - key: beneficiary.profile_detail
    fields: [beneficiaries.father_or_husband_name, beneficiaries.guardian_relation_code, beneficiaries.mother_name, beneficiaries.gender_code, beneficiaries.age_years, beneficiaries.class_code, beneficiaries.class_other_text, beneficiaries.occupation_code, beneficiaries.photo_file_id]
    visible_to: [program_manager, regional_program_manager, project_executive, official_daee]
    source: "O-67, D-094: the Media and Procurement Teams get only the name, the area, the projects and distribution. D-174: whether the father's or husband's name is the father's or the husband's goes with that name, on the profile and on an application's record"
  - key: beneficiary.application_history
    fields: [applications.app_no, applications.submitted_at, applications.reviewed_at, applications.approved_at]
    visible_to: [program_manager, regional_program_manager, project_executive, official_daee, procurement_team]
    source: "O-67, D-094: the Procurement Team sees its own projects' applications, the Media Team none. D-172: how often a person was helped (the profile's help summary, BR-307) goes with this class; a project outside the caller's rows of the profile is counted there but not named. The list's column, its filter on more than once in a year, its order and the two export columns use the total across all projects, so a holder whose scope is a few projects (the Procurement Team) learns there and on the profile that a person was helped elsewhere and in which year, never in which project. What a family received on the profile goes with this class and the contact class together, summed only over the profiles the caller reaches, the others a bare number of people. The family section of a profile is accepted to tell a viewer whose reach is narrower than the family one thing beyond it: how many of the family's members chose a profile the viewer cannot open that was helped, as a bare number, never who, when, where or how much"
  - key: beneficiary.care
    fields: [call_logs.*, followup_evaluations.*, class_attendance.*, learning_progress.*, exam_results.*, activities.*, beneficiaries.is_blocked]
    visible_to: [program_manager, regional_program_manager, project_executive, official_daee]
    source: "O-67, D-094: care and follow-up data and the blocklist status, not to the Media or Procurement Team"
  - key: volunteer.identity
    fields: [volunteers.nid, volunteers.nid_photo_file_id, volunteers.nid_photo_back_file_id, volunteers.blood_group, volunteers.date_of_birth]
    visible_to: [program_manager, regional_program_manager, project_executive]
    source: "A5, B8"
  - key: volunteer.bank
    fields: [volunteers.bank_name, volunteers.bank_account_name, volunteers.bank_account_number, volunteers.bank_branch_name, volunteers.bank_routing_number]
    visible_to: [program_manager, regional_program_manager, project_executive, finance_team]
    source: "A5 (used when paying operational expenses), B8"
  - key: volunteer.rating
    fields: [volunteer_ratings.*, volunteers.category, volunteers.inactive_flag, volunteer_categories_log.comment]
    visible_to: [program_manager, regional_program_manager, project_executive]
    source: "A4, A5, BD-40: never to volunteers; not to Media, Finance, Procurement"
  - key: donor.data
    fields: [donors.*, animal_shares.donor_id]
    visible_to: [program_manager, regional_program_manager, project_executive]
    source: "A4 second table, B8"
  - key: application.official_section
    fields: [form sections with visibility official_only, application_scores.*]
    visible_to: [program_manager, regional_program_manager, project_executive, official_daee, procurement_team]
    source: "B3, B4: never returned to volunteers; Procurement reads applications (A4); the Media Team reads only the official comment of a referred application, through its work (D-101 (3), D-136)"
  - key: blocklist.reason
    fields: [blocklist.reason, blocklist.blocked_by]
    visible_to: [program_manager, regional_program_manager, project_executive, official_daee]
    source: "A5, A7: reasons visible to officials only"
  - key: audit.detail
    fields: [audit_log.old, audit_log.new, audit_log.ip]
    visible_to: [program_manager, regional_program_manager]
    source: "A10: audit viewer for monitoring and management"
  - key: file.location
    fields: [files.latitude, files.longitude, files.gps_accuracy_m]
    visible_to: [program_manager, regional_program_manager, project_executive, official_daee, procurement_team]
    source: "T2.1 (D-108): the GPS position of a photo locates a beneficiary's home or a site; officials doing the project's work and the person who uploaded the file see it, never another volunteer or the Media and Finance Teams"

permissions:
  # ---- M01 Auth & Sessions -------------------------------------------------------------------------
  - name: session.revoke_own
    name_en: Sign out of own devices
    name_bn: "নিজের ডিভাইস থেকে লগআউট করা"
    description: Revoke one of the user's own device sessions
    module: M01
    sensitive: false
    default:
      - { role: program_manager, scope: SELF }
      - { role: regional_program_manager, scope: SELF }
      - { role: project_executive, scope: SELF }
      - { role: official_daee, scope: SELF }
      - { role: procurement_team, scope: SELF }
      - { role: media_team, scope: SELF }
      - { role: media_director, scope: SELF }
      - { role: media_assistant_director, scope: SELF }
      - { role: finance_team, scope: SELF }
      - { role: volunteer_general, scope: SELF }
      - { role: volunteer_local_daee, scope: SELF }
      - { role: volunteer_both, scope: SELF }
      - { role: volunteer_team_member, scope: SELF }
      - { role: volunteer_paid, scope: SELF }
  - name: session.revoke_user
    name_en: Sign another person out of a device
    name_bn: "অন্যের ডিভাইস থেকে লগআউট করানো"
    description: List and revoke another user's device sessions (lost phone), with reason
    module: M01
    sensitive: false
    default:
      - { role: regional_program_manager, scope: REGION, condition: own_region }   # volunteers in own region (O-25)
    global_roles_excluded: [monitoring_team]   # administration, with the Admin and the Head only (D-188)
  - name: user.state.change
    name_en: Change an account's state
    name_bn: "অ্যাকাউন্টের অবস্থা বদলানো"
    description: Change an account state (pending/active/blocked/deactivated) with reason; blocklist uses volunteer.block
    module: M01
    sensitive: false
    default: []
    global_roles_excluded: [monitoring_team]   # administration, with the Admin and the Head only (D-188)
  - name: user.lock.clear
    name_en: Clear a sign-in lock
    name_bn: "লগইনের লক খোলা"
    description: Clear a login lock (5 failed attempts) on a user's account with reason (O-59, AUTH.md 6)
    module: M01
    sensitive: false
    default: []
    global_roles_excluded: [monitoring_team]   # administration, with the Admin and the Head only (D-188)
  - name: user.create
    name_en: Create an official's account
    name_bn: "অফিসিয়ালের অ্যাকাউন্ট তৈরি করা"
    description: Create an official's account with job ID, role and place, and send or renew its set-password link (D-097)
    module: M01
    sensitive: false
    default: []
    global_roles_excluded: [monitoring_team]   # administration, with the Admin and the Head only (D-188)
  - name: user.profile.manage
    name_en: Edit an official's profile
    name_bn: "অফিসিয়ালের প্রোফাইল সম্পাদনা"
    description: Edit an official's job ID, name, designation, affiliation, program, division and supervisor (D-097)
    module: M01
    sensitive: false
    default: []
    global_roles_excluded: [monitoring_team]   # administration, with the Admin and the Head only (D-188)
  - name: user.deactivate_volunteer
    name_en: Deactivate a volunteer
    name_bn: "স্বেচ্ছাসেবককে নিষ্ক্রিয় করা"
    description: Deactivate a volunteer who has no open applications
    module: M03
    sensitive: false
    default:
      - { role: program_manager, scope: PROGRAM, condition: no_open_applications }
      - { role: regional_program_manager, scope: REGION, condition: no_open_applications }
  - name: user.handover
    name_en: Hand over work and deactivate an account
    name_bn: "কাজ হস্তান্তর ও অ্যাকাউন্ট নিষ্ক্রিয় করা"
    description: Run the staff handover and deactivate an official's account
    module: M03
    sensitive: false
    default: []
    global_roles_excluded: [monitoring_team]   # administration, with the Admin and the Head only (D-188)
  - name: system.owner.transfer
    name_en: Hand over the Main Admin
    name_bn: "মূল অ্যাডমিনের দায়িত্ব হস্তান্তর"
    description: Hand the Main Admin (system owner) flag to another Admin; the Main Admin's own act (D-188)
    module: M01
    sensitive: false
    default:
      - { role: admin, scope: GLOBAL }
    global_roles_excluded: [monitoring_team, department_head]

  # ---- M02 Users, Roles & Permissions --------------------------------------------------------------
  - name: permission.panel.manage
    name_en: Give and take away permissions
    name_bn: "পারমিশন দেওয়া ও তুলে নেওয়া"
    description: Grant or revoke any permission for any user at a chosen scope (permission panel)
    module: M02
    sensitive: false
    default: []
    global_roles_excluded: [monitoring_team]   # administration, with the Admin and the Head only (D-188)
  - name: user.role.change
    name_en: Change an official's role
    name_bn: "অফিসিয়ালের রোল বদলানো"
    description: Change an official's role with a reason, after the handover of the old role's work (D-188)
    module: M02
    sensitive: false
    default: []
    global_roles_excluded: [monitoring_team]   # administration, with the Admin and the Head only (D-188)
  - name: user.extra_area.manage
    name_en: Give and end extra areas
    name_bn: "বাড়তি এলাকা দেওয়া ও শেষ করা"
    description: Give an official an extra area for volunteers (a division, a district or the whole country) and take it away, inside the giver's own reach (D-193)
    module: M02
    sensitive: false
    default:
      - { role: program_manager, scope: PROGRAM }
      - { role: regional_program_manager, scope: REGION }
    global_roles_excluded: [monitoring_team]   # administration, with the Admin and the Head only (D-188)
  - name: permission.view
    name_en: View who holds which permissions
    name_bn: "কার কী পারমিশন আছে দেখা"
    description: View a user's effective permissions
    module: M02
    sensitive: false
    default:
      - { role: program_manager, scope: PROGRAM }
      - { role: regional_program_manager, scope: REGION }
  - name: project.staff_access.manage
    name_en: Give staff access on a project
    name_bn: "প্রকল্পে স্টাফের অ্যাক্সেস দেওয়া"
    description: Give staff under the RPM view/edit/delete access on a project
    module: M02
    sensitive: false
    default:
      - { role: program_manager, scope: PROGRAM }
      - { role: regional_program_manager, scope: REGION }
  - name: project.volunteer_grant.manage
    name_en: Give extra permissions on a project
    name_bn: "প্রকল্পে বাড়তি পারমিশন দেওয়া"
    description: Grant 'if RPM grants' extras (approve, add volunteers, transfer, exam, site decision) to own team members and volunteers per project
    module: M02
    sensitive: false
    default:
      - { role: regional_program_manager, scope: REGION }

