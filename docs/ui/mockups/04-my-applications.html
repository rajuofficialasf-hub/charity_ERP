<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>আমার আবেদন · মকআপ</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
  .app-card { display: flex; gap: var(--space-3); align-items: flex-start; width: 100%; text-align: left; background: var(--color-bg-surface); border: 1px solid var(--color-border-default); border-radius: var(--radius-lg); box-shadow: var(--elevation-1); padding: var(--space-3); cursor: pointer; margin-bottom: var(--space-2); }
  .app-card:hover { border-color: var(--color-border-strong); }
  .app-card[aria-current="true"] { border-color: var(--color-brand-primary-dark); background: var(--color-bg-brand-soft); }
</style>
</head>
<body data-shell="volunteer" data-active="apps">
<main id="main">
  <div class="page-head">
    <div class="page-title"><h1>আমার আবেদন</h1><p class="page-sub">শীতবস্ত্র বিতরণ 2026</p></div>
    <a class="btn btn-primary hide-phone" href="03-new-application.html"><i data-icon="file-plus"></i>নতুন আবেদন</a>
  </div>

  <div class="tabs" role="tablist" aria-label="অবস্থা অনুযায়ী">
    <button class="tab" role="tab" id="t-draft" aria-controls="p-list" data-filter="draft">খসড়া <span class="tab-count tnum">3</span></button>
    <button class="tab" role="tab" id="t-pending" aria-controls="p-list" aria-selected="true" data-filter="pending">পেন্ডিং <span class="tab-count tnum">7</span></button>
    <button class="tab" role="tab" id="t-approved" aria-controls="p-list" data-filter="approved">অনুমোদিত <span class="tab-count tnum">12</span></button>
    <button class="tab" role="tab" id="t-rejected" aria-controls="p-list" data-filter="rejected">বাতিল <span class="tab-count tnum">1</span></button>
  </div>

  <div class="split">
    <div id="p-list" role="tabpanel" aria-labelledby="t-pending">
      <div id="list"></div>
      <p class="caption muted tnum" style="text-align:center">দেখানো হচ্ছে সব · প্রতি পাতায় 25টি</p>
    </div>
    <aside class="split-detail" id="detail" aria-label="আবেদনের বিস্তারিত"></aside>
  </div>
  <button class="detail-scrim" type="button" data-detail-close aria-label="বিস্তারিত বন্ধ করুন"></button>
</main>

<script src="icons.js"></script>
<script src="mockup.js"></script>
<script>
document.addEventListener('mock:ready', function () {
  var I = window.mockIcon;
  var BADGE = {
    draft: ['', 'circle-dashed', 'খসড়া'], submitted: ['t-info', 'send', 'অফিসে জমা'], under_review: ['t-info', 'search', 'রিভিউ চলছে'],
    reviewed: ['t-info', 'clipboard-check', 'রিভিউ শেষ'], waitlisted: ['t-warning', 'clock', 'ওয়েটলিস্ট'], approved: ['t-success', 'circle-check', 'অনুমোদিত'],
    rejected: ['t-danger', 'circle-x', 'বাতিল'], correction: ['t-warning', 'pencil-line', 'সংশোধন দরকার']
  };
  function badge(s) { var b = BADGE[s]; return '<span class="badge ' + b[0] + '">' + I(b[1]) + b[2] + '</span>'; }
  var apps = [
    { id: 'WNT-2026-00184', name: 'আমেনা খাতুন (নমুনা)', village: 'বনগাঁও, সাভার', group: 'pending', state: 'correction', date: '07-10-2026', sync: 'synced', steps: 2, note: 'পরিবারের সদস্য সংখ্যা মিলছে না, আবার দেখুন' },
    { id: 'WNT-2026-00191', name: 'রহিমা বেগম (নমুনা)', village: 'বনগাঁও, সাভার', group: 'pending', state: 'under_review', date: '08-10-2026', sync: 'synced', steps: 2 },
    { id: 'WNT-2026-00203', name: 'জোবেদা খাতুন (নমুনা)', village: 'কাউন্দিয়া, সাভার', group: 'pending', state: 'submitted', date: '09-10-2026', sync: 'synced', steps: 1 },
    { id: 'WNT-2026-00207', name: 'মোঃ হাশেম (নমুনা)', village: 'আশুলিয়া, সাভার', group: 'pending', state: 'reviewed', date: '09-10-2026', sync: 'synced', steps: 3 },
    { id: 'WNT-2026-00215', name: 'সালমা আক্তার (নমুনা)', village: 'আশুলিয়া, সাভার', group: 'pending', state: 'waitlisted', date: '05-10-2026', sync: 'synced', steps: 3 },
    { id: 'WNT-2026-00219', name: 'করিমন নেছা (নমুনা)', village: 'বনগাঁও, সাভার', group: 'pending', state: 'submitted', date: '10-10-2026', sync: 'pending', steps: 1 },
    { id: 'WNT-2026-00222', name: 'আব্দুল মজিদ (নমুনা)', village: 'কাউন্দিয়া, সাভার', group: 'pending', state: 'submitted', date: '10-10-2026', sync: 'synced', steps: 1 },
    { id: 'DRAFT-3', name: 'ফাতেমা বেগম (নমুনা)', village: 'বনগাঁও, সাভার', group: 'draft', state: 'draft', date: '10-10-2026', sync: 'pending', steps: 0 },
    { id: 'DRAFT-2', name: 'নাম লেখা হয়নি', village: 'আশুলিয়া, সাভার', group: 'draft', state: 'draft', date: '09-10-2026', sync: 'pending', steps: 0 },
    { id: 'DRAFT-1', name: 'হালিমা খাতুন (নমুনা)', village: 'কাউন্দিয়া, সাভার', group: 'draft', state: 'draft', date: '08-10-2026', sync: 'synced', steps: 0 },
    { id: 'WNT-2026-00101', name: 'মরিয়ম বিবি (নমুনা)', village: 'বনগাঁও, সাভার', group: 'approved', state: 'approved', date: '01-10-2026', sync: 'synced', steps: 4 },
    { id: 'WNT-2026-00102', name: 'আয়েশা সিদ্দিকা (নমুনা)', village: 'কাউন্দিয়া, সাভার', group: 'approved', state: 'approved', date: '01-10-2026', sync: 'synced', steps: 4 },
    { id: 'WNT-2026-00140', name: 'জাহানারা বেগম (নমুনা)', village: 'আশুলিয়া, সাভার', group: 'rejected', state: 'rejected', date: '03-10-2026', sync: 'synced', steps: 3, reason: 'একই পরিবার থেকে আরেকটি আবেদন অনুমোদিত হয়েছে' }
  ];
  var filter = 'pending', selected = null;
  var list = document.getElementById('list'), detail = document.getElementById('detail');
  function syncBadge(a) { return a.sync === 'pending' ? '<span class="badge">' + I('clock') + 'সিঙ্ক বাকি</span>' : ''; }
  function renderList() {
    var rows = apps.filter(function (a) { return a.group === filter; });
    if (!rows.length) { list.innerHTML = '<div class="empty">' + I('inbox', 'icon-lg') + '<h3>এখানে কোনো আবেদন নেই</h3></div>'; return; }
    list.innerHTML = rows.map(function (a) {
      return '<button class="app-card" type="button" data-id="' + a.id + '"' + (a.id === selected ? ' aria-current="true"' : '') + '><div class="grow"><div class="strong">' + a.name + '</div><div class="caption muted tnum">' + a.id + ' · ' + a.village + ' · ' + a.date + '</div><div class="cluster" style="margin-top:6px">' + badge(a.state) + syncBadge(a) + '</div></div>' + I('chevron-right') + '</button>';
    }).join('');
  }
  var STEPS = ['অফিসে জমা', 'রিভিউ চলছে', 'রিভিউ শেষ', 'অনুমোদিত'];
  function renderDetail(a) {
    if (!a) { detail.innerHTML = '<div class="empty">' + I('mouse-pointer-click', 'icon-lg') + '<h3>একটি আবেদন বাছাই করুন</h3></div>'; return; }
    var tl = STEPS.map(function (s, i) {
      var cls = i < a.steps ? 'is-done' : (i === a.steps ? 'is-current' : '');
      if (a.state === 'rejected' && i === 3) return '<li class="is-rejected"><span class="dot">' + I('x', 'icon-sm') + '</span><div class="step-title">বাতিল</div><div class="step-meta">' + a.reason + '</div></li>';
      if (a.state === 'waitlisted' && i === 3) return '<li class="is-current"><span class="dot"></span><div class="step-title">ওয়েটলিস্টে</div><div class="step-meta">কোটা পূর্ণ; জায়গা হলে অনুমোদন হতে পারে</div></li>';
      return '<li class="' + cls + '"><span class="dot">' + (i < a.steps ? I('check') : '') + '</span><div class="step-title">' + s + '</div><div class="step-meta tnum">' + (i < a.steps ? '0' + (7 + i) + '-10-2026' : '') + '</div></li>';
    }).join('');
    var draft = a.state === 'draft';
    detail.innerHTML =
      '<div class="detail-head"><button class="icon-btn detail-close" type="button" data-detail-close>' + I('arrow-left') + '<span class="sr-only">তালিকায় ফিরুন</span></button><div class="grow"><h2>' + a.name + '</h2><div class="caption muted tnum">' + a.id + ' · ' + a.village + '</div><div class="cluster" style="margin-top:6px">' + badge(a.state) + syncBadge(a) + '</div></div></div>' +
      '<div class="detail-body">' +
      (a.note ? '<div class="alert t-warning">' + I('pencil-line') + '<div><div class="alert-title">অফিস সংশোধন চেয়েছে</div><p>"' + a.note + '"</p><p class="caption muted">প্রজেক্ট এক্সিকিউটিভ · 2 ঘণ্টা আগে</p></div></div>' : '') +
      (draft ? '<div class="alert">' + I('save') + '<div>খসড়াটি শুধু এই ফোনে আছে। অফিসে পাঠালে রিভিউ শুরু হবে।</div></div>' : '<section class="detail-section"><h3>অগ্রগতি</h3><ol class="timeline">' + tl + '</ol></section>') +
      '<section class="detail-section"><h3>তথ্য</h3><dl class="kv"><dt>পিতা/স্বামী</dt><dd>মৃত আব্দুল হক (নমুনা)</dd><dt>মোবাইল</dt><dd class="tnum">01700000123</dd><dt>ধরন</dt><dd>বিধবা</dd><dt>পরিবারের সদস্য</dt><dd class="tnum">5</dd><dt>মাসিক আয়</dt><dd class="tnum">৳ 6,000</dd></dl><p class="caption muted" style="margin-top:8px">NID ও অফিসিয়াল অংশ স্বেচ্ছাসেবকদের দেখানো হয় না।</p></section>' +
      '<section class="detail-section"><h3>ছবি</h3><div class="photos"><div class="photo">' + I('image') + '<span class="badge t-success">' + I('shield-check') + 'যাচাইকৃত</span><span class="stamp">07-10-2026 সকাল 11:05<br>23.8456, 90.2567</span></div></div></section>' +
      '</div>' +
      ((a.note || draft) ? '<div class="action-bar">' + (draft ? '<button class="btn btn-secondary" type="button" data-toast="খসড়া মুছে ফেলার আগে নিশ্চিত করতে বলা হবে (মকআপ)">মুছুন</button><a class="btn btn-primary" href="03-new-application.html">খসড়া খুলুন</a>' : '<a class="btn btn-primary" href="03-new-application.html">সংশোধন করুন</a>') + '</div>' : '');
  }
  list.addEventListener('click', function (e) {
    var c = e.target.closest('.app-card'); if (!c) return;
    selected = c.getAttribute('data-id');
    renderList(); renderDetail(apps.filter(function (a) { return a.id === selected; })[0]);
    document.body.classList.add('detail-open');
    var h = detail.querySelector('h2'); if (h) { h.tabIndex = -1; h.focus(); }
  });
  document.addEventListener('mock:tab', function (e) {
    var t = document.getElementById(e.detail); filter = t.getAttribute('data-filter');
    document.getElementById('p-list').setAttribute('aria-labelledby', e.detail);
    document.getElementById('p-list').hidden = false;
    renderList();
  });
  var hash = location.hash.replace('#', '');
  var first = apps.filter(function (a) { return a.id === hash; })[0];
  renderList();
  if (first) { selected = first.id; renderList(); renderDetail(first); document.body.classList.add('detail-open'); }
  else if (window.matchMedia('(min-width: 1024px)').matches) { selected = apps[0].id; renderList(); renderDetail(apps[0]); }
  else renderDetail(null);
});
</script>
</body>
</html>
