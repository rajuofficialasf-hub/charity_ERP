// a quiet generated cover: soft green hills and a sun, seeded per card (an uploaded photo replaces it)
function paintCover(canvas, seed) {
  const r = canvas.getBoundingClientRect(); const dpr = devicePixelRatio || 1;
  canvas.width = Math.max(1, r.width * dpr); canvas.height = Math.max(1, r.height * dpr);
  const c = canvas.getContext('2d'); c.scale(dpr, dpr); const w = r.width, h = r.height;
  let s = seed * 9301 + 49297; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#C8FAD6'); g.addColorStop(1, '#5BE49B'); c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.fillStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.arc(w * (.6 + rnd() * .3), h * .32, 18 + rnd() * 10, 0, 7); c.fill();
  ['#00A76F', '#007867', '#004B50'].forEach((col, i) => {
    c.fillStyle = col; c.beginPath(); c.moveTo(0, h);
    const base = h * (.55 + i * .14), amp = 10 + rnd() * 16, ph = rnd() * 6;
    for (let x = 0; x <= w; x += 8) c.lineTo(x, base - Math.sin(x / (60 + i * 30) + ph) * amp);
    c.lineTo(w, h); c.fill();
  });
}

      <div class="field"><label for="f-src">যেখান থেকে কপি হবে</label><div class="input" id="f-src">সেশন ${current(p).label}</div></div>
      <div class="checks"><div><h4>কপি হবে</h4><ul><li>উপাদান ও তাদের সেটিং</li><li>আবেদন ফর্ম</li><li>নিয়মাবলি</li><li>দাওয়াহ সিলেবাস</li><li>স্কোরের নিয়ম</li></ul></div>
      <div><h4>নতুন করে দিতে হবে</h4><ul><li>তারিখ ও আবেদনের সময়</li><li>বাজেটের অঙ্ক</li><li>এলাকা ও RPM</li><li>স্বেচ্ছাসেবক</li><li>কোটার লক্ষ্য</li></ul></div></div>
    </div>
    <footer><button type="button" class="btn btn-line" data-close>বাতিল</button><button type="button" class="btn btn-dark" data-close>খসড়া তৈরি করুন</button></footer>`
  : kind === 'program' ? `
    <header><h2>প্রোগ্রাম</h2></header>
    <div class="body"><div class="field"><label>নাম (বাংলা)</label><div class="input">আন্ডারপ্রিভিলেজড কমিউনিটি ডেভেলপমেন্ট প্রোগ্রাম</div></div>
      <div class="field"><label>প্রোগ্রাম ম্যানেজার</label><div class="input">ফরিদুর রহমান সাগর</div></div>
      <div class="field"><label>ছোট বিবরণ</label><div class="input">অসহায় পরিবারকে টেকসইভাবে স্বাবলম্বী করার কাজ…</div></div>
      <div class="field"><label>কভার ছবি</label><div class="input">ছবি বেছে নিন (JPEG, PNG বা WebP) · না দিলে ইলাস্ট্রেশন দেখাবে</div></div></div>
    <footer><button type="button" class="btn btn-line" data-close>বাতিল</button><button type="button" class="btn btn-dark" data-close>সেভ করুন</button></footer>`
  : `<header><h2>প্রকল্প</h2></header>
    <div class="body"><div class="two"><div class="field"><label>কোড</label><div class="input">SWB</div></div><div class="field"><label>প্রোগ্রাম</label><div class="input">আন্ডারপ্রিভিলেজড…</div></div></div>
      <div class="field"><label>নাম (বাংলা)</label><div class="input">স্বাবলম্বী প্রকল্প</div></div>
      <div class="field"><label>ছোট বিবরণ</label><div class="input">…</div></div>
      <div class="field"><label>কভার ছবি</label><div class="input">ছবি বেছে নিন · না দিলে ইলাস্ট্রেশন দেখাবে</div></div>
      <p class="example">নতুন প্রকল্প সেভ হলে প্রথম সেশনের সেটআপ খুলবে।</p></div>
    <footer><button type="button" class="btn btn-line" data-close>বাতিল</button><button type="button" class="btn btn-dark" data-close>সেভ করুন</button></footer>`;
  root.innerHTML = `<div class="scrim" data-close-scrim><div class="dialog" role="dialog" aria-modal="true">${body}</div></div>`;
  root.querySelector('[data-close]')?.focus();
}

document.addEventListener('click', e => {
  const t = e.target.closest('button, a'); if (!t) { if (e.target.matches('[data-close-scrim]')) document.getElementById('dialog-root').innerHTML = ''; return; }
  if (t.dataset.flip !== undefined) { t.closest('.flip').classList.toggle('flipped'); return; }
  if (t.dataset.role) { role = t.dataset.role; document.querySelectorAll('#roles button').forEach(b => b.setAttribute('aria-pressed', b === t)); render(); return; }
  if (t.dataset.size) { size = t.dataset.size; document.querySelectorAll('#sizes button').forEach(b => b.setAttribute('aria-pressed', b === t)); render(); return; }
  if (t.dataset.go) { location.hash = t.dataset.go; return; }
  if (t.dataset.dialog) { openDialog(t.dataset.dialog, t.dataset.project); return; }
  if (t.dataset.close !== undefined) { document.getElementById('dialog-root').innerHTML = ''; return; }
  if (t.dataset.session) lastSession = t.dataset.session;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('dialog-root').innerHTML = ''; });
addEventListener('hashchange', () => { render(); scrollTo(0, 0); });
addEventListener('resize', () => document.querySelectorAll('canvas[data-seed]').forEach(c => paintCover(c, +c.dataset.seed)));
render();
</script>
